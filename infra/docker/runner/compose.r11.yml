services:
  cb16-runner-r11:
    image: cb16-runner-r11:2.337.0
    build:
      context: ../../..
      dockerfile: infra/docker/runner/Dockerfile
    container_name: cb16-runner-r11
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    gpus: all
    tmpfs:
      - /tmp
      - /run:size=64m,mode=0755
    networks:
      - cb16-net
    environment:
      HTTP_PROXY: http://cb16-gost:33128
      HTTPS_PROXY: http://cb16-gost:33128
      NO_PROXY: localhost,127.0.0.1
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      RUNNER_URL: https://github.com/GY-Bai/CB16-R10
      RUNNER_NAME: shanxi-docker-r11
      RUNNER_LABELS: shanxi,shanxi-docker-r11
      RUNNER_TOKEN_FILE: /run/secrets/github-runner-token
      CB16_RAW_ROOT: /cb16/raw
      CB16_G0_ROOT: /cb16/g0
      CB16_R11_G0_ROOT: /cb16/g0
      CB16_R104_ROOT: /cb16/runtime/r104
      CB16_VERIFIED_VENV: /cb16/venv
      CB16_UV_CACHE_DIR: /cb16/uv-cache
      CB16_CI_WORKER_ROOT: /cb16/worker
      CB16_PROVISION_ENV: /run/secrets/cb16-provision.env
      CB16_PACKAGE_ROOT: /cb16/package
      CB16_PARENT_R101_ROOT: /cb16/parent-r101
      CB16_PARENT_G0: /cb16/parents/r10_1.pt
    volumes:
      - cb16-raw:/cb16/raw:ro
      - cb16-g0:/cb16/g0
      - cb16-runtime-r104:/cb16/runtime/r104:ro
      - cb16-r2-native:/cb16/r2-native
      - cb16-r2-authority:/cb16/r2-authority:ro
      - cb16-venv:/cb16/venv
      - cb16-uv-cache:/cb16/uv-cache
      - cb16-worker:/cb16/worker
      - cb16-package:/cb16/package:ro
      - cb16-parent-r101:/cb16/parent-r101:ro
      - cb16-parent-g0:/cb16/parents:ro
      - cb16-config:/run/secrets:ro

networks:
  cb16-net:
    external: true

volumes:
  cb16-raw:
    external: true
  cb16-g0:
    external: true
  cb16-runtime-r104:
    external: true
  cb16-r2-native:
    external: true
  cb16-r2-authority:
    external: true
  cb16-venv:
    external: true
  cb16-uv-cache:
    external: true
  cb16-worker:
    external: true
  cb16-package:
    external: true
  cb16-parent-r101:
    external: true
  cb16-parent-g0:
    external: true
  cb16-config:
    external: true
