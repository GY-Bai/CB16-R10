name: CB16 R11 Stage-3 Integrated Smoke

on:
  push:
    branches:
      - ai/r11-stage3-integration-r0
    paths:
      - .github/workflows/cb16-r11-stage3-integrated-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage3-integrated-smoke
  cancel-in-progress: false

jobs:
  integrated:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 20
    env:
      PACKAGE_ROOT: /data/cb16_ci/r2-authority/package_r102
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
      R11_DIAG_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_MODE: offline
      CB16_R11_CANONICAL_DTYPE: FP32
      CB16_R11_AMP: '0'

    steps:
      - name: Checkout integrated Stage-3 source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: true

      - name: Fail-closed integrated ancestry and scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ai/r11-stage3-integration-r0"
          BASE=92f1ca011aec27bbe9e89ac5ba9afe74817ee2de
          E1=623cf76630bca4d0177d5e3e28908d535fdc9baa
          E2=4d9db584ae0322ec9f041bb639b201f390de48aa
          E3=3eca71fc81167d1ee5ac90a77d6a85cca562f8b7
          for x in "$BASE" "$E1" "$E2" "$E3"; do git merge-base --is-ancestor "$x" HEAD; done
          FREEZE=authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json
          test "$(git rev-parse "HEAD:$FREEZE")" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          python3 - <<'PY'
          import subprocess
          base='92f1ca011aec27bbe9e89ac5ba9afe74817ee2de'
          allowed={
            '.github/cb16-r11-stage3-e1-trigger.json',
            '.github/workflows/cb16-r11-stage3-e1-data-plane-soak.yml',
            'cb16_local_opt/stage3_e1_endurance_r11.py',
            'scripts/run_r11_stage3_e1_data_plane_soak.py',
            'tests/test_stage3_e1_endurance_r11.py',
            '.github/workflows/stage3-e2-lineage-soak.yml',
            'cb16_local_opt/stage3_e2_lineage_soak_r11.py',
            'tests/test_stage3_e2_lineage_soak_r11.py',
            'tests/test_stage3_e2_release_boundary_r11.py',
            '.github/workflows/cb16-r11-stage3-e3-crash-recovery.yml',
            'cb16_local_opt/stage3_e3_crash_recovery_r11.py',
            'tests/test_stage3_e3_crash_recovery_r11.py',
            'scripts/run_r11_stage3_integrated_e3_matrix.py',
            '.github/workflows/cb16-r11-stage3-integrated-smoke.yml',
          }
          changed={x for x in subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'], text=True).splitlines() if x}
          extra=sorted(changed-allowed)
          forbidden=sorted(x for x in changed if x.startswith('authority/') or 'final_holdout' in x.lower() or '2025-09' in x)
          assert not extra, f'STAGE3_INTEGRATION_UNSCOPED_CHANGE:{extra}'
          assert not forbidden, f'STAGE3_INTEGRATION_FORBIDDEN_CHANGE:{forbidden}'
          print('CB16_R11_STAGE3_INTEGRATION_SCOPE=PASS')
          PY

      - name: Verify read-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PACKAGE_ROOT"
          test -d "$LEGACY_R104_ROOT/evidence_cache"
          pkg_opts="$(findmnt -n -o OPTIONS -T "$PACKAGE_ROOT")"
          r104_opts="$(findmnt -n -o OPTIONS -T "$LEGACY_R104_ROOT")"
          case ",$pkg_opts," in *,ro,*) ;; *) echo "PACKAGE_AUTHORITY_NOT_RO=$pkg_opts" >&2; exit 74 ;; esac
          case ",$r104_opts," in *,ro,*) ;; *) echo "R104_AUTHORITY_NOT_RO=$r104_opts" >&2; exit 74 ;; esac
          active="$(ps -eo pid=,comm=,args= | awk '$2 ~ /^python/ && $0 ~ /run_r104_long_research\.py/ {print}' || true)"
          test -z "$active" || { echo 'ACTIVE_LEGACY_R104_PROCESS_REFUSED' >&2; echo "$active" >&2; exit 75; }

      - name: Resolve canonical Pascal Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          "$PYBIN" - <<'PY'
          import os, torch
          assert os.cpu_count() == 16
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.version.cuda == '12.6'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0)) == (6,1)
          assert 'GTX 1060' in torch.cuda.get_device_name(0)
          assert torch.get_default_dtype() == torch.float32
          assert torch.backends.cuda.matmul.allow_tf32 is False
          print('CB16_R11_STAGE3_INTEGRATED_CANONICAL_ENV=PASS')
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Compile and run merged Stage-3 correctness gates
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile \
            cb16_local_opt/stage3_e1_endurance_r11.py \
            scripts/run_r11_stage3_e1_data_plane_soak.py \
            cb16_local_opt/stage3_e2_lineage_soak_r11.py \
            cb16_local_opt/stage3_e3_crash_recovery_r11.py \
            scripts/run_r11_stage3_integrated_e3_matrix.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage3_e1_endurance_r11.py \
            tests/test_stage3_e2_lineage_soak_r11.py \
            tests/test_stage3_e2_release_boundary_r11.py \
            tests/test_stage3_e3_crash_recovery_r11.py \
            -k 'not 1000_generation_extension and not repository_guard_is_fail_closed_on_current_e3_branch'
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root . | tee ci_evidence/semantic_freeze.log

      - name: Run integrated E2 100-generation control-plane qualification
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          rm -rf ci_stage3_integration_e2
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.stage3_e2_lineage_soak_r11 \
            --root ci_stage3_integration_e2 \
            --repo-root . \
            --generations 100 \
            --synchronous FULL \
            --report ci_evidence/stage3_integration_e2_100.json

      - name: Run integrated E3 20-case crash matrix
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          E3_ROOT: /var/tmp/cb16-r11-stage3-integration-e3-${{ github.run_id }}-${{ github.run_attempt }}
          E3_REPORT: ${{ github.workspace }}/ci_evidence/stage3_integration_e3_20.json
        run: |
          set -euo pipefail
          rm -rf "$E3_ROOT"
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/run_r11_stage3_integrated_e3_matrix.py

      - name: Prepare integrated E1 disposable SSD HDD roots
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          SSD_ROOT="/var/tmp/cb16-r11-stage3-integrated-e1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          HDD_ROOT="$R11_DIAG_ROOT/r11-stage3-integrated-e1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SSD_ROOT" "$HDD_ROOT"
          mkdir -p "$SSD_ROOT" "$HDD_ROOT"
          echo "ssd=$SSD_ROOT" >> "$GITHUB_OUTPUT"
          echo "hdd=$HDD_ROOT" >> "$GITHUB_OUTPUT"

      - name: Run integrated 60-second persistent data-plane smoke
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          CB16_R11_E1_PACKAGE_ROOT: ${{ env.PACKAGE_ROOT }}
          CB16_R11_E1_LEGACY_R104_ROOT: ${{ env.LEGACY_R104_ROOT }}
          CB16_R11_E1_SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          CB16_R11_E1_HDD_ROOT: ${{ steps.roots.outputs.hdd }}
          CB16_R11_E1_OUT: ${{ github.workspace }}/ci_evidence/stage3_integration_e1_60s.json
          CB16_R11_E1_DURATION_SECONDS: '60'
          CB16_R11_E1_SAMPLE_SECONDS: '5'
          CB16_R11_E1_TEACHER_WORKERS: '8'
          CB16_R11_E1_TRACE_WORKERS: '8'
          CB16_R11_E1_QUEUE_DEPTH: '8'
          CB16_R11_E1_BUFFER_MIB: '64'
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/run_r11_stage3_e1_data_plane_soak.py 2>&1 | tee ci_evidence/stage3_integration_e1_60s.log

      - name: Stage-3 integrated machine-readable adjudication
        if: always()
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          test -n "${PY:-}"
          test -f ci_evidence/stage3_integration_e1_60s.json
          test -f ci_evidence/stage3_integration_e2_100.json
          test -f ci_evidence/stage3_integration_e3_20.json
          "$PY" - <<'PY'
          import json, os
          from pathlib import Path
          e1=json.loads(Path('ci_evidence/stage3_integration_e1_60s.json').read_text())
          e2=json.loads(Path('ci_evidence/stage3_integration_e2_100.json').read_text())
          e3=json.loads(Path('ci_evidence/stage3_integration_e3_20.json').read_text())
          assert e1['status']=='PASS', e1
          assert e1['correctness_identity']['verdict']=='PASS'
          assert e1['runtime_endurance']['verdict']=='PASS'
          assert e1['engineering']['measured_seconds'] >= 55
          assert e1['correctness_identity']['checks']['final_holdout_untouched'] is True
          assert e1['correctness_identity']['checks']['frozen_authority_unchanged'] is True
          assert e1['correctness_identity']['checks']['replay_created_zero'] is True
          assert e2['verdict']=='PASS', e2.get('first_failure')
          assert e2['completed_generations']==100
          assert e2['runtime_endurance']['restart_reconstruction_checks']==100
          assert e2['final_holdout_opened'] is False
          assert e2['fresh_market_data_downloaded'] is False
          assert e3['cases_total']==20 and e3['cases_passed']==20
          out={
            'schema':'CB16_R11_STAGE3_INTEGRATED_SMOKE_V1',
            'status':'PASS',
            'integration_head':os.environ['GITHUB_SHA'],
            'stage2_qualified_base':'92f1ca011aec27bbe9e89ac5ba9afe74817ee2de',
            'qualified_inputs':{
              'e1_head':'623cf76630bca4d0177d5e3e28908d535fdc9baa',
              'e1_run':34183247453,
              'e1_artifact_sha256':'da685fe9f4dd2cf9c217e60446cd6571ba130040a24ca7f79990bd55b75f91f9',
              'e2_head':'4d9db584ae0322ec9f041bb639b201f390de48aa',
              'e2_run':34181561564,
              'e2_artifact_sha256':'25c906c10f77b4e51916ec68fb78da1f2b8f7710be9faa3165e9f7827e4aab13',
              'e3_head':'3eca71fc81167d1ee5ac90a77d6a85cca562f8b7',
              'e3_run':34181161853,
            },
            'fresh_integration_checks':{
              'e1_60s':'PASS','e2_100_generation':'PASS','e3_20_case_matrix':'PASS'
            },
            'scientific_semantics_changed':False,
            'new_scientific_verdict':False,
            'final_holdout_opened':False,
            'fresh_market_data_downloaded':False,
            'next_authorized_rung':'E4_30M_DATA_PLANE_SOAK',
          }
          Path('ci_evidence/CB16_R11_STAGE3_INTEGRATED_SMOKE_V1.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('CB16_R11_STAGE3_INTEGRATED_SMOKE=PASS')
          PY

      - name: Upload integrated Stage-3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage3-integrated-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          retention-days: 30

      - name: Cleanup integrated disposable roots
        if: always()
        shell: bash
        env:
          SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          HDD_ROOT: ${{ steps.roots.outputs.hdd }}
          E3_ROOT: /var/tmp/cb16-r11-stage3-integration-e3-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          [ -n "${SSD_ROOT:-}" ] && rm -rf "$SSD_ROOT"
          [ -n "${HDD_ROOT:-}" ] && rm -rf "$HDD_ROOT"
          [ -n "${E3_ROOT:-}" ] && rm -rf "$E3_ROOT"
          rm -rf ci_stage3_integration_e2
          exit 0
