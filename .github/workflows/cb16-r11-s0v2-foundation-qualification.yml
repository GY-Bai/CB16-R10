name: CB16 R11 S0v2 Foundation Qualification

on:
  push:
    branches:
      - ai/r11-s0v2-durable-learnability-foundation-r0
    paths:
      - "cb16_local_opt/post_cc_*.py"
      - "cb16_local_opt/cc_policy_brain_r0.py"
      - "cb16_local_opt/cc_policy_distribution_r0.py"
      - "cb16_local_opt/cc_vtrace_r0.py"
      - "cb16_local_opt/cc_critic_value_r0.py"
      - "cb16_local_opt/cc_runtime_account_loop_r0.py"
      - "cb16_local_opt/cc_runtime_generation_switch_r0.py"
      - "tests/cc_s0v2_support.py"
      - "tests/test_post_cc_s0v2_*.py"
      - "scripts/run_r11_s0v2_foundation_qualification.py"
      - "authority/rearchitecture_r11/CB16_R11_S0V2_*.json"
      - ".github/workflows/cb16-r11-s0v2-foundation-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_UV_CACHE_DIR: /cb16/uv-cache
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  s0v2-foundation-qualification:
    name: S0v2 Durable Learnability Foundation Qualification
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout S0v2 implementation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/s0v2_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s0v2_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          print('S0V2_PYTHON_ENV_READY')
          PY

      - name: Verify baseline lineage and frozen receipt immutability
        shell: bash
        run: |
          set -euo pipefail
          BASE=392063881a6ef0dd1776ac579f1a290a134fc49e
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git hash-object authority/rearchitecture_r11/CB16_R11_CC_INTEGRATION_RECEIPT_V1.json)" = "3fea57a6c5d3a0a2ad5d88d99e6041b7fe9973e5"
          test "$(git hash-object authority/rearchitecture_r11/CB16_R11_CC_THREAD_C_RECEIPT_V1.json)" = "bbddafb75878dfe98ef36c5ced71e4e3a36e5ddc"
          test "$(git hash-object authority/rearchitecture_r11/CB16_R11_POST_CC_S0_RECEIPT_V1.json)" = "5cd6d3ac74d6241d70588f0d8b58a1d74bba0da2"
          if git diff --name-only "$BASE" HEAD -- \
            authority/rearchitecture_r11/CB16_R11_CC_INTEGRATION_RECEIPT_V1.json \
            authority/rearchitecture_r11/CB16_R11_CC_THREAD_C_RECEIPT_V1.json \
            authority/rearchitecture_r11/CB16_R11_POST_CC_S0_RECEIPT_V1.json | grep -q .; then
            echo HISTORICAL_RECEIPT_MUTATION_DETECTED >&2
            exit 1
          fi
          test ! -e data/2025-09
          test ! -e final_holdout
          echo S0V2_BASELINE_AND_FIREWALL_PASS

      - name: Run focused S0v2 and regression tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s0v2_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          PYTHONPATH=. "$PYTHON" -m pytest -q \
            tests/test_post_cc_s0v2_*.py \
            tests/test_post_cc_s0_*.py \
            tests/test_cc_integration_r0.py \
            tests/test_cc_integration_hostile_r0.py \
            tests/test_cc_learner_r0.py \
            tests/test_cc_learner_transaction_r0.py \
            tests/test_cc_learner_checkpoint_r0.py \
            tests/test_cc_learner_batch_r0.py \
            tests/test_cc_policy_brain_r0.py \
            tests/test_cc_policy_distribution_r0.py \
            tests/test_cc_vtrace_r0.py \
            tests/test_cc_critic_value_r0.py \
            tests/test_cc_critic_bootstrap_r0.py \
            tests/test_cc_experience_store_r0.py \
            tests/test_cc_experience_transaction_r0.py \
            tests/test_cc_experience_sequence_r0.py \
            tests/test_cc_account_recovery_r0.py \
            tests/test_cc_runtime_generation_switch_r0.py \
            tests/test_cc_runtime_account_loop_r0.py
          PYTHONPATH=. "$PYTHON" -m compileall -q cb16_local_opt scripts tests

      - name: Run S0v2 foundation qualification
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s0v2_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          PYTHONPATH=. "$PYTHON" scripts/run_r11_s0v2_foundation_qualification.py \
            --output "$RUNNER_TEMP/S0V2_QUALIFICATION_RESULT.json"

      - name: Emit S0v2 execution receipt
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s0v2_python.json"
          RESULT="$RUNNER_TEMP/S0V2_QUALIFICATION_RESULT.json"
          RECEIPT="$RUNNER_TEMP/S0V2_EXECUTION_RECEIPT.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" - "$RECEIPT" "$RESULT" <<'PY'
          import json, os, platform, subprocess, sys, torch
          receipt_path, result_path = sys.argv[1:]
          result = json.load(open(result_path))
          assert result['status'] == 'PASS', result
          payload = {
              'schema': 'CB16_R11_S0V2_EXECUTION_RECEIPT_V1',
              'status': 'PASS',
              'git_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'git_tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'runner_name': os.environ.get('RUNNER_NAME'),
              'runner_os': os.environ.get('RUNNER_OS'),
              'python_version': platform.python_version(),
              'torch_version': torch.__version__,
              'all_s0v2_gates_pass': all(result['gates'].values()),
              'compiler_id': result['compiler_id'],
              'artifact_contract': 'CB16_R11_S0V2_FOUNDATION_QUALIFICATION_V1',
              'historical_receipts_modified': False,
              'FINAL_opened': False,
              'fresh_data_used': False,
              'ECONOMIC_evidence_claimed': False,
              'TRANSFER_evidence_claimed': False,
              'end_to_end_learnability_claimed': False,
          }
          with open(receipt_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload S0v2 qualification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-s0v2-foundation-qualification
          path: |
            ${{ runner.temp }}/S0V2_QUALIFICATION_RESULT.json
            ${{ runner.temp }}/S0V2_EXECUTION_RECEIPT.json
            ${{ runner.temp }}/s0v2_docker_preflight.json
            ${{ runner.temp }}/s0v2_python.json
          if-no-files-found: error
          retention-days: 30
