# qualification source: fc45461c1a70385a157b968a90dc340419fe5d0f
name: CB16 R11 CC Thread A Smoke (temporary)

on:
  push:
    branches:
      - ai/r11-cc-thread-a-runtime-r0
    paths:
      - cb16_local_opt/cc_*.py
      - tests/test_cc_*.py
      - tests/cc_thread_a_support_r0.py
      - authority/rearchitecture_r11/CB16_R11_CC_THREAD_A_*.json
      - .github/workflows/cb16-r11-cc-thread-a-smoke-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thread-a-smoke:
    name: Thread A semantic smoke on Shanxi Docker
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 10
    steps:
      - name: Checkout Thread A
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and Python
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$GITHUB_SHA"
          git rev-parse HEAD
          if [ -x /cb16/venv/bin/python ]; then
            PY=/cb16/venv/bin/python
          else
            PY=python3
          fi
          "$PY" --version
          "$PY" -c 'import pytest; print("pytest", pytest.__version__)'

      - name: Compile Thread A modules
        shell: bash
        run: |
          set -euo pipefail
          if [ -x /cb16/venv/bin/python ]; then PY=/cb16/venv/bin/python; else PY=python3; fi
          "$PY" -m py_compile \
            cb16_local_opt/cc_runtime_wire_r0.py \
            cb16_local_opt/cc_clock_r0.py \
            cb16_local_opt/cc_runtime_decision_schedule_r0.py \
            cb16_local_opt/cc_environment_advance_r0.py \
            cb16_local_opt/cc_environment_lifecycle_r0.py \
            cb16_local_opt/cc_runtime_account_loop_r0.py \
            cb16_local_opt/cc_account_recovery_r0.py \
            cb16_local_opt/cc_runtime_boundary_r0.py \
            cb16_local_opt/cc_runtime_generation_switch_r0.py \
            cb16_local_opt/cc_runtime_reference_scheduler_r0.py \
            cb16_local_opt/cc_runtime_qualification_r0.py

      - name: Run Thread A qualification tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -x /cb16/venv/bin/python ]; then PY=/cb16/venv/bin/python; else PY=python3; fi
          "$PY" -m pytest -q \
            tests/test_cc_thread_a_baseline_r0.py \
            tests/test_cc_runtime_wire_r0.py \
            tests/test_cc_clock_r0.py \
            tests/test_cc_runtime_decision_schedule_r0.py \
            tests/test_cc_environment_advance_r0.py \
            tests/test_cc_environment_lifecycle_r0.py \
            tests/test_cc_runtime_account_loop_r0.py \
            tests/test_cc_account_recovery_r0.py \
            tests/test_cc_runtime_boundary_r0.py \
            tests/test_cc_runtime_generation_switch_r0.py \
            tests/test_cc_runtime_reference_scheduler_r0.py \
            tests/test_cc_runtime_hostile_matrix_r0.py \
            tests/test_cc_runtime_qualification_r0.py
