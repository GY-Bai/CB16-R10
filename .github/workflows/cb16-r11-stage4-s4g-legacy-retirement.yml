name: CB16 R11 Stage4 S4G Legacy Retirement

on:
  push:
    branches:
      - ai/r11-stage4-task-g-legacy-retirement-r0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4g-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Gatework and S4G tests
        run: python -m pytest -q tests/test_stage4_gatework_r11.py tests/test_stage4_legacy_retirement_r11.py
      - name: Static semantic authority guard
        run: python -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
      - name: S4G policy matrix audit
        run: python scripts/audit_r11_stage4_legacy_authority.py --self-check
      - name: Validate S4G receipt when present
        if: ${{ hashFiles('authority/rearchitecture_r11/stage4_receipts/S4G_RECEIPT_V1.json') != '' }}
        run: python scripts/check_r11_stage4_task_receipt.py --receipt authority/rearchitecture_r11/stage4_receipts/S4G_RECEIPT_V1.json --repo-root .
