name: CB16 R11 Science G0 Distributional Belief Decision Bridge R3.4

on:
  push:
    branches:
      - ai/r11-science-g0-distributional-belief-decision-bridge-r3-4
    paths:
      - authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_STUDENT_COMPATIBILITY_PROJECTION_R3_3_ADJUDICATION_V1.json
      - authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_BELIEF_DECISION_BRIDGE_R3_4_GATEWORK_V1.json
      - cb16_local_opt/distributional_belief_decision_bridge_r34.py
      - tests/test_distributional_belief_decision_bridge_r34.py
      - scripts/r11_science_g0_distributional_belief_decision_bridge_r3_4.py
      - scripts/r11_science_g0_distributional_belief_decision_bridge_r3_4_entrypoint.py
      - .github/workflows/cb16-r11-science-g0-distributional-belief-decision-bridge-r3-4.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env
  CB16_PACKAGE_ROOT: /cb16/package

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  belief-decision-bridge-r3-4:
    name: R11 distributional belief decision bridge R3.4
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_science_g0_r3_4_docker_preflight.json"

      - name: Verify R3.3 adjudication and immutable authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a4de92de34e8ae27c20c607cf5574473892214ed HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/typed_central_brain_r10.py)" = "899065a9b9c015fd5a0e24fc919a79ff7d3a67ff"
          test "$(git rev-parse HEAD:cb16_local_opt/training_runtime_r11.py)" = "56c227800d7a5c82ef88c691bb69d7550aee8b39"
          test "$(git rev-parse HEAD:cb16_local_opt/probabilistic_teacher_r6.py)" = "3de3092d244c3fd315950c9f8b0bf4d78c50ee2b"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_runtime_r11.py)" = "656f1483f2e6a96daae5c98eb96cd75805d3547c"
          test "$(git rev-parse HEAD:cb16_local_opt/distributional_student_shadow_r3.py)" = "2e0dac6c4ddac81f3f7f20cfc8c8789ade8f1373"
          test "$(git rev-parse HEAD:cb16_local_opt/distributional_student_shared_core_shadow_r31.py)" = "f3875d4ff873f189b06cd8b5c8784936b2828fc0"
          test "$(git rev-parse HEAD:cb16_local_opt/distributional_student_gradient_stability_r32.py)" = "34cd6c120d9dd383e1f8496dc7151c8fdd50d83c"
          test "$(git rev-parse HEAD:cb16_local_opt/distributional_student_compatibility_projection_r33.py)" = "2e1422e7959d8d64b7594d46329f7a19e2d760e8"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_distributional_student_compatibility_projection_r3_3.py)" = "1ab1e63d3fa69f7206f58b61b79607c3a2ab6c8e"
          test -f authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_STUDENT_COMPATIBILITY_PROJECTION_R3_3_ADJUDICATION_V1.json
          test -f authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_BELIEF_DECISION_BRIDGE_R3_4_GATEWORK_V1.json
          test -f /cb16/g0/authority/CB16_R11_G0_GENESIS_SOURCE_RECORD.json
          test -f /cb16/g0/authority/CB16_R11_G0_DERIVED_CACHE_LINEAGE.json
          test -f /cb16/g0/bootstrap/R11_G0_INITIAL_CHAMPION.pt
          test -d /cb16/g0/market_cache
          test -d /cb16/package

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_science_g0_r3_4_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          assert p['observed']['python_series'] == [3,10], p
          PY

      - name: Compile and run R3.4 shadow unit gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_science_g0_r3_4_python.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/distributional_belief_decision_bridge_r34.py \
            tests/test_distributional_belief_decision_bridge_r34.py \
            scripts/r11_science_g0_distributional_belief_decision_bridge_r3_4.py \
            scripts/r11_science_g0_distributional_belief_decision_bridge_r3_4_entrypoint.py
          "$PYTHON" -m pytest -q \
            tests/test_distributional_belief_decision_bridge_r34.py \
            tests/test_distributional_student_compatibility_projection_r33.py \
            tests/test_distributional_student_gradient_stability_r32.py \
            tests/test_distributional_student_shared_core_shadow_r31.py \
            tests/test_distributional_student_shadow_r3.py \
            tests/test_r11_teacher_balanced_binding.py \
            tests/test_r11_teacher_authority_candidate.py \
            tests/test_teacher_runtime_r11.py \
            tests/test_teacher_vectorized_r11.py

      - name: Execute R3.4 real-history belief bridge qualification
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_science_g0_r3_4_python.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-science-g0-distributional-belief-decision-bridge-r3-4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_science_g0_r3_4_run_root.txt"
          "$PYTHON" scripts/r11_science_g0_distributional_belief_decision_bridge_r3_4_entrypoint.py \
            --g0-root "$CB16_G0_ROOT" \
            --package-root "$CB16_PACKAGE_ROOT" \
            --work-root "$RUN_ROOT" \
            --output "$RUN_ROOT/CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_BELIEF_DECISION_BRIDGE_R3_4_RESULT.json" \
            --device cuda --symbol BTCUSDT --train-groups 48 --validation-groups 12 \
            --candidate-factor 2 --sensory-batch-size 8 --teacher-workers 4 --teacher-block-targets 32

      - name: Verify R3.4 receipt
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_science_g0_r3_4_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_BELIEF_DECISION_BRIDGE_R3_4_RESULT.json" <<'PY'
          import json, math, sys
          x=json.load(open(sys.argv[1]))
          assert x['schema'] == 'CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_BELIEF_DECISION_BRIDGE_R3_4_RESULT_V1', x
          assert x['status'] == 'R11_DISTRIBUTIONAL_BELIEF_DECISION_BRIDGE_R3_4_PASS', x
          assert x['protocol']['seed_set'] == [31337,271828,314159,161803,424242], x
          assert x['protocol']['optional_stopping'] is False, x
          assert len(x['seed_results']) == 5, x
          for row in x['seed_results']:
              a=row['aligned_belief_bridge']; s=row['shuffled_belief_bridge']; c=row['shuffle_control']
              assert a['parameter_report'] == s['parameter_report'], row
              assert a['gradient_audit_first_step']['production_student_gradient_parameter_count'] == 0, row
              assert s['gradient_audit_first_step']['production_student_gradient_parameter_count'] == 0, row
              assert a['gradient_audit_first_step']['distributional_head_gradient_parameter_count'] == 0, row
              assert s['gradient_audit_first_step']['distributional_head_gradient_parameter_count'] == 0, row
              assert a['train_loss_after']['total'] < a['train_loss_before']['total'], row
              assert s['train_loss_after']['total'] < s['train_loss_before']['total'], row
              assert c['train']['whole_group_block_shuffle'] is True, row
              assert c['validation']['whole_group_block_shuffle'] is True, row
              assert c['train']['fixed_point_groups'] == 0 and c['validation']['fixed_point_groups'] == 0, row
              assert math.isfinite(a['validation_loss_after']['total']), row
              assert math.isfinite(s['validation_loss_after']['total']), row
          p=x['production_student']; g=x['semantic_guards']; q=x['bridge_information_summary']
          assert p['architecture_changed'] is False and p['training_started'] is False, x
          assert p['parameter_state_changed'] is False and p['behavior_identical'] is True, x
          assert p['policy_hash_before'] == p['policy_hash_after'], x
          assert g['canonical_generation_advanced'] is False, x
          assert g['production_student_received_shadow_gradient'] is False, x
          assert g['shared_core_received_distributional_gradient'] is False, x
          assert g['distributional_head_received_bridge_gradient'] is False, x
          assert g['historical_market_information_verdict_reopened'] is False, x
          assert g['scientific_verdict_created'] is False, x
          assert g['final_holdout_payload_opened'] is False, x
          assert g['fresh_market_data_downloaded'] is False, x
          assert g['production_cutover_authorized'] is False, x
          print(json.dumps({
              'status': x['status'],
              'aligned_better_than_shuffled_total_seed_count': q['aligned_better_than_shuffled_total_seed_count'],
              'aligned_better_than_production_total_seed_count': q['aligned_better_than_production_total_seed_count'],
              'shuffled_better_than_production_total_seed_count': q['shuffled_better_than_production_total_seed_count'],
              'aligned_minus_shuffled_total_median': q['aligned_minus_shuffled_total_median'],
              'aligned_minus_shuffled_direction_median': q['aligned_minus_shuffled_direction_median'],
              'aligned_minus_shuffled_sizing_median': q['aligned_minus_shuffled_sizing_median'],
              'aligned_minus_production_total_median': q['aligned_minus_production_total_median'],
              'next_legal_step': x['next_legal_step'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload compact R3.4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-science-g0-distributional-belief-decision-bridge-r3-4-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_science_g0_r3_4_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_science_g0_r3_4_python.json
            ${{ runner.temp }}/cb16-r11-science-g0-distributional-belief-decision-bridge-r3-4-${{ github.run_id }}-${{ github.run_attempt }}/CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_BELIEF_DECISION_BRIDGE_R3_4_RESULT.json
          if-no-files-found: warn
          retention-days: 30
