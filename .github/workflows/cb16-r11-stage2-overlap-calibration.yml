name: CB16 R11 Stage-2 Overlap Calibration

on:
  push:
    branches:
      - ai/r11-stage2-integration-r1
    paths:
      - .github/cb16-r11-stage2-overlap-calibration-trigger.json

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      armed: ${{ steps.guard.outputs.armed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Hosted calibration preflight
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage2-integration-r1"
          python3 -m py_compile scripts/run_r11_stage2_overlap_calibration.py sitecustomize.py
          python3 - <<'PY'
          import json, os
          x=json.load(open('.github/cb16-r11-stage2-overlap-calibration-trigger.json'))
          assert x['schema']=='CB16_R11_STAGE2_OVERLAP_CALIBRATION_TRIGGER_V1'
          assert x['qualification_branch']=='ai/r11-stage2-integration-r1'
          assert x['workers']==[4,6,8]
          assert x['performance_only'] is True
          assert x['pipeline_qualification_required'] is True
          assert 1 <= int(x['hard_timeout_minutes_per_worker']) <= 5
          armed=bool(x.get('armed', False))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"armed={'true' if armed else 'false'}\n")
          print('CB16_R11_STAGE2_OVERLAP_CALIBRATION_ARMED=' + str(armed))
          PY

  calibration:
    needs: authorize
    if: needs.authorize.outputs.armed == 'true' && github.ref_name == 'ai/r11-stage2-integration-r1'
    strategy:
      fail-fast: false
      matrix:
        trace_workers: [4, 6, 8]
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    env:
      PACKAGE_ROOT: /data/cb16_ci/r2-authority/package_r102
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
      R11_DIAG_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify exact WSS calibration boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage2-integration-r1"
          test -d "$PACKAGE_ROOT"
          test -d "$LEGACY_R104_ROOT/evidence_cache"
          pkg_opts="$(findmnt -n -o OPTIONS -T "$PACKAGE_ROOT")"
          r104_opts="$(findmnt -n -o OPTIONS -T "$LEGACY_R104_ROOT")"
          case ",$pkg_opts," in *,ro,*) ;; *) exit 74 ;; esac
          case ",$r104_opts," in *,ro,*) ;; *) exit 74 ;; esac
          active="$(ps -eo pid=,comm=,args= | awk '$2 ~ /^python/ && $0 ~ /run_r104_long_research\.py/ {print}' || true)"
          test -z "$active" || { echo 'ACTIVE_LEGACY_R104_PROCESS_REFUSED' >&2; exit 75; }
          echo 'CB16_R11_STAGE2_OVERLAP_BOUNDARY=PASS'

      - name: Resolve canonical Pascal Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/calibration_python_${{ matrix.trace_workers }}.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/calibration_python_${{ matrix.trace_workers }}.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          "$PYBIN" - <<'PY'
          import os, torch
          assert os.cpu_count()==16
          assert torch.__version__=='2.8.0+cu126'
          assert torch.version.cuda=='12.6'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0))==(6,1)
          assert 'GTX 1060' in torch.cuda.get_device_name(0)
          assert torch.get_default_dtype()==torch.float32
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Prepare disposable calibration roots
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          SSD_ROOT="/var/tmp/cb16-r11-stage2-calibration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-w${{ matrix.trace_workers }}"
          HDD_ROOT="$R11_DIAG_ROOT/r11-stage2-calibration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-w${{ matrix.trace_workers }}"
          rm -rf "$SSD_ROOT" "$HDD_ROOT"
          mkdir -p "$SSD_ROOT" "$HDD_ROOT" ci_evidence
          echo "ssd=$SSD_ROOT" >> "$GITHUB_OUTPUT"
          echo "hdd=$HDD_ROOT" >> "$GITHUB_OUTPUT"

      - name: Run short real overlap calibration
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          CB16_R11_BURST_PACKAGE_ROOT: ${{ env.PACKAGE_ROOT }}
          CB16_R11_BURST_LEGACY_R104_ROOT: ${{ env.LEGACY_R104_ROOT }}
          CB16_R11_BURST_SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          CB16_R11_BURST_HDD_ROOT: ${{ steps.roots.outputs.hdd }}
          CB16_R11_BURST_TRACE_WORKERS: ${{ matrix.trace_workers }}
          CB16_R11_BURST_WARMUP_SECONDS: '30'
          CB16_R11_CANONICAL_DTYPE: FP32
          CB16_R11_AMP: '0'
          CB16_R11_CALIBRATION_OUT: ${{ github.workspace }}/ci_evidence/CB16_R11_STAGE2_OVERLAP_CALIBRATION_W${{ matrix.trace_workers }}.json
        run: |
          set -euo pipefail
          env PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/run_r11_stage2_overlap_calibration.py \
            2>&1 | tee ci_evidence/overlap_calibration_w${{ matrix.trace_workers }}.log

      - name: Calibration identity gate
        if: always()
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          P="ci_evidence/CB16_R11_STAGE2_OVERLAP_CALIBRATION_W${{ matrix.trace_workers }}.json"
          test -f "$P"
          "$PY" - "$P" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_STAGE2_OVERLAP_CALIBRATION_V1'
          assert x['status']=='PASS'
          assert x['scientific_semantics_changed'] is False
          assert x['new_scientific_verdict'] is False
          assert x['performance_only'] is True
          assert x['final_holdout_read'] is False
          assert x['oci_compute_used'] is False
          assert x['worker_count'] in (4,6,8)
          assert all(c['trace_identity_equal'] is True for c in x['concurrent_cases'])
          hashes={c['challenger_hash'] for c in x['concurrent_cases']}
          assert hashes=={x['challenger_hash']}
          print('CB16_R11_STAGE2_OVERLAP_CALIBRATION_IDENTITY=PASS')
          PY

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage2-overlap-${{ github.run_id }}-${{ github.run_attempt }}-w${{ matrix.trace_workers }}
          path: ci_evidence
          retention-days: 30

      - name: Cleanup calibration roots
        if: always()
        shell: bash
        env:
          SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          HDD_ROOT: ${{ steps.roots.outputs.hdd }}
        run: |
          set +e
          [ -z "${SSD_ROOT:-}" ] || rm -rf "$SSD_ROOT"
          [ -z "${HDD_ROOT:-}" ] || rm -rf "$HDD_ROOT"
          exit 0
