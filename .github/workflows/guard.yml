name: repo-guard
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run repository policy
        run: python3 ci/check_repository_policy.py --root .
      - name: Compile P0 and R11 Python sources
        run: |
          python3 -m py_compile \
            cb16_local_opt/r102_teacher_incremental.py \
            cb16_local_opt/r102_teacher_parallel.py \
            cb16_local_opt/r102_evidence_incremental.py \
            cb16_local_opt/r2_training_incremental.py \
            cb16_local_opt/r2_policy_trace_incremental.py \
            cb16_local_opt/r2_frozen_guard.py \
            cb16_local_opt/r2_evidence_storage_incremental.py \
            cb16_local_opt/r2_campaign.py \
            cb16_local_opt/rearchitecture_authority_r11.py \
            scripts/run_r104_long_research.py \
            scripts/run_r2_native_qualification_v2.py \
            tests/test_r102_teacher_incremental.py \
            tests/test_r102_evidence_incremental.py \
            tests/test_r2_frozen_guard.py \
            tests/test_r2_evidence_storage_incremental.py \
            tests/test_rearchitecture_authority_r11.py
      - name: Verify R11 semantic freeze
        run: python3 -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
      - name: Run dependency-free P0 and R11 unit tests
        run: |
          python3 -m unittest \
            tests.test_r2_frozen_guard \
            tests.test_r2_evidence_storage_incremental \
            tests.test_rearchitecture_authority_r11
