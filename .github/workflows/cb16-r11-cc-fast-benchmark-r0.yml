name: cb16-r11-cc-fast-benchmark-r0

on:
  push:
    branches:
      - ai/r11-cc-thread-d-fast-cutover-r0
    paths:
      - cb16_local_opt/cc_fast_*.py
      - tests/test_cc_fast_*.py
      - tests/test_cc_thread_d_baseline_r0.py
      - .github/workflows/cb16-r11-cc-fast-benchmark-r0.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-cc-fast-benchmark-r0
  cancel-in-progress: false

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  cc-fast-benchmark:
    name: CC Thread D bounded Shanxi Docker smoke matrix
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cc_fast_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/resolve_verified_r104_python.py --out "$RUNNER_TEMP/cc_fast_python.json"
          python3 - "$RUNNER_TEMP/cc_fast_python.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['expected']['required_python_series'] == '3.10.x', p
          assert p['observed']['python_series'] == [3,10], p
          assert p['observed']['python_series_compatible'] is True, p
          assert p['python']['network_install_attempted'] is False, p
          PY

      - name: Enforce Thread D import firewall
        shell: bash
        run: |
          set -euo pipefail
          PY=$(python3 - "$RUNNER_TEMP/cc_fast_python.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1])); print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PY" - <<'PY'
          from pathlib import Path
          forbidden=(
              'cb16_local_opt.gpu_inference_broker',
              'cb16_local_opt.multiprocess_trajectory_farm',
              'cb16_local_opt.vectorized_physics',
          )
          for path in Path('cb16_local_opt').glob('cc_fast_*.py'):
              text=path.read_text(encoding='utf-8')
              bad=[x for x in forbidden if x in text]
              if bad: raise SystemExit(f'legacy import forbidden in {path}: {bad}')
          print('CC_FAST_IMPORT_FIREWALL_PASS')
          PY

      - name: Run Thread D qualification tests
        shell: bash
        run: |
          set -euo pipefail
          PY=$(python3 - "$RUNNER_TEMP/cc_fast_python.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1])); print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PY" -m pytest -q tests/test_cc_fast_*.py tests/test_cc_thread_d_baseline_r0.py

      - name: Measure frozen-market reuse
        shell: bash
        run: |
          set -euo pipefail
          PY=$(python3 - "$RUNNER_TEMP/cc_fast_python.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1])); print(p['python']['venv'] + '/bin/python')
          PY
          )
          mkdir -p artifacts/cc_fast_benchmark
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          from cb16_local_opt.cc_fast_market_reuse_benchmark_r0 import benchmark_market_reuse
          r=benchmark_market_reuse(account_count=16, rows=20000, repeats=3)
          Path('artifacts/cc_fast_benchmark/MARKET_REUSE.json').write_text(json.dumps(r.to_dict(),sort_keys=True,indent=2)+'\n')
          print(json.dumps(r.to_dict(),sort_keys=True))
          PY

      - name: Run bounded candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          PY=$(python3 - "$RUNNER_TEMP/cc_fast_python.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1])); print(p['python']['venv'] + '/bin/python')
          PY
          )
          mkdir -p artifacts/cc_fast_benchmark
          for spec in '2 16' '4 32' '6 64'; do
            set -- $spec
            w="$1"; a="$2"
            GITHUB_SHA="$GITHUB_SHA" "$PY" -m cb16_local_opt.cc_fast_benchmark_runner_r0 \
              --output "artifacts/cc_fast_benchmark/candidate-w${w}-a${a}.json" \
              --workers "$w" --accounts "$a" --market-steps 384 --chunk-facts 128 --policy-batch "$a"
          done

      - name: Compile measured winner and safety gates
        shell: bash
        run: |
          set -euo pipefail
          PY=$(python3 - "$RUNNER_TEMP/cc_fast_python.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1])); print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PY" - <<'PY'
          import glob, json, os
          from pathlib import Path
          from cb16_local_opt.cc_fast_selection_r0 import CandidateResult, select_fast_candidate
          rows=[]; selectable=[]
          for path in sorted(glob.glob('artifacts/cc_fast_benchmark/candidate-*.json')):
              p=json.load(open(path,encoding='utf-8'))
              r=p['collector_report']
              assert p['accesses_final_or_fresh_data'] is False
              assert r['code_identity'] == os.environ['GITHUB_SHA']
              assert all(v is False for v in p['collector_extra']['worker_cuda_initialized'])
              semantic=(p['semantic']['verdict']=='PASS' and r['semantic_verdict']=='PASS')
              memory=(int(r['pss_bytes']) < 12*1024**3 and int(r['swap_out_bytes']) == 0)
              queue=(int(r['queue_bytes']) <= 8*1024**2 and float(r['queue_oldest_age_s']) <= 30.0)
              cid=Path(path).stem
              row={
                  'candidate_id':cid,
                  'semantic_pass':semantic,
                  'memory_safety_pass':memory,
                  'queue_safety_pass':queue,
                  'compliant_transitions_per_s':float(r['compliant_transitions_per_s']),
                  'wall_clock_s':float(r['wall_clock_s']),
                  'policy_decisions_per_s':float(r['policy_decisions_per_s']),
                  'pss_bytes':int(r['pss_bytes']),
                  'swap_out_bytes':int(r['swap_out_bytes']),
                  'queue_bytes':int(r['queue_bytes']),
                  'hardware':p['hardware'],
                  'selected_policy_microbenchmark':p['policy_mode_benchmark']['selected_for_policy_microbenchmark'],
              }
              rows.append(row)
              selectable.append(CandidateResult(cid,semantic,memory,queue,row['compliant_transitions_per_s'],row['wall_clock_s'],True))
          assert len(rows)==3, rows
          winner=select_fast_candidate(selectable)
          payload={
              'schema_version':'CB16_R11_CC_FAST_SHANXI_SMOKE_MATRIX_V1',
              'code_sha':os.environ['GITHUB_SHA'],
              'science_scope':'SYNTHETIC_ONLY_NO_FINAL_NO_FRESH',
              'candidate_count':len(rows),
              'candidates':rows,
              'winner':winner.candidate_id,
              'winner_rule':'max compliant transitions/s among semantic+memory+queue PASS; wall clock tie-break',
              'performance_measured':True,
          }
          Path('artifacts/cc_fast_benchmark/CC_FAST_SHANXI_MATRIX.json').write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-cc-fast-benchmark-r0-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cc_fast_docker_preflight.json
            ${{ runner.temp }}/cc_fast_python.json
            artifacts/cc_fast_benchmark/*.json
          if-no-files-found: error
          retention-days: 30
