name: CB16 R11 Stage4 INTA Runtime Spine

on:
  push:
    branches:
      - ai/r11-stage4-int-a-runtime-spine-r0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-inta-runtime-spine
  cancel-in-progress: true

jobs:
  inta-runtime-spine:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    steps:
      - name: Checkout exact INTA head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable seed ancestry and INTA path ownership
        shell: bash
        run: |
          set -euo pipefail
          SEED=86a4ac8a9080cd8382600cb998059e9585495a11
          git merge-base --is-ancestor "$SEED" HEAD
          test "$(git rev-parse "$SEED")" = "$SEED"
          python3 - <<'PY'
          import subprocess
          seed = "86a4ac8a9080cd8382600cb998059e9585495a11"
          allowed = {
              ".github/workflows/cb16-r11-stage4-inta-runtime-spine.yml",
              "cb16_local_opt/stage4_runtime_spine_integration_r11.py",
              "docs/CB16_R11_STAGE4_INTA_RUNTIME_SPINE_R0.md",
              "tests/test_stage4_runtime_spine_integration_r11.py",
              "authority/rearchitecture_r11/stage4_integration_receipts/INTA_RECEIPT_V1.json",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{seed}..HEAD"], text=True
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          assert not unexpected, f"INTA_EXISTING_OR_UNOWNED_PATH_MUTATION:{unexpected}"
          PY
          test -z "$(git diff "$SEED"..HEAD -- authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)"

      - name: Resolve verified qualification Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/stage4_inta_python.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/stage4_inta_python.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: INTA runtime-spine and Wave-1 contract tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_runtime_spine_integration_r11.py \
            tests/test_stage4_canonical_runtime_r11.py \
            tests/test_stage4_authority_adoption_r11.py \
            tests/test_stage4_authority_lease_r11.py \
            tests/test_stage4_state_roots_r11.py \
            tests/test_stage4_legacy_retirement_r11.py

      - name: Frozen semantic authority guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: INTA semantic guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          from cb16_local_opt.stage4_runtime_spine_integration_r11 import SCIENTIFIC_STATUS
          assert SCIENTIFIC_STATUS == "DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE"
          print("STAGE4_INTA_RUNTIME_SPINE_PASS")
          PY
