name: CB16 R11 M-Series H5.1 Teacher Failure Localization R0

on:
  push:
    branches:
      - ai/m-series-h5-1-teacher-failure-localization-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_1_TEACHER_FAILURE_LOCALIZATION_R0_GATE_V1.json
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_TEACHER_TEMPORAL_TRANSPORT_AUDIT_R0_ADJUDICATION_V1.json
      - cb16_local_opt/teacher_failure_localization_h51.py
      - tests/test_teacher_failure_localization_h51.py
      - scripts/r11_m_series_h5_1_teacher_failure_localization_r0.py
      - .github/workflows/cb16-r11-m-series-h5-1-teacher-failure-localization-r0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  h5-1-localization:
    name: H5.1 Student-free Teacher failure localization
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable H5.1 preregistration and H5 adjudication
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 64b78f2a54477ae0bfbe3a7bd95a7f410b7581b9 HEAD
          git merge-base --is-ancestor 1a29d497ea8a0daf06df51baf3d0e652d6909744 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_1_TEACHER_FAILURE_LOCALIZATION_R0_GATE_V1.json)" = "40303e152f4083c35c991edcec4f41fd5a5acfb2"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_TEACHER_TEMPORAL_TRANSPORT_AUDIT_R0_ADJUDICATION_V1.json)" = "0dc8dc61e3db601f7b3f1d3a363a24597db1ba1d"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_failure_localization_h51.py)" = "8dba35e5c54c8bc9d8eeb97ea6d3aec373a09ccc"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_temporal_transport_audit_h5.py)" = "09b05de23c659fe6f47a43117ec70b5cafcf7d21"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_balanced_runtime_r11.py)" = "e834facdbf2d08de25e3cab917f0faf587f3386e"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_vectorized_r11.py)" = "083ca6541b45577cfeb6d9a376b25e0eaf8d060a"
          test "$(git rev-parse HEAD:cb16_local_opt/r11_teacher_authority_candidate.py)" = "6e77e8f989a6d4358a7feac99c269db7b7d6549e"
          test "$(git rev-parse HEAD:cb16_local_opt/independent_purge_alignment_replication_r5.py)" = "96560a80c9793dec8b527b800758547a69ced55a"
          test "$(git rev-parse HEAD:cb16_local_opt/probabilistic_teacher_r6.py)" = "3de3092d244c3fd315950c9f8b0bf4d78c50ee2b"
          test "$(git rev-parse HEAD:cb16_local_opt/r102_evidence_cache.py)" = "91fb73565ec60f66bf4232957f9b9b2f88cc3cfe"
          test "$(git rev-parse HEAD:cb16_local_opt/reduced_teacher_target_information_audit_r6.py)" = "bd7a8780e8dcab05cfae92744fde523ce62cc9ae"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_h51_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_h51_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run H5.1 unit and frozen Teacher regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h51_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/teacher_failure_localization_h51.py \
            tests/test_teacher_failure_localization_h51.py \
            scripts/r11_m_series_h5_1_teacher_failure_localization_r0.py
          "$PYTHON" -m pytest -q \
            tests/test_teacher_failure_localization_h51.py \
            tests/test_teacher_temporal_transport_audit_h5.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_independent_purge_alignment_replication_r5.py \
            tests/test_r11_teacher_balanced_binding.py

      - name: Execute preregistered Student-free H5.1 localization
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h51_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-h51-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_h51_run_root.txt"
          "$PYTHON" -m scripts.r11_m_series_h5_1_teacher_failure_localization_r0 \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_H5_1_TEACHER_FAILURE_LOCALIZATION_R0_RESULT.json"

      - name: Verify H5.1 receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_h51_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_H5_1_TEACHER_FAILURE_LOCALIZATION_R0_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_H5_1_TEACHER_FAILURE_LOCALIZATION_R0_RESULT_V1',x
          assert x['status']=='H5_1_TEACHER_FAILURE_LOCALIZATION_COMPLETE',x
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert x['runtime_identity']['teacher_only'] is True and x['runtime_identity']['student_training'] is False and x['runtime_identity']['student_inference'] is False,x
          p=x['protocol']
          assert p['support_classification']=='CONSUMED_TRAIN_ONLY_MECHANISTIC_SUPPORT__NOT_INDEPENDENT_MARKET_SUPPORT',p
          assert p['outer_folds']==5 and p['train_to_eval_gap_hours_each_fold']==256,p
          assert p['teacher_config_tuning'] is False and p['teacher_semantics_changed'] is False,p
          assert p['student_training'] is False and p['student_inference'] is False,p
          assert p['raw_market_payload_read'] is False and p['legacy_validation_rows_used'] is False and p['r5_purge_support_used'] is False,p
          assert p['fresh_market_data_downloaded'] is False and p['final_holdout_opened'] is False and p['r7_candidate_evaluated'] is False,p
          assert len(x['folds'])==5,x
          expected={'FULL_STATE','MARKET96_ONLY','OPERATOR48_ONLY','MEDIUM48_ONLY','ACCOUNT6_ONLY'}
          for f in x['folds']:
              assert f['fold'] in [1,2,3,4,5],f
              assert f['train_to_eval_gap_hours']==256.0,f
              assert f['exact_h5_full_state_control_identity_guard']=='PASS',f
              assert set(f['controls'])==expected,f
              assert set(f['control_medians'])==expected,f
              assert f['support_geometry']['exact_support_reconstruction_guards']=='PASS',f
              for family in expected:
                  assert set(map(int,f['controls'][family].keys()))=={1,7,13,23,31},(family,f)
                  for arm in f['controls'][family].values():
                      for k in ('qscore','central_qscore','tail_qscore','mean_utility_mse','coverage_10_90','coverage_05_95'):
                          assert math.isfinite(float(arm[k])),(family,k,arm)
                      assert float(arm['qscore'])>=0.0,arm
                  for r in f['control_receipts'][family].values():
                      assert r['scenario_identity_preserved'] is True and r['selected_block_multiset_preserved'] is True,r
                      assert r['unshuffled_blocks_byte_identical'] is True and r['train_features_byte_identical'] is True,r
                      assert r['fixed_points']==0,r
          s=x['h5_1_summary']
          assert s['primary_failure_axis'] in {
              'MARKET_STATE_TRANSPORT_FAILURE','ACCOUNT_STATE_TRANSPORT_FAILURE','BROAD_STATE_GEOMETRY_FAILURE',
              'JOINT_MARKET_ACCOUNT_INTERACTION_FAILURE','H5_1_FAILURE_MODE_UNRESOLVED'
          },s
          assert s['market_information_verdict'] is False and s['canonical_change_authorized'] is False,s
          assert s['teacher_change_authorized'] is False and s['student_change_authorized'] is False,s
          g=x['semantic_guards']
          assert g['teacher_changed'] is False and g['teacher_hyperparameter_tuned'] is False,g
          assert g['student_trained'] is False and g['student_inference_used'] is False and g['new_direction_loss_created'] is False,g
          assert g['canonical_generation_advanced'] is False and g['champion_promoted'] is False and g['production_cutover'] is False,g
          assert g['market_information_verdict_reopened'] is False and g['final_holdout_payload_opened'] is False and g['r7_candidate_evaluated'] is False,g
          print(json.dumps({
              'status':x['status'],'conclusion':s['conclusion'],'primary_failure_axis':s['primary_failure_axis'],
              'tail_calibration_primary':s['tail_calibration_primary'],'market_sublocalization':s['market_sublocalization'],
              'per_fold':s['per_fold'],'next_legal_step':x['next_legal_step']
          },indent=2,sort_keys=True))
          PY

      - name: Upload H5.1 localization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-h5-1-teacher-failure-localization-r0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_h51_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_h51_python.json
            ${{ runner.temp }}/cb16-r11-m-series-h51-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
