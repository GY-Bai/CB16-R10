name: CB16 R11 Stage-2 Task D Microbench

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r11-stage2-task-d-async-overlap-r1
    paths:
      - cb16_local_opt/burst_orchestrator_r11.py
      - tests/test_burst_orchestrator_r11.py
      - scripts/benchmark_burst_orchestrator_r11.py
      - .github/workflows/cb16-r11-stage2-task-d-microbench.yml

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage2-shanxi-microbench
  cancel-in-progress: false

jobs:
  task-d:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
    steps:
      - name: Checkout Task D branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Reuse verified R10.4 Python and Pascal CUDA runtime
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          "$PYBIN" - <<'PY'
          import torch, pytest
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0)) == (6, 1)
          print('GPU=' + torch.cuda.get_device_name(0))
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Static semantic-freeze and Task D correctness gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile \
            cb16_local_opt/burst_orchestrator_r11.py \
            scripts/benchmark_burst_orchestrator_r11.py \
            tests/test_burst_orchestrator_r11.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root . \
            | tee ci_evidence/semantic_freeze.log
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_r11_async_orchestrator.py \
            tests/test_burst_orchestrator_r11.py \
            2>&1 | tee ci_evidence/task_d_correctness.log

      - name: Short real-machine heterogeneous overlap microbenchmark
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/benchmark_burst_orchestrator_r11.py \
            --target-seconds 12 \
            --out ci_evidence/task_d_microbench.json \
            2>&1 | tee ci_evidence/task_d_microbench.log
          "$PY" - <<'PY'
          import json
          x=json.load(open('ci_evidence/task_d_microbench.json'))
          assert x['scientific_verdict'] == 'NONE_MICROBENCH_ONLY'
          assert x['final_holdout_read'] is False
          assert x['raw_1m_read'] is False
          assert x['semantic_identity_equal'] is True
          assert x['performance_gate'] is True
          assert x['status'] == 'PASS'
          print('CB16_R11_STAGE2_TASK_D_MICROBENCH=PASS')
          PY

      - name: Upload Task D microbenchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage2-task-d-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          retention-days: 14
