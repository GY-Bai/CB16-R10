name: Stage4 S4I qualification

on:
  push:
    branches:
      - ai/r11-stage4-task-i-qualification-gates-r0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4i-gate-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Gatework and S4I tests
        run: python -m pytest -q tests/test_stage4_gatework_r11.py tests/test_stage4_gate_compiler_r11.py
      - name: Validate S4I receipt when present
        shell: bash
        run: |
          receipt=authority/rearchitecture_r11/stage4_receipts/S4I_RECEIPT_V1.json
          if [[ -f "$receipt" ]]; then
            python scripts/check_r11_stage4_task_receipt.py --receipt "$receipt" --repo-root .
          else
            echo "Implementation-head run: receipt intentionally not present yet."
          fi
