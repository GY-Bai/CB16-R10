name: CB16 Shanxi Preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  repo-guard:
    name: Repo Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pin guard authority sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ci/check_repository_policy.py)" = "c5c021ab9348387a0f43b766b66ab74977e45a5c"
          test "$(git rev-parse HEAD:ci/check_shanxi_workflow_policy.py)" = "7999d47fd2117317adbfa39bd79bb462aa17874b"
          test "$(git rev-parse HEAD:ci/check_node24_actions_policy.py)" = "7cb644d2af48363fa366c73092f23e16400233a4"

      - name: Repository sensitive-content policy
        run: python3 ci/check_repository_policy.py --root .

      - name: Shanxi workflow topology policy
        run: python3 ci/check_shanxi_workflow_policy.py --root .

      - name: Action runtime compatibility policy
        run: python3 ci/check_node24_actions_policy.py --root .
