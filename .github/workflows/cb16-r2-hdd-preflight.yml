name: CB16 R2 HDD Read-Only Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r2-evidence-storage-r0
    paths:
      - .github/cb16-r2-hdd-preflight-trigger.json

permissions:
  contents: write

concurrency:
  group: cb16-r2-hdd-readonly-preflight
  cancel-in-progress: false

jobs:
  hdd-preflight:
    runs-on: [self-hosted, shanxi, cb16-r10-canonical]
    timeout-minutes: 15
    env:
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Collect read-only mount evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          OUT=ci_evidence/hdd_mount_preflight.txt
          {
            echo 'SCHEMA=CB16_R2_HDD_READONLY_PREFLIGHT_V1'
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "RUNNER=$(hostname)"
            echo "UID_GID=$(id -u):$(id -g)"
            echo 'WRITES_TO_HDD=FALSE'
            echo 'CANONICAL_R104_MODIFIED=FALSE'
            echo
            echo '=== FINDMNT TARGETS ==='
            for p in / /tmp /data /data/cb16_ci /data/cb16_hdd "$LEGACY_R104_ROOT"; do
              echo "--- $p"
              if [ -e "$p" ]; then
                findmnt -T "$p" -o TARGET,SOURCE,FSTYPE,OPTIONS || true
              else
                echo 'PATH_NOT_PRESENT'
              fi
            done
            echo
            echo '=== LSBLK ==='
            lsblk -o NAME,KNAME,TYPE,RO,ROTA,SIZE,FSTYPE,FSAVAIL,FSUSE%,MOUNTPOINTS,MODEL,TRAN
            echo
            echo '=== BLOCK RO FLAGS ==='
            for p in /sys/class/block/sda/ro /sys/class/block/sda1/ro /sys/class/block/sdb/ro /sys/class/block/sdb3/ro; do
              if [ -r "$p" ]; then printf '%s=' "$p"; cat "$p"; fi
            done
            echo
            echo '=== PATH MODES / OWNERS ==='
            for p in /data /data/cb16_ci /data/cb16_hdd /data/cb16_hdd/cb16_runtime "$LEGACY_R104_ROOT"; do
              if [ -e "$p" ]; then stat -c '%n mode=%a uid=%u gid=%g type=%F' "$p"; else echo "$p MISSING"; fi
            done
            echo
            echo '=== ACCESS(2)-STYLE SHELL WRITABILITY FLAGS; NO WRITE ATTEMPT ==='
            for p in /data /data/cb16_ci /data/cb16_hdd /data/cb16_hdd/cb16_runtime "$LEGACY_R104_ROOT"; do
              if [ -e "$p" ]; then
                if [ -w "$p" ]; then echo "$p WRITABLE_FLAG=TRUE"; else echo "$p WRITABLE_FLAG=FALSE"; fi
              fi
            done
            echo
            echo '=== /proc/self/mountinfo entries containing /data ==='
            awk '$0 ~ /\/data/ {print}' /proc/self/mountinfo || true
            echo
            echo '=== MOUNT NAMESPACE ==='
            printf 'self='; readlink /proc/self/ns/mnt || true
            printf 'pid1='; readlink /proc/1/ns/mnt || true
          } | tee "$OUT"

      - name: Persist sanitized preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ci_evidence/hdd_mount_preflight.txt
          SNAP="/tmp/cb16-r2-hdd-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SNAP"
          mkdir -p "$SNAP"
          cp ci_evidence/hdd_mount_preflight.txt "$SNAP/"
          sha256sum "$SNAP/hdd_mount_preflight.txt" > "$SNAP/SHA256SUMS"
          BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          DEST="ci-results/r2-hdd-preflight/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DEST"
          cp "$SNAP"/* "$DEST/"
          git config user.name 'cb16-r2-storage-ci'
          git config user.email '37661207+GY-Bai@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "ci-results: R2 HDD preflight ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Assert probe stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'WRITES_TO_HDD=FALSE' ci_evidence/hdd_mount_preflight.txt
          grep -qx 'CANONICAL_R104_MODIFIED=FALSE' ci_evidence/hdd_mount_preflight.txt
          echo 'R2_HDD_PREFLIGHT=COMPLETE_READ_ONLY'
