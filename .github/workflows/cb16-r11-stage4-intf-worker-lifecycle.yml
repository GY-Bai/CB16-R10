name: CB16 R11 Stage4 INTF Worker Lifecycle

on:
  push:
    branches:
      - ai/r11-stage4-int-f-worker-lifecycle-r0
    paths:
      - cb16_local_opt/stage4_orchestration_provider_r11.py
      - tests/test_stage4_orchestration_provider_r11.py
      - docs/CB16_R11_STAGE4_INTF_WORKER_LIFECYCLE_R0.md
      - .github/workflows/cb16-r11-stage4-intf-worker-lifecycle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-intf-worker-lifecycle
  cancel-in-progress: false

jobs:
  intf-worker-lifecycle:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    steps:
      - name: Checkout INTF implementation head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact immutable seed ancestry and owned paths
        shell: bash
        run: |
          set -euo pipefail
          SEED=86a4ac8a9080cd8382600cb998059e9585495a11
          test "$(git rev-parse HEAD^)" = "$SEED"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          git merge-base --is-ancestor "$SEED" HEAD

          EXPECTED="$(mktemp)"
          ACTUAL="$(mktemp)"
          cat >"$EXPECTED" <<'EOF'
          .github/workflows/cb16-r11-stage4-intf-worker-lifecycle.yml
          cb16_local_opt/stage4_orchestration_provider_r11.py
          docs/CB16_R11_STAGE4_INTF_WORKER_LIFECYCLE_R0.md
          tests/test_stage4_orchestration_provider_r11.py
          EOF
          git diff --name-only "$SEED..HEAD" | LC_ALL=C sort >"$ACTUAL"
          diff -u "$EXPECTED" "$ACTUAL"

          FREEZE=authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json
          test "$(git rev-parse "$SEED:$FREEZE")" = "$(git rev-parse "HEAD:$FREEZE")"

      - name: Resolve verified qualification Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/stage4_intf_python.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/stage4_intf_python.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: INTF dedicated lifecycle tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_orchestration_provider_r11.py

      - name: Re-run S4B lifecycle contract
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_canonical_runtime_r11.py

      - name: Frozen semantic authority guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: INTF source and numeric fail-closed guards
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import ast
          import pathlib
          import cb16_local_opt.stage4_orchestration_provider_r11 as m

          path = pathlib.Path(m.__file__)
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)

          forbidden_sibling_fragments = (
              "stage4_runtime_spine_integration",
              "stage4_fenced_persistence",
              "stage4_authoritative_engines",
              "stage4_execution_integration",
              "stage4_recovery_integration",
              "stage4_hostile_integration_harness",
              "stage4_integration_gate_compiler",
          )
          assert not [
              name for name in imports
              if any(fragment in name for fragment in forbidden_sibling_fragments)
          ]
          assert m.SCIENTIFIC_STATUS_R11 == (
              "DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE"
          )
          assert m.REPLAY_SEMANTICS_R11 == (
              "ENGINEERING_RECOVERY_ONLY__NOT_NEW_SCIENTIFIC_EVIDENCE"
          )
          cfg = m.Stage4WorkerRuntimeConfigR11()
          assert cfg.numeric_mode == "FP32"
          assert cfg.amp is False
          assert cfg.nested_numeric_threads == 1
          assert "R11_CANONICAL_AUTHORITY_CUTOVER_QUALIFIED" not in source
          assert "final_holdout" not in source.lower()
          print("STAGE4_INTF_WORKER_LIFECYCLE_GUARDS_PASS")
          PY
