name: CB16 R11 M-Series M1 Direction Relative Sufficiency

on:
  push:
    branches:
      - ai/m-series-research-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M1_DIRECTION_RELATIVE_SUFFICIENCY_GATE_V1.json
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_ADJUDICATION_V1.json
      - cb16_local_opt/m_series_m1_direction_relative_sufficiency.py
      - tests/test_m_series_m1_direction_relative_sufficiency.py
      - scripts/r11_m_series_m1_direction_relative_sufficiency.py
      - scripts/r11_m_series_m1_direction_relative_sufficiency_entrypoint.py
      - .github/workflows/cb16-r11-m-series-m1-direction-relative-sufficiency.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env
  CB16_PACKAGE_ROOT: /cb16/package

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  m1-direction-relative-sufficiency:
    name: M1 consumed-TRAIN Direction relative sufficiency
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable M1 preregistration and frozen science ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 62ad74a0c62ab616dfceaf70c6f7b30f7088c81f HEAD
          git merge-base --is-ancestor b5e0d11e235e6df9c7029dbe05a42a42bcab1872 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M1_DIRECTION_RELATIVE_SUFFICIENCY_GATE_V1.json)" = "71acc8708e03be4e7e5b7c0d7621213e723ce61f"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_ADJUDICATION_V1.json)" = "54174f86fee2ae0da5c1813af44fa84fe82962db"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_REDUCED_TEACHER_TARGET_INFORMATION_AUDIT_R6_GATE_V1.json)" = "1d1254fb03cc00283423426e07ae240a196c627e"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/training_runtime_r11.py)" = "56c227800d7a5c82ef88c691bb69d7550aee8b39"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_runtime_r11.py)" = "656f1483f2e6a96daae5c98eb96cd75805d3547c"
          test -f "$CB16_G0_ROOT/bootstrap/R11_G0_INITIAL_CHAMPION.pt"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"
          test -d "$CB16_PACKAGE_ROOT"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_m1_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_m1_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run M1 unit and regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_m1_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/m_series_m1_direction_relative_sufficiency.py \
            tests/test_m_series_m1_direction_relative_sufficiency.py \
            scripts/r11_m_series_m1_direction_relative_sufficiency.py \
            scripts/r11_m_series_m1_direction_relative_sufficiency_entrypoint.py
          "$PYTHON" -m pytest -q \
            tests/test_m_series_m1_direction_relative_sufficiency.py \
            tests/test_m_series_m0_policy_drift_attribution.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_training_runtime_r11.py \
            tests/test_r11_teacher_balanced_binding.py \
            tests/test_teacher_runtime_r11.py

      - name: Execute preregistered M1 read-only audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_m1_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-m1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_m1_run_root.txt"
          "$PYTHON" scripts/r11_m_series_m1_direction_relative_sufficiency_entrypoint.py \
            --g0-root "$CB16_G0_ROOT" \
            --package-root "$CB16_PACKAGE_ROOT" \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_M1_DIRECTION_RELATIVE_SUFFICIENCY_RESULT.json" \
            --device cuda

      - name: Verify M1 receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_m1_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_M1_DIRECTION_RELATIVE_SUFFICIENCY_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_M1_DIRECTION_RELATIVE_SUFFICIENCY_RESULT_V1',x
          assert x['status']=='M1_DIRECTION_RELATIVE_SUFFICIENCY_PASS',x
          assert x['frozen_scientific_status_before']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert x['frozen_scientific_status_after']==x['frozen_scientific_status_before'],x
          p=x['protocol']
          assert p['student_training'] is False and p['optimizer_steps']==0,p
          assert p['continuous_g0_requested_risk_used'] is False,p
          assert p['r7_candidate_evaluated'] is False,p
          assert p['final_holdout_opened'] is False and p['fresh_market_data'] is False,p
          assert len(x['fold_results'])==5,x
          for f in x['fold_results']:
              assert f['fold'] in (1,2,3,4,5),f
              assert f['optimizer_steps']==0,f
              a=f['m1_audit']
              assert a['optimizer_steps']==0,a
              assert a['continuous_g0_requested_risk_used'] is False,a
              for k in (
                  'best_vs_g0_advantage_saturation_rate',
                  'best_vs_g0_advantage_reconstruction_max_abs_error_on_unsaturated_rows',
                  'all_pairwise_gap_saturation_rate',
                  'teacher_target_entropy_mean',
                  'teacher_top_probability_mean',
                  'actual_best_vs_second_best_mean_gap_mean',
              ):
                  assert math.isfinite(float(a[k])),(k,a)
          s=x['m1_summary']
          assert s['conclusion'] in {
              'DIRECTION_BEST_MEAN_GEOMETRY_RETAINED_ON_CONSUMED_TRAIN_ONLY_SUPPORT',
              'DIRECTION_BEST_MEAN_GEOMETRY_PARTIALLY_COMPRESSED_ON_CONSUMED_TRAIN_ONLY_SUPPORT',
          },s
          assert s['r7_candidate_evaluated'] is False,s
          assert s['market_information_verdict'] is False,s
          assert s['canonical_promotion_authorized'] is False,s
          g=x['semantic_guards']
          for k in ('canonical_generation_advanced','champion_promoted','production_cutover','market_information_verdict_reopened','profitability_or_alpha_claimed','r7_candidate_evaluated','final_holdout_payload_opened','fresh_market_data_downloaded','r5_purge_support_reopened','legacy_validation_rows_used','raw_market_payload_used'):
              assert g[k] is False,(k,g)
          assert g['frozen_package_unchanged'] is True and g['g0_authority_unchanged'] is True,g
          print(json.dumps({
              'status':x['status'],
              'conclusion':s['conclusion'],
              'direction_mean_geometry_retained':s['direction_mean_geometry_retained'],
              'total_rows':s['total_rows'],
              'total_argmax_mismatch_count':s['total_argmax_mismatch_count'],
              'total_best_vs_g0_saturation_rows':s['total_best_vs_g0_saturation_rows'],
              'global_max_reconstruction_error_unsaturated':s['global_max_reconstruction_error_unsaturated'],
              'per_fold':s['per_fold'],
              'next_legal_step':x['next_legal_step'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload M1 mechanistic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-m1-direction-relative-sufficiency-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_m1_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_m1_python.json
            ${{ runner.temp }}/cb16-r11-m-series-m1-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
