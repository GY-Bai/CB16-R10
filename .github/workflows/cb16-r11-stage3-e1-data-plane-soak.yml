name: CB16 R11 Stage-3 E1 Persistent Data-Plane Soak

on:
  push:
    branches:
      - ai/r11-stage3-e1-data-plane-soak-r0
    paths:
      - .github/cb16-r11-stage3-e1-trigger.json
      - .github/workflows/cb16-r11-stage3-e1-data-plane-soak.yml

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage3-e1-data-plane-soak
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      armed: ${{ steps.guard.outputs.armed }}
      rung: ${{ steps.guard.outputs.rung }}
      duration_seconds: ${{ steps.guard.outputs.duration_seconds }}
    steps:
      - name: Checkout trigger source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Enforce exact E1 trigger policy
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          exact = "ai/r11-stage3-e1-data-plane-soak-r0"
          branch = os.environ["GITHUB_REF_NAME"]
          if branch != exact:
              raise SystemExit(f"FAIL_CLOSED_BRANCH_NOT_ALLOWLISTED:{branch}")
          x = json.loads(Path(".github/cb16-r11-stage3-e1-trigger.json").read_text())
          assert x["schema"] == "CB16_R11_STAGE3_E1_TRIGGER_V1"
          assert x["qualification_branch"] == exact
          assert x["teacher_workers"] == 8
          assert x["trace_workers"] == 8
          assert x["queue_depth"] == 8
          assert x["buffer_mib"] == 64
          assert x["nested_threads"] == 1
          assert x["final_holdout_2025_09"] == "FORBIDDEN"
          assert x["fresh_market_data"] is False
          assert x["scientific_verdict"] is False
          durations = {"smoke_3m": 180, "soak_30m": 1800}
          rung = x["rung"]
          assert rung in durations, rung
          armed = bool(x.get("armed", False))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"armed={'true' if armed else 'false'}\n")
              f.write(f"rung={rung}\n")
              f.write(f"duration_seconds={durations[rung]}\n")
          print(f"CB16_R11_STAGE3_E1_TRIGGER={rung}:ARMED={armed}")
          PY

  e1:
    needs: authorize
    if: needs.authorize.outputs.armed == 'true' && github.ref_name == 'ai/r11-stage3-e1-data-plane-soak-r0'
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 40
    env:
      PACKAGE_ROOT: /data/cb16_ci/r2-authority/package_r102
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
      R11_DIAG_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_MODE: offline
      CB16_R11_CANONICAL_DTYPE: FP32
      CB16_R11_AMP: '0'

    steps:
      - name: Checkout exact E1 source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Re-verify exact branch and frozen trigger
        shell: bash
        env:
          EXPECTED_RUNG: ${{ needs.authorize.outputs.rung }}
          EXPECTED_DURATION: ${{ needs.authorize.outputs.duration_seconds }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage3-e1-data-plane-soak-r0"
          python3 - <<'PY'
          import json, os
          x=json.load(open('.github/cb16-r11-stage3-e1-trigger.json'))
          assert x['armed'] is True
          assert x['qualification_branch'] == 'ai/r11-stage3-e1-data-plane-soak-r0'
          assert x['rung'] == os.environ['EXPECTED_RUNG']
          expected={'smoke_3m':180,'soak_30m':1800}[x['rung']]
          assert expected == int(os.environ['EXPECTED_DURATION'])
          assert (x['teacher_workers'],x['trace_workers'],x['queue_depth'],x['buffer_mib']) == (8,8,8,64)
          assert x['final_holdout_2025_09'] == 'FORBIDDEN'
          assert x['fresh_market_data'] is False
          assert x['scientific_verdict'] is False
          print('CB16_R11_STAGE3_E1_EXACT_TRIGGER=PASS')
          PY

      - name: Verify read-only scientific authority mounts
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PACKAGE_ROOT"
          test -d "$LEGACY_R104_ROOT/evidence_cache"
          test -d "$R11_DIAG_ROOT"
          pkg_opts="$(findmnt -n -o OPTIONS -T "$PACKAGE_ROOT")"
          r104_opts="$(findmnt -n -o OPTIONS -T "$LEGACY_R104_ROOT")"
          case ",$pkg_opts," in *,ro,*) ;; *) echo "PACKAGE_AUTHORITY_NOT_RO=$pkg_opts" >&2; exit 74 ;; esac
          case ",$r104_opts," in *,ro,*) ;; *) echo "R104_AUTHORITY_NOT_RO=$r104_opts" >&2; exit 74 ;; esac
          active="$(ps -eo pid=,comm=,args= | awk '$2 ~ /^python/ && $0 ~ /run_r104_long_research\.py/ {print}' || true)"
          test -z "$active" || { echo 'ACTIVE_LEGACY_R104_PROCESS_REFUSED' >&2; echo "$active" >&2; exit 75; }
          echo 'CB16_R11_STAGE3_E1_READ_ONLY_AUTHORITY_BOUNDARY=PASS'

      - name: Resolve verified canonical Pascal Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          "$PYBIN" - <<'PY'
          import os, torch
          assert os.cpu_count() == 16
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.version.cuda == '12.6'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0)) == (6, 1)
          assert 'GTX 1060' in torch.cuda.get_device_name(0)
          assert torch.get_default_dtype() == torch.float32
          assert torch.backends.cuda.matmul.allow_tf32 is False
          print('GPU=' + torch.cuda.get_device_name(0))
          print('CB16_R11_STAGE3_E1_FP32_AMP_FALSE_ENV=PASS')
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: E1 contract and semantic guard gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          test -f cb16_local_opt/stage3_e1_endurance_r11.py
          test -f scripts/run_r11_stage3_e1_data_plane_soak.py
          "$PY" -m py_compile cb16_local_opt/stage3_e1_endurance_r11.py scripts/run_r11_stage3_e1_data_plane_soak.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q tests/test_stage3_e1_endurance_r11.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root . | tee ci_evidence/semantic_freeze.log

      - name: Fail closed unless metadata is SSD and payload is HDD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ci_evidence/storage_guard.txt
          import json, os
          from pathlib import Path
          def device(path):
              st=os.stat(path)
              major,minor=os.major(st.st_dev),os.minor(st.st_dev)
              resolved=Path(f'/sys/dev/block/{major}:{minor}').resolve()
              rotational=None
              for q in (resolved/'queue/rotational', resolved.parent/'queue/rotational'):
                  if q.is_file():
                      rotational=int(q.read_text().strip())
                      break
              return {'path':path,'major':major,'minor':minor,'name':resolved.name,'rotational':rotational}
          ssd=device('/var/tmp')
          hdd=device(os.environ['R11_DIAG_ROOT'])
          print(json.dumps({'ssd':ssd,'hdd':hdd},sort_keys=True))
          assert (ssd['major'],ssd['minor']) != (hdd['major'],hdd['minor']), 'SSD_HDD_SAME_BLOCK_DEVICE'
          assert ssd['rotational'] == 0, f"SSD_PATH_NOT_NONROTATIONAL:{ssd}"
          assert hdd['rotational'] == 1, f"HDD_PATH_NOT_ROTATIONAL:{hdd}"
          PY
          echo 'CB16_R11_STAGE3_E1_STORAGE_PLACEMENT=PASS'

      - name: Prepare disposable E1 roots
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          SSD_ROOT="/var/tmp/cb16-r11-stage3-e1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          HDD_ROOT="$R11_DIAG_ROOT/r11-stage3-e1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SSD_ROOT" "$HDD_ROOT"
          mkdir -p "$SSD_ROOT" "$HDD_ROOT" ci_evidence
          echo "ssd=$SSD_ROOT" >> "$GITHUB_OUTPUT"
          echo "hdd=$HDD_ROOT" >> "$GITHUB_OUTPUT"

      - name: Run persistent data-plane E1 qualification
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          CB16_R11_E1_PACKAGE_ROOT: ${{ env.PACKAGE_ROOT }}
          CB16_R11_E1_LEGACY_R104_ROOT: ${{ env.LEGACY_R104_ROOT }}
          CB16_R11_E1_SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          CB16_R11_E1_HDD_ROOT: ${{ steps.roots.outputs.hdd }}
          CB16_R11_E1_OUT: ${{ github.workspace }}/ci_evidence/CB16_R11_STAGE3_E1_ENDURANCE_REPORT_V1.json
          CB16_R11_E1_DURATION_SECONDS: ${{ needs.authorize.outputs.duration_seconds }}
          CB16_R11_E1_SAMPLE_SECONDS: '5'
          CB16_R11_E1_TEACHER_WORKERS: '8'
          CB16_R11_E1_TRACE_WORKERS: '8'
          CB16_R11_E1_QUEUE_DEPTH: '8'
          CB16_R11_E1_BUFFER_MIB: '64'
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ci_evidence/e1_time_verbose.txt env PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/run_r11_stage3_e1_data_plane_soak.py 2>&1 | tee ci_evidence/e1_soak.log

      - name: Final machine-readable E1 acceptance gate
        if: always()
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          EXPECTED_RUNG: ${{ needs.authorize.outputs.rung }}
        run: |
          set -euo pipefail
          test -n "${PY:-}"
          test -f ci_evidence/CB16_R11_STAGE3_E1_ENDURANCE_REPORT_V1.json
          "$PY" - <<'PY'
          import json, os
          p='ci_evidence/CB16_R11_STAGE3_E1_ENDURANCE_REPORT_V1.json'
          x=json.load(open(p))
          assert x['schema']=='CB16_R11_STAGE3_E1_ENDURANCE_REPORT_V1'
          assert x['status']=='PASS', x
          assert x['correctness_identity']['verdict']=='PASS', x['correctness_identity']
          assert x['runtime_endurance']['verdict']=='PASS', x['runtime_endurance']
          assert x['correctness_identity']['scientific_semantics_changed'] is False
          assert x['correctness_identity']['new_scientific_verdict'] is False
          assert x['correctness_identity']['checks']['final_holdout_untouched'] is True
          assert x['correctness_identity']['checks']['frozen_authority_unchanged'] is True
          assert x['correctness_identity']['checks']['replay_created_zero'] is True
          assert x['runtime_lifecycle']['tournament_or_lineage_exercised'] is False
          assert x['accepted_runtime_defaults']=={'teacher_workers':8,'trace_workers':8,'queue_depth':8,'buffer_mib':64,'nested_threads':1}
          assert x['engineering']['measured_seconds'] >= (175 if os.environ['EXPECTED_RUNG']=='smoke_3m' else 1795)
          if os.environ['EXPECTED_RUNG']=='smoke_3m':
              assert x['readiness']['ready_for_30m'] is True
          print('CB16_R11_STAGE3_E1_PERSISTENT_DATA_PLANE_SOAK=PASS')
          PY

      - name: Upload E1 qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage3-e1-${{ needs.authorize.outputs.rung }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          retention-days: 30

      - name: Cleanup disposable E1 roots
        if: always()
        shell: bash
        env:
          SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          HDD_ROOT: ${{ steps.roots.outputs.hdd }}
        run: |
          set +e
          if [ -n "${SSD_ROOT:-}" ]; then rm -rf "$SSD_ROOT"; fi
          if [ -n "${HDD_ROOT:-}" ]; then rm -rf "$HDD_ROOT"; fi
          exit 0
