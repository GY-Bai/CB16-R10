name: CB16 R11 Stage4 Integration Seed Gate

on:
  push:
    branches:
      - ai/r11-stage4-integration-seed-r0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-seed-gate:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    steps:
      - name: Checkout exact seed
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Adjudicate all nine Wave-1 receipts
        run: python scripts/adjudicate_r11_stage4_wave1_receipts.py --repo-root .

      - name: Re-run composable Wave-1 contract tests
        run: >-
          python -m pytest -q
          tests/test_stage4_gatework_r11.py
          tests/test_stage4_canonical_runtime_r11.py
          tests/test_stage4_authority_adoption_r11.py
          tests/test_stage4_authority_lease_r11.py
          tests/test_stage4_permission_boundary_r11.py
          tests/test_stage4_state_roots_r11.py
          tests/test_stage4_legacy_retirement_r11.py
          tests/test_stage4_hostile_cutover_r11.py
          tests/test_stage4_gate_compiler_r11.py

      - name: Frozen semantic authority guard
        run: python -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Integration Gatework shape check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('authority/rearchitecture_r11/CB16_R11_STAGE4_INTEGRATION_GATEWORK_V1.json')
          g = json.loads(p.read_text())
          assert g['mechanical_wave1_union_sha'] == 'bfb42b5a7e057c1ada791ea2e85cb2d02b4cffbf'
          assert [x['id'] for x in g['integration_tasks']] == ['INTA','INTB','INTC','INTD','INTE','INTF','INTG','INTH']
          assert g['scientific_status'] == 'DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE'
          assert g['final_consolidation']['long_endurance_required_now'] is False
          assert g['final_consolidation']['reserved_final_verdict'] == 'R11_CANONICAL_AUTHORITY_CUTOVER_QUALIFIED'
          print('STAGE4_INTEGRATION_SEED_GATEWORK_PASS')
          PY
