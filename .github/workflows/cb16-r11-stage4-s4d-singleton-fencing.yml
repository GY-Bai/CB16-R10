name: CB16 R11 Stage4 S4D Singleton Fencing

on:
  push:
    branches:
      - ai/r11-stage4-task-d-singleton-fencing-r0

jobs:
  s4d-short-qualification:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Required Stage4 tests
        run: python -m pytest -q tests/test_stage4_gatework_r11.py tests/test_stage4_authority_lease_r11.py
      - name: R11 static authority check
        run: python -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
      - name: Validate S4D receipt when present
        shell: bash
        run: |
          if [[ -f authority/rearchitecture_r11/stage4_receipts/S4D_RECEIPT_V1.json ]]; then
            python scripts/check_r11_stage4_task_receipt.py \
              --receipt authority/rearchitecture_r11/stage4_receipts/S4D_RECEIPT_V1.json \
              --repo-root .
          else
            echo "S4D implementation commit: receipt intentionally not created yet"
          fi
