name: CB16 R11 Stage4 S4D Singleton Fencing

on:
  push:
    branches:
      - ai/r11-stage4-task-d-singleton-fencing-r0

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-s4d-singleton-fencing
  cancel-in-progress: false

jobs:
  s4d-short-qualification:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    steps:
      - name: Checkout exact S4D source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve verified qualification Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/stage4_s4d_python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/stage4_s4d_python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Required Stage4 tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_gatework_r11.py \
            tests/test_stage4_authority_lease_r11.py

      - name: R11 static authority check
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Validate S4D receipt when present
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          if [[ -f authority/rearchitecture_r11/stage4_receipts/S4D_RECEIPT_V1.json ]]; then
            "$PY" scripts/check_r11_stage4_task_receipt.py \
              --receipt authority/rearchitecture_r11/stage4_receipts/S4D_RECEIPT_V1.json \
              --repo-root .
          else
            echo "S4D implementation commit: receipt intentionally not created yet"
          fi
