name: CB16 R11 M-Series H5.11 Common-Support Rank-Geometry Decomposition R0

on:
  push:
    branches:
      - ai/m-series-h5-11-common-support-rank-geometry-mechanism-decomposition-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_COMMON_SUPPORT_RANK_GEOMETRY_MECHANISM_DECOMPOSITION_R0_GATE_V1.json
      - cb16_local_opt/common_support_rank_geometry_decomposition_h511.py
      - tests/test_common_support_rank_geometry_decomposition_h511.py
      - scripts/r11_m_series_h5_11_common_support_rank_geometry_mechanism_decomposition_r0.py
      - .github/workflows/cb16-r11-m-series-h5-11-common-support-rank-geometry-mechanism-decomposition-r0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  h5-11-common-support-rank-geometry:
    name: H5.11 Student-free Teacher-free common-support rank geometry
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify preregistration authority and frozen scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 336f2617219c7783c6de4599cc86972355df5e0e e23534ec1b835dbc741ab02b074625cb3e8b6146
          git merge-base --is-ancestor e23534ec1b835dbc741ab02b074625cb3e8b6146 HEAD
          test "$(git rev-parse e23534ec1b835dbc741ab02b074625cb3e8b6146:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_COMMON_SUPPORT_RANK_GEOMETRY_MECHANISM_DECOMPOSITION_R0_GATE_V1.json)" = "bec91b527d66113d28681b55cd7a432133f8ee2c"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_COMMON_SUPPORT_RANK_GEOMETRY_MECHANISM_DECOMPOSITION_R0_GATE_V1.json)" = "bec91b527d66113d28681b55cd7a432133f8ee2c"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_10_1_STRICT_CLOCK_HALFBLOCK_REPLICATION_R0_ADJUDICATION_V1.json)" = "b6b0b0af59a899df15438c93550795e799269c65"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/common_support_rank_geometry_decomposition_h511.py)" = "918f98d499ff5ed2f36e7d6a6bf3268fca37c27c"
          test "$(git rev-parse HEAD:tests/test_common_support_rank_geometry_decomposition_h511.py)" = "36e417581a8db1f7c0864461b5f64f89ba2abfcb"
          test "$(git rev-parse HEAD:scripts/r11_m_series_h5_11_common_support_rank_geometry_mechanism_decomposition_r0.py)" = "1be46b5862652199bda19ea3566c10d6416618e8"
          test "$(git rev-parse HEAD:cb16_local_opt/medium48_strict_clock_halfblock_replication_h5101.py)" = "f63e68673a8763265d7ff1b8009a3cb04f23fbd3"
          test "$(git rev-parse HEAD:cb16_local_opt/medium48_temporal_halfblock_stability_h510.py)" = "176983eb0f7beb6396823126f4bc1504c4418054"
          test "$(git rev-parse HEAD:cb16_local_opt/operator_conditional_medium_geometry_h58.py)" = "aaddbad059c7262a8137db87bee25d38c07afd83"
          test "$(git rev-parse HEAD:cb16_local_opt/time_local_vs_forward_geometry_contrast_h56.py)" = "a264ff21d0447527c4dda06ee8fd63cf20207daf"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55.py)" = "1dd00ea9b40b8da4061c0983fc44fb2307c72587"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55_clarified.py)" = "faa5233170aa421c3bf44f023b1d8e2f7c187568"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_temporal_transport_audit_h5.py)" = "09b05de23c659fe6f47a43117ec70b5cafcf7d21"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_vectorized_r11.py)" = "083ca6541b45577cfeb6d9a376b25e0eaf8d060a"
          test "$(git rev-parse HEAD:cb16_local_opt/r102_evidence_cache.py)" = "91fb73565ec60f66bf4232957f9b9b2f88cc3cfe"
          test "$(git rev-parse HEAD:cb16_local_opt/reduced_teacher_target_information_audit_r6.py)" = "bd7a8780e8dcab05cfae92744fde523ce62cc9ae"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_h511_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_h511_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run H5.11 unit and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h511_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/common_support_rank_geometry_decomposition_h511.py \
            tests/test_common_support_rank_geometry_decomposition_h511.py \
            scripts/r11_m_series_h5_11_common_support_rank_geometry_mechanism_decomposition_r0.py
          "$PYTHON" -m pytest -q \
            tests/test_common_support_rank_geometry_decomposition_h511.py \
            tests/test_medium48_strict_clock_halfblock_replication_h5101.py \
            tests/test_medium48_temporal_halfblock_stability_h510.py \
            tests/test_medium48_antialignment_breadth_h59.py \
            tests/test_operator_conditional_medium_geometry_h58.py \
            tests/test_medium48_relational_composition_falsification_h57.py \
            tests/test_time_local_vs_forward_geometry_contrast_h56.py \
            tests/test_state_utility_geometry_transport_audit_h55.py \
            tests/test_state_utility_geometry_transport_audit_h55_clarified.py \
            tests/test_teacher_temporal_transport_audit_h5.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_independent_purge_alignment_replication_r5.py \
            tests/test_r11_teacher_balanced_binding.py

      - name: Execute preregistered H5.11 common-support decomposition
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h511_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-h511-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_h511_run_root.txt"
          "$PYTHON" -m scripts.r11_m_series_h5_11_common_support_rank_geometry_mechanism_decomposition_r0 \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_H5_11_COMMON_SUPPORT_RANK_GEOMETRY_MECHANISM_DECOMPOSITION_R0_RESULT.json"

      - name: Verify H5.11 receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_h511_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_H5_11_COMMON_SUPPORT_RANK_GEOMETRY_MECHANISM_DECOMPOSITION_R0_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_H5_11_COMMON_SUPPORT_RANK_GEOMETRY_MECHANISM_DECOMPOSITION_R0_RESULT_V1',x
          assert x['repo']['preregistration_commit']=='e23534ec1b835dbc741ab02b074625cb3e8b6146',x['repo']
          assert x['repo']['immutable_blobs']['gate']=='bec91b527d66113d28681b55cd7a432133f8ee2c',x['repo']
          assert x['repo']['immutable_blobs']['h5101_adjudication']=='b6b0b0af59a899df15438c93550795e799269c65',x['repo']
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert [int(d['fold']) for d in x['outcome_blind_fold_designs']]==[1,2,3,4,5],x
          assert all(d['utility_accessed'] is False for d in x['outcome_blind_fold_designs']),x
          assert [tuple(map(int,d['pair'])) for d in x['outcome_blind_pair_designs']]==[(1,2),(2,3),(3,4),(4,5)],x
          assert all(d['utility_used_to_construct_q'] is False and d['propensity_model_fit'] is False and d['q_recomputed_for_null'] is False for d in x['outcome_blind_pair_designs']),x
          assert x['protocol']['pair_count_is_statistical_n'] is False and x['protocol']['same_future_group_is_dependence_unit'] is True,x['protocol']
          status=x['status']; s=x['h5_11_summary']
          if status=='H5_11_EXECUTION_BLOCKED__INSUFFICIENT_COMMON_SUPPORT':
              assert s['classification']=='EXECUTION_BLOCKED__INSUFFICIENT_COMMON_SUPPORT',s
              assert x['utility_pass_executed'] is False,x
              assert x['native_h5_8_baselines']==[] and x['pair_results']==[],x
              assert x['semantic_guards']['utility_pass_executed_after_failed_support_gate'] is False,x
          elif status=='H5_11_EXECUTION_BLOCKED__H5_8_BASELINE_REPRODUCTION_FAILED':
              assert s['classification']=='EXECUTION_BLOCKED__H5_8_BASELINE_REPRODUCTION_FAILED',s
              assert x['utility_pass_executed'] is True,x
              assert len(x['native_h5_8_baselines'])==5,x
              assert not all(bool(r['reproduced']) for r in x['native_h5_8_baselines']),x
          else:
              assert status=='H5_11_COMMON_SUPPORT_RANK_GEOMETRY_COMPLETE',x
              assert x['utility_pass_executed'] is True,x
              assert len(x['native_h5_8_baselines'])==5 and all(bool(r['reproduced']) for r in x['native_h5_8_baselines']),x
              assert len(x['pair_results'])==4,x
              for p in x['pair_results']:
                  assert p['common_support_valid'] is True,p
                  assert p['clock_support_gate_passed'] is True and p['axis_span_gate_passed'] is True,p
                  assert abs(sum(map(float,p['q']))-1.0)<=1e-12,p
                  for side in ('side_a','side_b'):
                      y=p[side]
                      assert y['post_weight_max_abs_error_vs_q']<=1e-12,y
                      assert y['same_aligned_candidate_weights_used_for_all_nulls'] is True,y
                      assert y['q_recomputed_for_null'] is False,y
                      assert y['orientation'] in {'POSITIVE_ALIGNMENT','ANTI_ALIGNMENT','MIXED'},y
                      assert math.isfinite(float(y['aligned_partial_rho'])) and math.isfinite(float(y['null_median_partial_rho'])),y
              assert s['classification'] in {
                  'COARSENED_COMMON_SUPPORT_CONDITIONAL_MAPPING_INSTABILITY_SUPPORTED',
                  'COARSENED_OCCUPANCY_STANDARDIZATION_REMOVES_NATIVE_ORIENTATION_TRANSITIONS',
                  'MIXED_OCCUPANCY_AND_CONDITIONAL_MAPPING_EVIDENCE',
              },s
              g=x['semantic_guards']
              assert g['utility_accessed_during_overlap_design'] is False and g['overlap_q_or_cell_selection_used_utility'] is False,g
              assert g['q_recomputed_for_structured_null'] is False and g['same_aligned_candidate_weights_used_for_all_structured_nulls'] is True,g
              assert g['support_or_normalization_reselected_after_weighting'] is False and g['distance_metric_changed'] is False,g
              assert g['grid_used_as_new_representation'] is False and g['propensity_model_fit'] is False and g['new_representation_trained'] is False,g
              assert g['teacher_compiled_for_scientific_score'] is False and g['student_training_used'] is False,g
              assert g['fusion_weights_searched'] is False and g['organ_weights_tuned'] is False,g
              assert g['learned_gate_or_router_created'] is False and g['handcrafted_time_or_regime_gate_created'] is False,g
              assert g['calendar_or_fold_id_used_as_runtime_permission_signal'] is False and g['change_point_search_used'] is False,g
              assert g['final_holdout_payload_opened'] is False and g['r7_candidate_evaluated'] is False,g
          assert s['market_information_verdict'] is False and s['canonical_change_authorized'] is False,s
          print(json.dumps({
              'status':status,
              'classification':s['classification'],
              'flip_persistence_count_of_3':s['native_flip_persistence_count_of_3'],
              'flip_clean_removal_count_of_3':s['native_flip_clean_removal_count_of_3'],
              'positive_control_pair_stable':s['positive_control_pair_stable'],
              'next_legal_step':x['next_legal_step'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload H5.11 evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-h5-11-common-support-rank-geometry-mechanism-decomposition-r0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_h511_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_h511_python.json
            ${{ runner.temp }}/cb16-r11-m-series-h511-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
