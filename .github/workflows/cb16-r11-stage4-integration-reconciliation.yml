name: CB16 R11 Stage4 Integration Reconciliation

on:
  push:
    branches:
      - ai/r11-stage4-integration-r0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 15
    env:
      INTEGRATION_SEED_SHA: 86a4ac8a9080cd8382600cb998059e9585495a11
      MECHANICAL_UNION_SHA: 5769848b2cc2ec459f25655610f69068f812e16d
      SEMANTIC_FREEZE_BLOB_SHA: 3c401a0a350984381912f7860181e3e96eb8d7cf
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify controlled consolidation ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${INTEGRATION_SEED_SHA}" HEAD
          git merge-base --is-ancestor "${MECHANICAL_UNION_SHA}" HEAD
          test -z "$(git rev-list --merges "${INTEGRATION_SEED_SHA}"..HEAD)"
          test "$(git rev-parse "${MECHANICAL_UNION_SHA}^")" = "${INTEGRATION_SEED_SHA}"
          test "$(git rev-parse "HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")" = "${SEMANTIC_FREEZE_BLOB_SHA}"
          test ! -e authority/rearchitecture_r11/stage4_integration_receipts

      - name: Resolve verified canonical R10.4 Python
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/resolve_verified_r104_python.py --out /tmp/cb16_stage4_integration_python.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_stage4_integration_python.json'))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          print('PYTHON_ENV_READY')
          PY

      - name: Run accepted A-H tests plus reconciliation
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_stage4_integration_python.json'))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m pytest -q \
            tests/test_stage4_runtime_spine_integration_r11.py \
            tests/test_stage4_fenced_persistence_r11.py \
            tests/test_stage4_authoritative_engines_r11.py \
            tests/test_stage4_execution_integration_r11.py \
            tests/test_stage4_recovery_integration_r11.py \
            tests/test_stage4_orchestration_provider_r11.py \
            tests/test_stage4_hostile_integration_harness_r11.py \
            tests/test_stage4_integration_gate_compiler_r11.py \
            tests/test_stage4_consolidated_authority_r11.py

      - name: Rebuild static authority inventory
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_stage4_integration_python.json'))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Prove no scientific or endurance scope expansion
        shell: bash
        run: |
          set -euo pipefail
          git diff --unified=0 "${MECHANICAL_UNION_SHA}"..HEAD -- authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json | test ! -s /dev/stdin
          ! git diff --name-only "${MECHANICAL_UNION_SHA}"..HEAD | grep -E '(^|/)(2025-09|final_holdout|market_data|raw_1m)(/|$)'
          ! grep -R -n -E 'RUN_30M|RUN_2H|RUN_6H|FREQ=.*(30M|2H|6H)' .github/workflows/cb16-r11-stage4-integration-reconciliation.yml
          echo STAGE4_RECONCILIATION_SCOPE_PASS
