name: CB16 Runner Unit Hardening R0

on:
  push:
    branches:
      - ai/r2-evidence-storage-r0
    paths:
      - .github/workflows/cb16-runner-unit-hardening-r0.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-units:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    steps:
      - name: Read exact runner unit hardening
        shell: bash
        run: |
          set -euo pipefail
          echo "SELF_CGROUP_BEGIN"
          cat /proc/self/cgroup
          echo "SELF_CGROUP_END"
          for u in cb16-github-runner.service cb16-github-canonical-runner.service; do
            echo "UNIT_BEGIN=$u"
            systemctl show "$u" \
              -p Id \
              -p FragmentPath \
              -p DropInPaths \
              -p User \
              -p Group \
              -p ProtectSystem \
              -p ProtectHome \
              -p PrivateTmp \
              -p PrivateDevices \
              -p DynamicUser \
              -p RootDirectory \
              -p RootImage \
              -p ReadOnlyPaths \
              -p ReadWritePaths \
              -p InaccessiblePaths \
              -p BindReadOnlyPaths \
              -p BindPaths \
              -p TemporaryFileSystem \
              --no-pager || true
            echo "UNIT_END=$u"
          done
          echo "MOUNT_VIEW_BEGIN"
          findmnt -T /data/cb16_hdd/cb16_diagnostics -o TARGET,SOURCE,FSTYPE,OPTIONS || true
          findmnt -T /data/cb16_hdd/cb16_runtime/R10_4 -o TARGET,SOURCE,FSTYPE,OPTIONS || true
          echo "MOUNT_VIEW_END"
