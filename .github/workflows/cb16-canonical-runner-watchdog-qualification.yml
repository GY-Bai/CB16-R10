name: CB16 Canonical Runner Watchdog Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r2-evidence-storage-r0
    paths:
      - .github/cb16-runner-watchdog-trigger.json

permissions:
  contents: write

jobs:
  watchdog-qualification:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    env:
      CANONICAL_SERVICE: cb16-github-canonical-runner.service
      WSS_SERVICE: cb16-github-runner.service
      CANONICAL_DIR: /data/cb16_ci/github-runner-canonical
      WSS_DIR: /data/cb16_ci/github-runner-qualification/actions-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect runner services and recovery authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          canonical_service=os.environ['CANONICAL_SERVICE']
          wss_service=os.environ['WSS_SERVICE']
          canonical_dir=pathlib.Path(os.environ['CANONICAL_DIR']).resolve()
          wss_dir=pathlib.Path(os.environ['WSS_DIR']).resolve()

          def run(cmd):
              p=subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              return p.returncode, p.stdout.strip()

          def pids(pattern):
              rc,out=run(['pgrep','-f',pattern])
              return [int(x) for x in out.split() if x.isdigit()] if rc==0 else []

          def cwd(pid):
              try: return str(pathlib.Path(f'/proc/{pid}/cwd').resolve())
              except Exception: return None

          rc_c, active_c=run(['systemctl','is-active',canonical_service])
          rc_w, active_w=run(['systemctl','is-active',wss_service])

          listeners=[]
          for pid in sorted(set(pids('Runner.Listener') + pids('runsvc.sh'))):
              listeners.append({'pid':pid,'cwd':cwd(pid)})
          workers=[]
          for pid in pids('Runner.Worker'):
              workers.append({'pid':pid,'cwd':cwd(pid)})

          systemctl=run(['bash','-lc','command -v systemctl'])[1] or '/usr/bin/systemctl'
          sudo_cmd=['sudo','-n','-l',systemctl,'restart',canonical_service]
          sudo_rc,sudo_out=run(sudo_cmd)

          latest_log=None
          latest_tail=[]
          diag=canonical_dir/'_diag'
          logs=sorted(diag.glob('Runner_*.log'), key=lambda p:p.stat().st_mtime, reverse=True) if diag.exists() else []
          if logs:
              latest_log=str(logs[0])
              try:
                  latest_tail=logs[0].read_text(errors='replace').splitlines()[-80:]
              except Exception as e:
                  latest_tail=[f'LOG_READ_ERROR:{e!r}']

          canonical_workers=[x for x in workers if x['cwd'] and str(canonical_dir) in x['cwd']]
          result={
              'schema':'CB16_CANONICAL_RUNNER_WATCHDOG_QUALIFICATION_R0',
              'canonical_service':canonical_service,
              'wss_service':wss_service,
              'canonical_service_active':active_c=='active',
              'wss_service_active':active_w=='active',
              'canonical_dir':str(canonical_dir),
              'wss_dir':str(wss_dir),
              'separate_install_dirs':canonical_dir != wss_dir,
              'listeners':listeners,
              'canonical_workers':canonical_workers,
              'sudo_restart_check_command':' '.join(sudo_cmd),
              'sudo_restart_authorized_noninteractive':sudo_rc==0,
              'sudo_restart_check_output':sudo_out,
              'canonical_latest_runner_log':latest_log,
              'canonical_latest_log_tail':latest_tail,
              'restart_performed':False,
          }
          pathlib.Path('ci_evidence/watchdog_qualification.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:result[k] for k in (
              'canonical_service_active','wss_service_active','separate_install_dirs',
              'sudo_restart_authorized_noninteractive','restart_performed')},sort_keys=True))
          assert result['canonical_service_active']
          assert result['wss_service_active']
          assert result['separate_install_dirs']
          PY

      - name: Persist watchdog evidence to branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SNAP="$RUNNER_TEMP/cb16-watchdog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SNAP"
          mkdir -p "$SNAP"
          cp -a ci_evidence/. "$SNAP"/
          BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          DEST="ci-results/runner-watchdog/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$SNAP"/. "$DEST"/
          git config user.name 'cb16-runner-watchdog-ci'
          git config user.email '37661207+GY-Bai@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "ci-results: runner watchdog qualification ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin "HEAD:$BRANCH"
          fi
