name: CB16 R21 RC2 R3 Recovery Runner Gate

on:
  push:
    branches:
      - ai/r21-rc2-r3-fast-hot-runner
    paths:
      - "infra/shanxi_runner/runner_launch_spec_r21_v2.json"
      - "scripts/verify_r21_rc2_r3_recovery_runner_v2.py"
      - "tests/test_r21_rc2_r3_recovery_runner_v2.py"
      - "authority/infra/R21_RC2_R2_OWNER_APPROVAL_V2.json"
      - "authority/infra/R21_RC2_R2_EXPECTED_VS_ACTUAL_V1.json"
      - "authority/infra/R21_RC2_R3_TASK_LOCAL_CHANGE_PLAN_V2.json"
      - ".github/workflows/cb16-r21-rc2-r3-recovery-runner-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_UV_CACHE_DIR: /cb16/uv-cache
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  r21-recovery-runner-gate:
    name: R21 Recovery runner profile gate
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r21]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout R21 RC2 R3 branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/r3_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r3_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['python']['network_install_attempted'] is False, p
          print('R3_PYTHON_ENV_READY')
          PY

      - name: Run R3 profile tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r3_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          PYTHONPATH=. "$PYTHON" -m pytest -q tests/test_r21_rc2_r3_recovery_runner_v2.py

      - name: Verify R21 Recovery runner profile
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r3_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          PYTHONPATH=. "$PYTHON" scripts/verify_r21_rc2_r3_recovery_runner_v2.py \
            --json-out "$RUNNER_TEMP/R3_RECOVERY_RUNNER_GATE.json"

      - name: Upload R3 Recovery runner evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r21-rc2-r3-recovery-runner-gate
          path: |
            ${{ runner.temp }}/R3_RECOVERY_RUNNER_GATE.json
            ${{ runner.temp }}/r3_docker_preflight.json
            ${{ runner.temp }}/r3_python.json
          if-no-files-found: error
          retention-days: 90
