name: CB16 R11 Stage2 Task B GTX1060 Microbench

on:
  push:
    branches:
      - ai/r11-stage2-task-b-gpu-throughput-r1
    paths:
      - .github/workflows/cb16-r11-stage2-task-b-gpu-microbench.yml
      - scripts/run_r11_task_b_gpu_microbench.py
      - cb16_local_opt/gpu_runtime_r11.py
      - cb16_local_opt/training_runtime_r11.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-b-gtx1060-microbench:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    steps:
      - name: Checkout Task B branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Reuse verified canonical R10.4 Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          test -x "$PYBIN"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Runner GPU and canonical arithmetic identity
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)"
          "$PY" --version
          nvidia-smi
          "$PY" - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("torch_cuda", torch.version.cuda)
          assert torch.cuda.is_available(), "CUDA unavailable"
          print("gpu", torch.cuda.get_device_name(0))
          print("capability", torch.cuda.get_device_capability(0))
          assert torch.cuda.get_device_capability(0) == (6, 1), "Task B requires sm_61"
          assert torch.get_default_dtype() == torch.float32
          assert torch.backends.cuda.matmul.allow_tf32 is False
          print("TASK_B_GPU_IDENTITY=PASS")
          PY

      - name: Compile Task B microbenchmark
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile \
            cb16_local_opt/gpu_runtime_r11.py \
            cb16_local_opt/training_runtime_r11.py \
            scripts/run_r11_task_b_gpu_microbench.py

      - name: Task B synthetic FP32 microbenchmark
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          CUDA_VISIBLE_DEVICES: "0"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o ci_evidence/time_verbose.txt \
            "$PY" -u scripts/run_r11_task_b_gpu_microbench.py \
            2>&1 | tee ci_evidence/task_b_micro_stdout.log

      - name: Gate correctness identity and benchmark scope
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          line = next(
              x for x in Path('ci_evidence/task_b_micro_stdout.log').read_text().splitlines()
              if x.startswith('TASK_B_REAL_MACHINE_RESULT=')
          )
          r=json.loads(line.split('=',1)[1])
          assert r['status']=='PASS_CORRECTNESS_IDENTITY'
          assert r['scientific_verdict_changed'] is False
          assert r['data_source']=='SYNTHETIC_FIXED_SEED_ONLY'
          assert r['fp32'] is True and r['amp'] is False and r['tf32'] is False
          assert r['execution_profile']['compute_capability']==[6,1]
          assert r['execution_profile']['execution_path']=='GTX1060_SM61_FP32'
          assert r['permutation']['identity_equal'] is True
          assert r['evaluation']['identity_behavior_equal'] is True
          assert r['evaluation']['identity_loss_abs'] <= 1e-7
          assert r['training']['optimizer_steps_equal'] is True
          assert r['training']['gradient_owner_set_equal'] is True
          assert r['training']['state_max_abs_diff'] <= 1e-7
          assert r['training']['behavior_fingerprint_equal'] is True
          assert r['training']['eval_loss_abs'] <= 1e-7
          print('TASK_B_REAL_MACHINE_MICRO_BENCHMARK=PASS')
          PY

      - name: Upload Task B microbenchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage2-task-b-micro-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          if-no-files-found: warn
          retention-days: 30
