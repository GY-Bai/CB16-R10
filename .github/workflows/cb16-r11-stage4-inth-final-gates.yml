name: CB16 R11 Stage4 INTH Final Gates

on:
  push:
    branches:
      - ai/r11-stage4-int-h-final-gates-r0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inth-final-gates:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 15
    env:
      INTEGRATION_SEED_SHA: 86a4ac8a9080cd8382600cb998059e9585495a11
      SEMANTIC_FREEZE_BLOB_SHA: 3c401a0a350984381912f7860181e3e96eb8d7cf
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact seed ancestry and no Integration merge
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${INTEGRATION_SEED_SHA}^{commit}"
          git merge-base --is-ancestor "${INTEGRATION_SEED_SHA}" HEAD
          test -z "$(git rev-list --merges "${INTEGRATION_SEED_SHA}"..HEAD)"
          test "$(git rev-parse "HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")" = "${SEMANTIC_FREEZE_BLOB_SHA}"

      - name: Resolve verified canonical R10.4 Python
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/resolve_verified_r104_python.py --out /tmp/cb16_inth_python.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_inth_python.json'))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          print('PYTHON_ENV_READY')
          PY

      - name: Run INTH synthetic fail-closed qualification
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_inth_python.json'))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m pytest -q tests/test_stage4_integration_gate_compiler_r11.py
          "$PYTHON" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Validate INTH receipt shape when present
        shell: bash
        run: |
          set -euo pipefail
          receipt=authority/rearchitecture_r11/stage4_integration_receipts/INTH_RECEIPT_V1.json
          if [[ -f "$receipt" ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          from cb16_local_opt.stage4_integration_gate_compiler_r11 import validate_schema
          root=Path('.')
          receipt=json.loads((root/'authority/rearchitecture_r11/stage4_integration_receipts/INTH_RECEIPT_V1.json').read_text())
          schema=json.loads((root/'authority/rearchitecture_r11/CB16_R11_STAGE4_INTEGRATION_RECEIPT_SCHEMA_V1.json').read_text())
          validate_schema(receipt,schema)
          assert receipt['task_id']=='INTH'
          assert receipt['integration_seed_sha']=='86a4ac8a9080cd8382600cb998059e9585495a11'
          assert receipt['semantic_guards']['sibling_integration_dependency_used'] is False
          assert receipt['correctness_invariants'].get('final_cutover_verdict_emitted') is False
          print('INTH_RECEIPT_SCHEMA_PASS')
          PY
          else
            echo "IMPLEMENTATION_HEAD_RECEIPT_ABSENT_EXPECTED"
          fi
