name: CB16 R11 Stage4 INTC Engine Authority

on:
  push:
    branches:
      - ai/r11-stage4-int-c-engine-authority-r0

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-intc-engine-authority
  cancel-in-progress: false

jobs:
  intc-short-qualification:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    steps:
      - name: Checkout exact INTC source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable Integration Seed ancestry
        shell: bash
        run: |
          set -euo pipefail
          SEED=86a4ac8a9080cd8382600cb998059e9585495a11
          git cat-file -e "$SEED^{commit}"
          git merge-base --is-ancestor "$SEED" HEAD
          test "$(git rev-list --merges "$SEED"..HEAD --count)" -eq 0
          test "$(git rev-parse "$SEED:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"

      - name: Resolve verified qualification Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/stage4_intc_python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/stage4_intc_python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: INTC authority wrapper tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_gatework_r11.py \
            tests/test_stage4_authoritative_engines_r11.py

      - name: R11 static semantic authority guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
