name: CB16 Runner Unit Hardening Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r2-evidence-storage-r0
    paths:
      - .github/cb16-runner-unit-hardening-trigger.json

permissions:
  contents: read

jobs:
  canonical-unit:
    runs-on: [self-hosted, shanxi, cb16-r10-canonical]
    timeout-minutes: 10
    steps:
      - name: Inspect canonical service hardening
        shell: bash
        run: |
          set -euo pipefail
          UNIT=cb16-github-canonical-runner.service
          echo "UNIT=$UNIT"
          systemctl show "$UNIT" \
            -p Id -p FragmentPath -p DropInPaths -p User -p Group \
            -p ProtectSystem -p ProtectHome -p PrivateTmp \
            -p ReadOnlyPaths -p ReadWritePaths -p InaccessiblePaths \
            -p BindReadOnlyPaths -p BindPaths -p RootDirectory -p RootImage \
            -p DynamicUser -p SupplementaryGroups --no-pager
          echo 'CAT_BEGIN'
          systemctl cat "$UNIT" --no-pager 2>/dev/null | sed -E 's/(TOKEN|SECRET|PASSWORD|PASS|KEY|AUTH)=.*/\1=<REDACTED>/'
          echo 'CAT_END'

  wss-unit:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    steps:
      - name: Inspect WSS service hardening
        shell: bash
        run: |
          set -euo pipefail
          UNIT=cb16-github-runner.service
          echo "UNIT=$UNIT"
          systemctl show "$UNIT" \
            -p Id -p FragmentPath -p DropInPaths -p User -p Group \
            -p ProtectSystem -p ProtectHome -p PrivateTmp \
            -p ReadOnlyPaths -p ReadWritePaths -p InaccessiblePaths \
            -p BindReadOnlyPaths -p BindPaths -p RootDirectory -p RootImage \
            -p DynamicUser -p SupplementaryGroups --no-pager
          echo 'CAT_BEGIN'
          systemctl cat "$UNIT" --no-pager 2>/dev/null | sed -E 's/(TOKEN|SECRET|PASSWORD|PASS|KEY|AUTH)=.*/\1=<REDACTED>/'
          echo 'CAT_END'
