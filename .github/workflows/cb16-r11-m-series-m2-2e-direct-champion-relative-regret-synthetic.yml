name: CB16 R11 M-Series M2.2E Direct Champion Relative Regret Synthetic

on:
  push:
    branches:
      - ai/m-series-m2-2e-direct-champion-relative-regret-synthetic-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M2_2E_DIRECT_CHAMPION_RELATIVE_REGRET_SYNTHETIC_GATE_V1.json
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M2_2D_PAIRWISE_UTILITY_RANKING_SYNTHETIC_ADJUDICATION_V1.json
      - cb16_local_opt/m_series_m2_2e_direct_champion_relative_regret_synthetic.py
      - tests/test_m_series_m2_2e_direct_champion_relative_regret_synthetic.py
      - scripts/r11_m_series_m2_2e_direct_champion_relative_regret_synthetic.py
      - .github/workflows/cb16-r11-m-series-m2-2e-direct-champion-relative-regret-synthetic.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  m2-2e-synthetic:
    name: M2.2E direct Champion-relative regret synthetic benchmark
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable M2.2E preregistration and M2.2D adjudication
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e9b7c12d8ad92622d89d7e47d442790d5e486ff1 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M2_2E_DIRECT_CHAMPION_RELATIVE_REGRET_SYNTHETIC_GATE_V1.json)" = "638516b1b948dc074d7b90824334c3e9b276d959"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M2_2D_PAIRWISE_UTILITY_RANKING_SYNTHETIC_ADJUDICATION_V1.json)" = "e6ce2a9507a1a943b6ca3f3d0a4c1e681276df89"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_m22e_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_m22e_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run M2.2E unit and inherited synthetic gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_m22e_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/m_series_m2_2_advantage_mirror_synthetic.py \
            cb16_local_opt/m_series_m2_2b_advantage_weighted_selective_synthetic.py \
            cb16_local_opt/m_series_m2_2c_balanced_preserve_correction_synthetic.py \
            cb16_local_opt/m_series_m2_2d_pairwise_utility_ranking_synthetic.py \
            cb16_local_opt/m_series_m2_2e_direct_champion_relative_regret_synthetic.py \
            tests/test_m_series_m2_2_advantage_mirror_synthetic.py \
            tests/test_m_series_m2_2b_advantage_weighted_selective_synthetic.py \
            tests/test_m_series_m2_2c_balanced_preserve_correction_synthetic.py \
            tests/test_m_series_m2_2d_pairwise_utility_ranking_synthetic.py \
            tests/test_m_series_m2_2e_direct_champion_relative_regret_synthetic.py \
            scripts/r11_m_series_m2_2e_direct_champion_relative_regret_synthetic.py
          "$PYTHON" -m pytest -q \
            tests/test_m_series_m2_2_advantage_mirror_synthetic.py \
            tests/test_m_series_m2_2b_advantage_weighted_selective_synthetic.py \
            tests/test_m_series_m2_2c_balanced_preserve_correction_synthetic.py \
            tests/test_m_series_m2_2d_pairwise_utility_ranking_synthetic.py \
            tests/test_m_series_m2_2e_direct_champion_relative_regret_synthetic.py

      - name: Execute preregistered 20-cell 600-arm M2.2E benchmark
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_m22e_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-m22e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_m22e_run_root.txt"
          "$PYTHON" -m scripts.r11_m_series_m2_2e_direct_champion_relative_regret_synthetic \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_M2_2E_DIRECT_CHAMPION_RELATIVE_REGRET_SYNTHETIC_RESULT.json" \
            --device cuda

      - name: Verify M2.2E receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_m22e_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_M2_2E_DIRECT_CHAMPION_RELATIVE_REGRET_SYNTHETIC_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_M2_2E_DIRECT_CHAMPION_RELATIVE_REGRET_SYNTHETIC_RESULT_V1',x
          assert x['status']=='M2_2E_DIRECT_CHAMPION_RELATIVE_REGRET_SYNTHETIC_COMPLETE',x
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          p=x['protocol']
          assert p['synthetic_only'] is True and p['market_data_read'] is False and p['market_evidence_read'] is False,p
          assert p['prior_primary_seed_cells_reused'] is False,p
          assert p['cells']==20 and p['arms_per_cell']==30 and p['total_arms']==600,p
          assert p['candidate_teacher_probability_target'] is False and p['candidate_pairwise_ranking_target'] is False,p
          assert p['candidate_preservation_ce_or_kl'] is False,p
          assert p['candidate_temperature_threshold_margin_or_tunable_scale'] is False,p
          assert p['candidate_positive_advantage_normalization_deterministic'] is True and p['new_trainable_parameters']==0,p
          assert len(x['cells'])==20,x
          for c in x['cells']:
              assert len(c['arms'])==30,c
              direct=c['arms']['DIRECT_POSITIVE_CHAMPION_RELATIVE_EXPECTED_ADVANTAGE__ALIGNED']['objective']
              assert direct['agreement_rows_exact_zero_advantage'] is True,direct
              assert abs(float(direct['mean_normalized_positive_advantage'])-1.0)<1e-10,direct
              assert direct['teacher_probability_target']=='NONE' and direct['pairwise_ranking_target']=='NONE',direct
              for arm in c['arms'].values():
                  e=arm['evaluation']
                  for k in ('true_discrete_champion_relative_gain','true_available_advantage_capture_fraction','true_harmful_cost_mean','true_negative_gain_rate','true_direction_change_rate'):
                      assert math.isfinite(float(e[k])),(k,e)
          s=x['m2_2e_summary']
          assert len(s['per_regime'])==4,s
          assert s['conclusion'] in {
              'DIRECT_CHAMPION_RELATIVE_DECISION_VALUE_SURROGATE_SYNTHETICALLY_QUALIFIED_FOR_SEPARATELY_PREREGISTERED_CONSUMED_TRAIN_ONLY_SHADOW',
              'DIRECT_CHAMPION_RELATIVE_DECISION_VALUE_SURROGATE_NOT_SYNTHETICALLY_QUALIFIED__STOP_DIRECTION_OBJECTIVE_SEARCH_BEFORE_BROADER_MECHANISTIC_REASSESSMENT',
          },s
          assert s['market_information_verdict'] is False and s['canonical_change_authorized'] is False and s['m3_sizing_authorized'] is False,s
          g=x['semantic_guards']
          assert g['market_data_used'] is False and g['market_evidence_used'] is False,g
          assert g['canonical_generation_advanced'] is False and g['champion_promoted'] is False and g['production_cutover'] is False,g
          assert g['market_information_verdict_reopened'] is False and g['final_holdout_payload_opened'] is False and g['r7_candidate_evaluated'] is False,g
          print(json.dumps({'status':x['status'],'conclusion':s['conclusion'],'overall_pass':s['overall_pass'],'per_regime':s['per_regime'],'next_legal_step':x['next_legal_step']},indent=2,sort_keys=True))
          PY

      - name: Upload M2.2E synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-m2-2e-direct-champion-relative-regret-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_m22e_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_m22e_python.json
            ${{ runner.temp }}/cb16-r11-m-series-m22e-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
