name: stage4-s4e-permission-closure

on:
  push:
    branches:
      - ai/r11-stage4-task-e-permission-closure-r0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4e-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Gatework and S4E hostile tests
        run: python -m pytest -q tests/test_stage4_gatework_r11.py tests/test_stage4_permission_boundary_r11.py
      - name: Run R11 static authority check
        run: python -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
      - name: Validate S4E receipt when present
        shell: bash
        run: |
          RECEIPT=authority/rearchitecture_r11/stage4_receipts/S4E_RECEIPT_V1.json
          if [[ -f "$RECEIPT" ]]; then
            python scripts/check_r11_stage4_task_receipt.py --receipt "$RECEIPT" --repo-root .
          else
            echo "S4E receipt not present at implementation head; validator deferred to receipt commit."
          fi
