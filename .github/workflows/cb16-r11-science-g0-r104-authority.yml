name: CB16 R11 Science G0 R10.4 Authority Inspect

on:
  push:
    branches:
      - ai/r11-science-g0-historical-r0
      - ai/r11-docker-runner-r0
    paths:
      - scripts/r11_science_g0_r104_authority_inspect.py
      - ci/resolve_verified_r104_python.py
      - ci/docker_preflight.py
      - .github/workflows/cb16-r11-science-g0-r104-authority.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  inspect:
    name: Inspect R10.4 G66 authority
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_r104_docker_preflight.json"

      - name: Verify clean-main ancestry and frozen authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fc11c18ebd6dd0c883216766ed59cacb05e9a0c0 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_g0_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          PY

      - name: Inspect G66 authority read-only
        shell: bash
        run: |
          set -euo pipefail
          PY_JSON="$RUNNER_TEMP/cb16_r11_g0_python.json"
          OUT="$RUNNER_TEMP/cb16_r11_g0_r104_authority.json"
          PYTHON=$(python3 - "$PY_JSON" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          CB16_G0_R104_AUTHORITY_OUT="$OUT" PYTHONPATH="$GITHUB_WORKSPACE" "$PYTHON" scripts/r11_science_g0_r104_authority_inspect.py

      - name: Upload compact authority evidence
        uses: actions/upload-artifact@v5
        with:
          name: cb16-r11-science-g0-r104-authority
          path: ${{ runner.temp }}/cb16_r11_g0_r104_authority.json
          if-no-files-found: error
          retention-days: 30
