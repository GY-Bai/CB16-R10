name: CB16 R11 Science G0 S4F Preflight

on:
  push:
    branches:
      - ai/r11-science-g0-historical-r0
      - ai/r11-docker-runner-r0
    paths:
      - .github/workflows/cb16-r11-science-g0-s4f-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  s4f-preflight:
    name: Observe Stage-4 S4F raw-root compatibility
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi, shanxi-docker-r11]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen Stage-4 implementation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fc11c18ebd6dd0c883216766ed59cacb05e9a0c0 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/stage4_state_roots_r11.py)" = "7080b77f3e9323e6b6bbd445f0c3af8f620903b3"

      - name: Observe raw mount and native S4F check read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/cb16_r11_g0_s4f_preflight.json" <<'PY'
          import json, os, stat, subprocess, sys
          from pathlib import Path
          from cb16_local_opt.stage4_state_roots_r11 import (
              Stage4RootSetR11,
              Stage4StateRootsR11,
              Stage4FrozenRootWritableError,
          )

          raw = Path(os.environ['CB16_RAW_ROOT'])
          g0 = Path(os.environ['CB16_G0_ROOT'])
          control = g0 / 's4f_preflight_control__DO_NOT_INITIALIZE'
          data = g0 / 's4f_preflight_data__DO_NOT_INITIALIZE'
          seal = '94bc3288a7e6097c4301c93d836607edee207ac3b2c7cf3e7833c85ea0f9546a'

          st = raw.lstat()
          mode = stat.S_IMODE(st.st_mode)
          mount = subprocess.check_output(
              ['findmnt','-T',str(raw),'-n','-o','TARGET,SOURCE,FSTYPE,OPTIONS'],
              text=True,
          ).strip()
          mount_opts = mount.split(None, 3)[3].split(',') if len(mount.split(None, 3)) == 4 else []
          os_read_only = 'ro' in mount_opts
          mode_has_write_bits = bool(mode & (stat.S_IWUSR | stat.S_IWGRP | stat.S_IWOTH))

          roots = Stage4StateRootsR11(Stage4RootSetR11.from_paths(
              control_root=control,
              data_root=data,
              frozen_raw_root=raw,
              frozen_raw_identity=seal,
          ))
          s4f_status = 'PASS_NATIVE_PREMUTATION_CHECK'
          s4f_error = None
          try:
              roots._validate_root_boundaries_before_mutation()
          except Stage4FrozenRootWritableError as exc:
              s4f_status = 'FAIL_NATIVE_MODE_BITS_DESPITE_OS_RO'
              s4f_error = str(exc)

          result = {
              'schema':'CB16_R11_G0_S4F_DOCKER_PREFLIGHT_V1',
              'status': (
                  'S4F_NATIVE_READY' if s4f_status == 'PASS_NATIVE_PREMUTATION_CHECK'
                  else 'S4F_AUTHORITY_VIEW_MISMATCH'
              ),
              'raw_root': str(raw),
              'raw_root_uid': st.st_uid,
              'raw_root_gid': st.st_gid,
              'raw_root_mode_octal': oct(mode),
              'raw_root_mode_has_write_bits': mode_has_write_bits,
              'mount_record': mount,
              'mount_is_os_read_only': os_read_only,
              'native_s4f_status': s4f_status,
              'native_s4f_error': s4f_error,
              'control_root_created': control.exists(),
              'data_root_created': data.exists(),
              'writes_attempted_to_raw': 0,
              'raw_files_modified': 0,
              'training_started': False,
              'final_holdout_payload_opened': False,
              'new_evidence_created': False,
              'new_scientific_verdict': False,
          }
          Path(sys.argv[1]).write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          assert os_read_only, result
          assert not control.exists() and not data.exists(), result
          PY

      - name: Upload compact S4F preflight
        uses: actions/upload-artifact@v5
        with:
          name: cb16-r11-science-g0-s4f-preflight
          path: ${{ runner.temp }}/cb16_r11_g0_s4f_preflight.json
          if-no-files-found: error
          retention-days: 30
