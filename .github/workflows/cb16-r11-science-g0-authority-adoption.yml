name: CB16 R11 Science G0 Genesis Authority

on:
  push:
    branches:
      - ai/r11-science-g0-historical-r0
    paths:
      - scripts/r11_science_g0_initialize_authority.py
      - .github/workflows/cb16-r11-science-g0-authority-adoption.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  genesis-adoption:
    name: Materialize and adopt R11 G0 genesis
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify R11 freeze and qualified adoption implementation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fc11c18ebd6dd0c883216766ed59cacb05e9a0c0 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/stage4_authority_adoption_r11.py)" = "d67d567d2a9a5bc18cbb04a78bb3307c00847b08"
          git cat-file -e f056ae6a0722e3e92d71793024a6e6d3fe9af003^{commit}
          test "$(git rev-parse f056ae6a0722e3e92d71793024a6e6d3fe9af003:ACTIVE_AUTHORITY_R10_2.json)" = "22aaa0b5bd816e5271a281ae0ad55fe1624497c7"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/resolve_verified_r104_python.py --out /tmp/cb16_r11_g0_python.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_r11_g0_python.json'))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          PY

      - name: Recheck qualified S4C adoption tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_r11_g0_python.json'))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m pytest -q tests/test_stage4_authority_adoption_r11.py

      - name: Materialize R11 G0 genesis and one-time adoption
        env:
          CB16_R11_G0_ROOT: /cb16_r11_runtime/G0
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_r11_g0_python.json'))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          PYTHONPATH="$GITHUB_WORKSPACE" "$PYTHON" scripts/r11_science_g0_initialize_authority.py

      - name: Verify persisted adoption against accepted-source contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cb16_r11_g0_python.json'))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" scripts/verify_r11_stage4_authority_adoption.py \
            --receipt /cb16_r11_runtime/G0/authority/CB16_R11_G0_AUTHORITY_ADOPTION_RECEIPT.json \
            --contract /cb16_r11_runtime/G0/authority/CB16_R11_G0_AUTHORITY_ADOPTION_CONTRACT.json

      - name: Verify no scientific work occurred
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=Path('/cb16_r11_runtime/G0/authority')
          g=json.load(open(a/'CB16_R11_G0_GENESIS_SOURCE_RECORD.json'))
          r=json.load(open(a/'CB16_R11_G0_AUTHORITY_ADOPTION_RECEIPT.json'))
          assert g['status'] == 'ACCEPTED_R11_G0_SOURCE_STATE'
          assert g['r11']['generation'] == 0
          assert g['r11']['semantic_freeze_git_blob'] == '3c401a0a350984381912f7860181e3e96eb8d7cf'
          assert g['legacy_predecessor']['last_committed_generation'] == 66
          assert g['legacy_predecessor']['champion_semantic_sha256'] == 'd0e8c01cc58a1e70936f94f58eeca794eae2e4f89036ec26ccb49ae5d5219886'
          assert g['historical_data']['derived_cache_lineage_sha256'] == '69e3bb82ba717104422dd45608d6a05725ccc53a08bded621c8f52095ccbb1d6'
          assert g['semantic_guards']['new_evidence_created'] is False
          assert g['semantic_guards']['new_scientific_verdict'] is False
          assert g['semantic_guards']['training_started'] is False
          assert g['semantic_guards']['final_holdout_payload_opened'] is False
          assert r['source']['source_generation'] == 0
          assert r['target']['adoption_generation'] == 0
          assert r['semantic_guards']['new_evidence_created'] is False
          assert r['semantic_guards']['new_scientific_verdict'] is False
          assert r['semantic_guards']['generation_advanced_by_adoption'] is False
          print(json.dumps({
            'status':'R11_G0_GENESIS_AUTHORITY_READY',
            'r11_source_sha':g['r11']['source_sha'],
            'genesis_identity_sha256':g['genesis_identity_sha256'],
            'adoption_canonical_content_hash':r['canonical_content_hash'],
            'generation':r['target']['adoption_generation'],
            'champion_semantic_sha256':g['r11']['champion_semantic_sha256'],
            'derived_cache_lineage_sha256':g['historical_data']['derived_cache_lineage_sha256'],
            'new_evidence_created':False,
            'new_scientific_verdict':False,
            'training_started':False,
            'final_holdout_payload_opened':False,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload compact G0 authority receipts
        uses: actions/upload-artifact@v5
        with:
          name: cb16-r11-science-g0-genesis-authority
          path: |
            /cb16_r11_runtime/G0/authority/CB16_R11_G0_GENESIS_SOURCE_RECORD.json
            /cb16_r11_runtime/G0/authority/CB16_R11_G0_AUTHORITY_ADOPTION_CONTRACT.json
            /cb16_r11_runtime/G0/authority/CB16_R11_G0_AUTHORITY_ADOPTION_RECEIPT.json
            /cb16_r11_runtime/G0/authority/CB16_R11_G0_DERIVED_CACHE_LINEAGE.json
            /cb16_r11_runtime/G0/authority/CB16_R11_G0_DATASET_SEAL.json
          if-no-files-found: error
          retention-days: 30
