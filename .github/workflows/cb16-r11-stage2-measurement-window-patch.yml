name: CB16 R11 Stage-2 Measurement Window Patch

on:
  push:
    branches:
      - ai/r11-stage2-integration-r1
    paths:
      - .github/workflows/cb16-r11-stage2-measurement-window-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v6
        with:
          ref: ai/r11-stage2-integration-r1
          fetch-depth: 1

      - name: Separate correctness prelude from measured burst
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, name: str) -> None:
              p=Path(path)
              s=p.read_text()
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_MATCH_COUNT_FAIL:{path}:{name}:{count}')
              p.write_text(s.replace(old,new,1))

          driver='scripts/run_r11_stage2_integration_burst.py'
          replace_once(
              driver,
              '''    telemetry_path = Path(os.environ["CB16_R11_BURST_TELEMETRY_JSONL"]).resolve()\n    correctness_path = Path(os.environ["CB16_R11_BURST_CORRECTNESS_JSON"]).resolve()\n    work_root = Path(os.environ["CB16_R11_BURST_WORK_ROOT"]).resolve()\n''',
              '''    telemetry_path = Path(os.environ["CB16_R11_BURST_TELEMETRY_JSONL"]).resolve()\n    correctness_path = Path(os.environ["CB16_R11_BURST_CORRECTNESS_JSON"]).resolve()\n    ready_marker_path = Path(\n        os.environ.get(\n            "CB16_R11_BURST_READY_MARKER",\n            str(Path(os.environ["CB16_R11_BURST_WORK_ROOT"]) / "measurement_ready.json"),\n        )\n    ).resolve()\n    work_root = Path(os.environ["CB16_R11_BURST_WORK_ROOT"]).resolve()\n''',
              'driver-ready-path',
          )
          replace_once(
              driver,
              '''    for path in (work_root, ssd_root, hdd_root):\n        path.mkdir(parents=True, exist_ok=True)\n\n    counters = Counters()\n''',
              '''    for path in (work_root, ssd_root, hdd_root):\n        path.mkdir(parents=True, exist_ok=True)\n    ready_marker_path.parent.mkdir(parents=True, exist_ok=True)\n    ready_marker_path.unlink(missing_ok=True)\n\n    counters = Counters()\n''',
              'driver-ready-clean',
          )
          replace_once(
              driver,
              '''    # Wait until the supervisor's warmup interval has elapsed.  The warmup itself performed\n    # real correctness work and cache construction, so the measured interval starts hot.\n    warmup_deadline = started + warmup_seconds\n    if time.monotonic() < warmup_deadline:\n        time.sleep(warmup_deadline - time.monotonic())\n    measured_deadline = started + warmup_seconds + measured_seconds\n    storage_thread.start()\n''',
              '''    # The correctness/identity prelude is intentionally outside the performance window.\n    # The explicit monotonic marker is the only authority for measured CPU/GPU/IO sampling.\n    warmup_deadline = started + warmup_seconds\n    if time.monotonic() < warmup_deadline:\n        time.sleep(warmup_deadline - time.monotonic())\n    measurement_started = time.monotonic()\n    atomic_json(\n        ready_marker_path,\n        {\n            "schema": "CB16_R11_STAGE2_BURST_MEASUREMENT_READY_V1",\n            "monotonic_seconds": measurement_started,\n            "measured_seconds": measured_seconds,\n            "teacher_workers": teacher_workers,\n            "trace_workers": trace_workers,\n            "scientific_identity": False,\n        },\n    )\n    print(\n        f"CB16_R11_STAGE2_MEASUREMENT_READY=PASS start={measurement_started:.9f} measured_seconds={measured_seconds}",\n        flush=True,\n    )\n    measured_deadline = measurement_started + measured_seconds\n    storage_thread.start()\n''',
              'driver-ready-barrier',
          )
          replace_once(
              driver,
              '''    while time.monotonic() < measured_deadline - 5.0:\n''',
              '''    while time.monotonic() < measured_deadline:\n''',
              'driver-full-measured-window',
          )

          supervisor='scripts/run_r11_stage2_burst_qualification.py'
          replace_once(
              supervisor,
              '''    telemetry_path = work / "runtime_telemetry.jsonl"\n    correctness_path = work / "runtime_correctness.json"\n    stdout_path = work / "workload.stdout.log"\n''',
              '''    telemetry_path = work / "runtime_telemetry.jsonl"\n    correctness_path = work / "runtime_correctness.json"\n    measurement_ready_path = work / "measurement_ready.json"\n    measurement_ready_path.unlink(missing_ok=True)\n    stdout_path = work / "workload.stdout.log"\n''',
              'supervisor-ready-path',
          )
          replace_once(
              supervisor,
              '''            "CB16_R11_BURST_CORRECTNESS_JSON": str(correctness_path),\n            "CB16_R11_BURST_WORK_ROOT": str(work / "runtime"),\n''',
              '''            "CB16_R11_BURST_CORRECTNESS_JSON": str(correctness_path),\n            "CB16_R11_BURST_READY_MARKER": str(measurement_ready_path),\n            "CB16_R11_BURST_WORK_ROOT": str(work / "runtime"),\n''',
              'supervisor-ready-env',
          )
          replace_once(
              supervisor,
              '''    samples: list[HostSample] = []\n    workload_rc: int | None = None\n    start = time.monotonic()\n    measured_start = start + warmup\n    measured_end = measured_start + measured_target\n    drain_deadline = measured_end + 30.0\n    with stdout_path.open("w") as stdout, stderr_path.open("w") as stderr:\n        proc = subprocess.Popen(argv, cwd=ROOT, env=env, stdout=stdout, stderr=stderr, start_new_session=True)\n        try:\n            while True:\n                now = time.monotonic()\n                if proc.poll() is not None:\n                    workload_rc = int(proc.returncode)\n                    break\n                if measured_start <= now <= measured_end:\n                    samples.append(sample_host(proc.pid, ssd_dev, hdd_dev))\n                if now >= drain_deadline:\n                    os.killpg(proc.pid, signal.SIGTERM)\n                    workload_rc = proc.wait(timeout=10)\n                    break\n                time.sleep(max(0.1, float(args.sample_interval)))\n        finally:\n            if proc.poll() is None:\n                try:\n                    os.killpg(proc.pid, signal.SIGINT)\n                    proc.wait(timeout=20)\n                except Exception:\n                    try:\n                        os.killpg(proc.pid, signal.SIGTERM)\n                        proc.wait(timeout=10)\n                    except Exception:\n                        os.killpg(proc.pid, signal.SIGKILL)\n                workload_rc = proc.returncode\n            elif workload_rc is None:\n                workload_rc = int(proc.returncode)\n\n    actual_end = min(time.monotonic(), measured_end)\n    measured_seconds = max(0.0, actual_end - measured_start)\n    if samples and samples[-1].t < measured_end - 1.5 and workload_rc == 0:\n        measured_seconds = max(0.0, samples[-1].t - samples[0].t)\n''',
              '''    samples: list[HostSample] = []\n    workload_rc: int | None = None\n    start = time.monotonic()\n    measured_start: float | None = None\n    measured_end: float | None = None\n    drain_deadline: float | None = None\n    with stdout_path.open("w") as stdout, stderr_path.open("w") as stderr:\n        proc = subprocess.Popen(argv, cwd=ROOT, env=env, stdout=stdout, stderr=stderr, start_new_session=True)\n        try:\n            while True:\n                now = time.monotonic()\n                if measured_start is None and measurement_ready_path.is_file():\n                    marker = _read_json(measurement_ready_path)\n                    if marker.get("schema") != "CB16_R11_STAGE2_BURST_MEASUREMENT_READY_V1":\n                        raise RuntimeError("R11_STAGE2_MEASUREMENT_READY_SCHEMA_MISMATCH")\n                    marker_start = float(marker["monotonic_seconds"])\n                    if marker_start < start - 1.0 or marker_start > now + 5.0:\n                        raise RuntimeError("R11_STAGE2_MEASUREMENT_READY_CLOCK_INVALID")\n                    measured_start = marker_start\n                    measured_end = measured_start + measured_target\n                    drain_deadline = measured_end + 30.0\n                if proc.poll() is not None:\n                    workload_rc = int(proc.returncode)\n                    break\n                if measured_start is not None and measured_end is not None and measured_start <= now <= measured_end:\n                    samples.append(sample_host(proc.pid, ssd_dev, hdd_dev))\n                if drain_deadline is not None and now >= drain_deadline:\n                    os.killpg(proc.pid, signal.SIGTERM)\n                    workload_rc = proc.wait(timeout=10)\n                    break\n                time.sleep(max(0.1, float(args.sample_interval)))\n        finally:\n            if proc.poll() is None:\n                try:\n                    os.killpg(proc.pid, signal.SIGINT)\n                    proc.wait(timeout=20)\n                except Exception:\n                    try:\n                        os.killpg(proc.pid, signal.SIGTERM)\n                        proc.wait(timeout=10)\n                    except Exception:\n                        os.killpg(proc.pid, signal.SIGKILL)\n                workload_rc = proc.returncode\n            elif workload_rc is None:\n                workload_rc = int(proc.returncode)\n\n    measurement_ready = measured_start is not None and measured_end is not None\n    if measurement_ready:\n        assert measured_start is not None and measured_end is not None\n        actual_end = min(time.monotonic(), measured_end)\n        measured_seconds = max(0.0, actual_end - measured_start)\n        if samples and samples[-1].t < measured_end - 1.5 and workload_rc == 0:\n            measured_seconds = max(0.0, samples[-1].t - samples[0].t)\n    else:\n        measured_start = start\n        measured_end = start\n        measured_seconds = 0.0\n''',
              'supervisor-marker-window',
          )
          replace_once(
              supervisor,
              '''    failures: list[str] = []\n    try:\n        if workload_rc != 0:\n''',
              '''    failures: list[str] = []\n    try:\n        if not measurement_ready:\n            failures.append("measurement_ready_marker_missing")\n        if workload_rc != 0:\n''',
              'supervisor-ready-failure',
          )
          PY

      - name: Validate runtime patch scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run_r11_stage2_integration_burst.py scripts/run_r11_stage2_burst_qualification.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'scripts/run_r11_stage2_burst_qualification.py' 'scripts/run_r11_stage2_integration_burst.py' | sort)"
          test "$changed" = "$expected" || { echo "UNEXPECTED_PATCH_FILES=$changed" >&2; exit 77; }
          grep -F 'CB16_R11_STAGE2_BURST_MEASUREMENT_READY_V1' scripts/run_r11_stage2_integration_burst.py >/dev/null
          grep -F 'CB16_R11_BURST_READY_MARKER' scripts/run_r11_stage2_burst_qualification.py >/dev/null
          git diff --check

      - name: Commit runtime measured-window separation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_r11_stage2_integration_burst.py scripts/run_r11_stage2_burst_qualification.py
          git commit -m 'perf(r11): start Stage-2 metrics only after correctness prelude'
          git push origin HEAD:ai/r11-stage2-integration-r1
