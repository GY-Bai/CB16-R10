name: CB16 R11 Stage4 INTB Persistence Fencing

on:
  push:
    branches:
      - ai/r11-stage4-int-b-persistence-fencing-r0

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-intb-persistence-fencing
  cancel-in-progress: false

jobs:
  intb-short-qualification:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    steps:
      - name: Checkout exact INTB source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable Integration Seed ancestry
        shell: bash
        run: |
          set -euo pipefail
          SEED=86a4ac8a9080cd8382600cb998059e9585495a11
          git merge-base --is-ancestor "$SEED" HEAD
          test "$(git rev-parse "$SEED")" = "$SEED"

      - name: Resolve verified qualification Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/stage4_intb_python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/stage4_intb_python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: INTB correctness and hostile tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_gatework_r11.py \
            tests/test_stage4_authority_lease_r11.py \
            tests/test_stage4_state_roots_r11.py \
            tests/test_stage4_legacy_retirement_r11.py \
            tests/test_r11_task_f_integration.py \
            tests/test_stage4_fenced_persistence_r11.py

      - name: R11 static semantic authority guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Verify forbidden scientific files unchanged from seed
        shell: bash
        run: |
          set -euo pipefail
          SEED=86a4ac8a9080cd8382600cb998059e9585495a11
          test "$(git rev-parse "$SEED:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")" = \
               "$(git rev-parse "HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")"
          test "$(git diff --name-only "$SEED"...HEAD -- cb16_local_opt/evidence_store_r11.py cb16_local_opt/event_journal_r11.py cb16_local_opt/checkpoint_store_r11.py)" = ""
          EXISTING_CHANGED="$(git diff --name-only "$SEED"...HEAD -- cb16_local_opt | grep -v '^cb16_local_opt/stage4_fenced_persistence_r11.py$' || true)"
          test "$EXISTING_CHANGED" = "cb16_local_opt/integration_adapters_r11.py"
