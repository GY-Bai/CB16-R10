name: CB16 R11 Stage-3 E3 Crash Recovery

on:
  push:
    branches:
      - ai/r11-stage3-e3-crash-recovery-r0
    paths:
      - cb16_local_opt/stage3_e3_crash_recovery_r11.py
      - tests/test_stage3_e3_crash_recovery_r11.py
      - .github/workflows/cb16-r11-stage3-e3-crash-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage3-e3-crash-recovery
  cancel-in-progress: false

jobs:
  e3-crash-recovery:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      WANDB_MODE: offline

    steps:
      - name: Checkout exact E3 source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail-closed branch and frozen-authority guard
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage3-e3-crash-recovery-r0"
          BASE=92f1ca011aec27bbe9e89ac5ba9afe74817ee2de
          FREEZE=authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json
          EXPECTED_BLOB=3c401a0a350984381912f7860181e3e96eb8d7cf
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse "HEAD:$FREEZE")" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          import subprocess
          base="92f1ca011aec27bbe9e89ac5ba9afe74817ee2de"
          allowed={
              "cb16_local_opt/stage3_e3_crash_recovery_r11.py",
              "tests/test_stage3_e3_crash_recovery_r11.py",
              ".github/workflows/cb16-r11-stage3-e3-crash-recovery.yml",
          }
          out=subprocess.check_output(["git","diff","--name-only",f"{base}...HEAD"], text=True)
          changed={x for x in out.splitlines() if x}
          extra=sorted(changed-allowed)
          forbidden=sorted(
              x for x in changed
              if x.startswith("authority/") or "final_holdout" in x.lower() or "2025-09" in x
          )
          assert not extra, f"E3_UNSCOPED_REPOSITORY_CHANGE:{extra}"
          assert not forbidden, f"E3_FINAL_HOLDOUT_OR_FROZEN_PATH_CHANGED:{forbidden}"
          print("CB16_R11_STAGE3_E3_REPOSITORY_SCOPE=PASS")
          PY

      - name: Resolve verified canonical Pascal Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          "$PYBIN" - <<'PY'
          import os, torch
          assert os.cpu_count() == 16
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.version.cuda == '12.6'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0)) == (6, 1)
          assert 'GTX 1060' in torch.cuda.get_device_name(0)
          assert torch.get_default_dtype() == torch.float32
          print('CB16_R11_STAGE3_E3_CANONICAL_ENV=PASS')
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Compile and run short correctness gates
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile cb16_local_opt/stage3_e3_crash_recovery_r11.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage3_e3_crash_recovery_r11.py \
            tests/test_r11_task_f_integration.py \
            tests/test_r11_evidence_store.py \
            tests/test_r11_event_journal.py \
            tests/test_r11_checkpoint_store.py \
            tests/test_r11_async_orchestrator.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root . \
            | tee ci_evidence/semantic_freeze.log

      - name: Run deterministic 20-case E3 crash matrix
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.stage3_e3_crash_recovery_r11 \
            --repo-root "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/ci_evidence/CB16_R11_STAGE3_E3_CRASH_RECOVERY_REPORT_V1.json" \
            2>&1 | tee ci_evidence/stage3_e3_crash_recovery.log

      - name: Machine-readable acceptance gate
        if: always()
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          test -n "${PY:-}"
          test -f ci_evidence/CB16_R11_STAGE3_E3_CRASH_RECOVERY_REPORT_V1.json
          "$PY" - <<'PY'
          import json
          p='ci_evidence/CB16_R11_STAGE3_E3_CRASH_RECOVERY_REPORT_V1.json'
          x=json.load(open(p))
          assert x['schema']=='CB16_R11_STAGE3_E3_CRASH_RECOVERY_REPORT_V1'
          assert x['base_commit']=='92f1ca011aec27bbe9e89ac5ba9afe74817ee2de'
          assert x['branch']=='ai/r11-stage3-e3-crash-recovery-r0'
          assert x['repository_guard']['pass'] is True, x['repository_guard']
          ident=x['correctness_identity']
          assert ident['canonical_arithmetic']=='FP32'
          assert ident['amp'] is False
          assert ident['scientific_semantics_changed'] is False
          assert ident['new_scientific_verdict_created'] is False
          assert ident['fresh_market_data_downloaded'] is False
          runtime=x['runtime_result']
          assert runtime['cases_total']==20
          assert runtime['cases_passed']==20
          assert runtime['cases_failed']==0
          assert runtime['long_soak_run'] is False
          assert x['failures']==[]
          assert x['status']=='PASS'
          print('CB16_R11_STAGE3_E3_CRASH_RECOVERY=PASS')
          PY

      - name: Upload E3 receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage3-e3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          retention-days: 30
