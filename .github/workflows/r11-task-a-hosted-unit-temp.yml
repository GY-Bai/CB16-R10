name: R11 Task A Hosted Unit Temp

on:
  push:
    branches:
      - ai/r11-task-a-teacher-runtime-r0
    paths:
      - cb16_local_opt/teacher_scheduler_r11.py
      - cb16_local_opt/teacher_runtime_r11.py
      - tests/test_teacher_runtime_r11.py
      - .github/workflows/r11-task-a-hosted-unit-temp.yml

permissions:
  contents: read

jobs:
  task-a-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU unit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            'numpy>=2.2,<2.5' 'pandas>=2.2,<2.4' 'pyarrow>=15' \
            'safetensors>=0.5.3' 'huggingface-hub>=0.28' 'einops>=0.8' \
            'joblib>=1.4' 'scikit-learn>=1.5' 'lightgbm>=4.5' \
            'tqdm>=4.66' 'requests>=2.31' 'pytest>=8,<9'
      - name: Compile Task A sources
        run: |
          python -m py_compile \
            cb16_local_opt/teacher_scheduler_r11.py \
            cb16_local_opt/teacher_runtime_r11.py \
            scripts/run_r11_teacher_topology_benchmark.py \
            tests/test_teacher_runtime_r11.py
      - name: Run Task A synthetic differential tests
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        run: python -m unittest tests.test_teacher_runtime_r11
