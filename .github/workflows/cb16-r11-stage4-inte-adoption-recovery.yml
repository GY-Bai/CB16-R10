name: CB16 R11 Stage4 INTE Adoption Recovery

on:
  push:
    branches:
      - ai/r11-stage4-int-e-adoption-recovery-r0
    paths:
      - cb16_local_opt/stage4_recovery_integration_r11.py
      - tests/test_stage4_recovery_integration_r11.py
      - docs/CB16_R11_STAGE4_INTE_ADOPTION_RECOVERY_R0.md
      - .github/workflows/cb16-r11-stage4-inte-adoption-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-inte-adoption-recovery
  cancel-in-progress: false

jobs:
  inte-short-qualification:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 8
    steps:
      - name: Checkout exact INTE branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable seed ancestry and INTE-only paths
        shell: bash
        run: |
          set -euo pipefail
          SEED=86a4ac8a9080cd8382600cb998059e9585495a11
          git merge-base --is-ancestor "$SEED" HEAD
          test "$(git rev-parse "$SEED:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")" = \
               "$(git rev-parse "HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")"
          test "$(git rev-parse "HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")" = \
               "3c401a0a350984381912f7860181e3e96eb8d7cf"
          git diff --name-only "$SEED" HEAD | sort > /tmp/inte_changed.txt
          cat > /tmp/inte_allowed.txt <<'EOF'
          .github/workflows/cb16-r11-stage4-inte-adoption-recovery.yml
          cb16_local_opt/stage4_recovery_integration_r11.py
          docs/CB16_R11_STAGE4_INTE_ADOPTION_RECOVERY_R0.md
          tests/test_stage4_recovery_integration_r11.py
          EOF
          sort -o /tmp/inte_allowed.txt /tmp/inte_allowed.txt
          diff -u /tmp/inte_allowed.txt /tmp/inte_changed.txt
          if git log --merges --format='%H' "$SEED..HEAD" | grep -q .; then
            echo "INTE refuses merge commits after immutable seed" >&2
            exit 1
          fi

      - name: Resolve verified qualification Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/stage4_inte_python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/stage4_inte_python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: INTE and upstream authority correctness tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_gatework_r11.py \
            tests/test_stage4_canonical_runtime_r11.py \
            tests/test_stage4_authority_adoption_r11.py \
            tests/test_stage4_authority_lease_r11.py \
            tests/test_stage4_state_roots_r11.py \
            tests/test_stage4_recovery_integration_r11.py

      - name: R11 static semantic authority guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
