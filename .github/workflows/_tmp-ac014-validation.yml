name: AC-014 Temporary Validation

on:
  push:
    branches: [ai/r11-ac-014-target-physics-adapter-r0]

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_UV_CACHE_DIR: /cb16/uv-cache
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  ac014-validation:
    name: AC-014 Gate A Physics Adapter
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_ac014_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          print('PYTHON_ENV_READY')
          PY

      - name: Run Actor-Critic Gate A tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_ac014_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m pytest -q \
            tests/test_action_contract_r0.py \
            tests/test_execution_record_r0.py \
            tests/test_actor_critic_supervisor_r0.py \
            tests/test_target_exposure_r0.py \
            tests/test_actor_critic_physics_adapter_r0.py

      - name: Run legacy lane and H72 regression sentinels
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_ac014_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m pytest -q \
            tests/test_actor_critic_legacy_freeze_r0.py \
            tests/test_r11_trace_runtime.py

      - name: Prove frozen Physics sources remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cb16_local_opt/r102_physics.py)" = "a9b3696dfa04bf8e5f72bff96f6480397407232d"
          test "$(git hash-object cb16_local_opt/typed_central_brain_r10.py)" = "899065a9b9c015fd5a0e24fc919a79ff7d3a67ff"
          echo AC014_FROZEN_LEGACY_BLOBS_PASS

      - name: Prove forbidden holdout absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/2025-09
          test ! -e final_holdout
          echo AC014_VALIDATION_SCOPE_PASS
