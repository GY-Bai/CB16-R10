name: CB16 R11 M-Series H5.4 Medium48 Weight Shadow Transport Replication R0

on:
  push:
    branches:
      - ai/m-series-h5-4-medium48-weight-shadow-transport-replication-r0-work
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_4_MEDIUM48_WEIGHT_SHADOW_TRANSPORT_REPLICATION_R0_GATE_V1.json
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_3_FIXED_SUPPORT_WEIGHTING_INTERPOLATION_AUDIT_R0_ADJUDICATION_V1.json
      - cb16_local_opt/medium48_weight_shadow_transport_replication_h54.py
      - tests/test_medium48_weight_shadow_transport_replication_h54.py
      - scripts/r11_m_series_h5_4_medium48_weight_shadow_transport_replication_r0.py
      - .github/workflows/cb16-r11-m-series-h5-4-medium48-weight-shadow-transport-replication-r0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  h5-4-shadow-transport:
    name: H5.4 Student-free Medium48-weight shadow transport replication
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable H5.4 preregistration and parent authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6f61aa82363e0eb891976170738d8cfe72dc7cbb HEAD
          git merge-base --is-ancestor 6ad9a525ea915f355018980c082e17bea75daa2b HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_4_MEDIUM48_WEIGHT_SHADOW_TRANSPORT_REPLICATION_R0_GATE_V1.json)" = "ad4ef534b6f4968de3b751c89534491a27653e2c"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_3_FIXED_SUPPORT_WEIGHTING_INTERPOLATION_AUDIT_R0_ADJUDICATION_V1.json)" = "cf6f89dfe43375f16a93600edd2b2e8aecb2b544"
          test "$(git rev-parse HEAD:cb16_local_opt/medium48_weight_shadow_transport_replication_h54.py)" = "847e6f0e5afb8b85837ce5c51b1165250747bd86"
          test "$(git rev-parse HEAD:tests/test_medium48_weight_shadow_transport_replication_h54.py)" = "0f2f03ba0c8434402049b5d3e47685470e46fc57"
          test "$(git rev-parse HEAD:scripts/r11_m_series_h5_4_medium48_weight_shadow_transport_replication_r0.py)" = "7d965235bb021d656b9b5fa6892185c6a0ef8dd9"
          test "$(git rev-parse HEAD:cb16_local_opt/fixed_support_weighting_interpolation_audit_h53.py)" = "338a5b29f90685467bc7afd139a0963fe4e51cb1"
          test "$(git rev-parse HEAD:cb16_local_opt/medium48_support_selection_causal_audit_h52.py)" = "eadcfc071a58f5b3825d224a067bac15242d2a58"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_failure_localization_h51_batch_geometry.py)" = "9b91ca1d2b8cae05cdf28a7e04ccbdf1698fadf7"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_failure_localization_h51.py)" = "8dba35e5c54c8bc9d8eeb97ea6d3aec373a09ccc"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_temporal_transport_audit_h5.py)" = "09b05de23c659fe6f47a43117ec70b5cafcf7d21"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_balanced_runtime_r11.py)" = "e834facdbf2d08de25e3cab917f0faf587f3386e"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_vectorized_r11.py)" = "083ca6541b45577cfeb6d9a376b25e0eaf8d060a"
          test "$(git rev-parse HEAD:cb16_local_opt/r11_teacher_authority_candidate.py)" = "6e77e8f989a6d4358a7feac99c269db7b7d6549e"
          test "$(git rev-parse HEAD:cb16_local_opt/probabilistic_teacher_r6.py)" = "3de3092d244c3fd315950c9f8b0bf4d78c50ee2b"
          test "$(git rev-parse HEAD:cb16_local_opt/r102_evidence_cache.py)" = "91fb73565ec60f66bf4232957f9b9b2f88cc3cfe"
          test "$(git rev-parse HEAD:cb16_local_opt/reduced_teacher_target_information_audit_r6.py)" = "bd7a8780e8dcab05cfae92744fde523ce62cc9ae"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_h54_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_h54_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run H5.4 unit and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h54_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/medium48_weight_shadow_transport_replication_h54.py \
            tests/test_medium48_weight_shadow_transport_replication_h54.py \
            scripts/r11_m_series_h5_4_medium48_weight_shadow_transport_replication_r0.py
          "$PYTHON" -m pytest -q \
            tests/test_medium48_weight_shadow_transport_replication_h54.py \
            tests/test_fixed_support_weighting_interpolation_audit_h53.py \
            tests/test_medium48_support_selection_causal_audit_h52.py \
            tests/test_teacher_failure_localization_h51.py \
            tests/test_teacher_temporal_transport_audit_h5.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_independent_purge_alignment_replication_r5.py \
            tests/test_r11_teacher_balanced_binding.py

      - name: Execute preregistered H5.4 shadow transport replication
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h54_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-h54-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_h54_run_root.txt"
          "$PYTHON" -m scripts.r11_m_series_h5_4_medium48_weight_shadow_transport_replication_r0 \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_H5_4_MEDIUM48_WEIGHT_SHADOW_TRANSPORT_REPLICATION_R0_RESULT.json"

      - name: Verify H5.4 receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_h54_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_H5_4_MEDIUM48_WEIGHT_SHADOW_TRANSPORT_REPLICATION_R0_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_H5_4_MEDIUM48_WEIGHT_SHADOW_TRANSPORT_REPLICATION_R0_RESULT_V1',x
          assert x['status']=='H5_4_MEDIUM48_WEIGHT_SHADOW_TRANSPORT_REPLICATION_COMPLETE',x
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          r=x['runtime_identity']
          assert r['student_training'] is False and r['student_inference'] is False,r
          assert r['production_teacher_changed'] is False and r['shadow_teacher_only'] is True,r
          assert r['support_selection_dimensions']=='FULL102',r
          assert r['post_selection_weight_dimensions']=='OPERATOR48_PLUS_ACCOUNT6',r
          assert r['distance_temperature_tuned'] is False and r['support_rule_tuned'] is False,r
          p=x['protocol']
          assert p['support_classification']=='CONSUMED_TRAIN_ONLY_MECHANISTIC_SUPPORT__NOT_INDEPENDENT_MARKET_SUPPORT',p
          assert p['adaptive_method_selection_acknowledged'] is True and p['independent_qualification'] is False,p
          assert p['outer_folds']==5 and p['clock_blocks']==6 and p['train_to_eval_gap_hours_each_fold']==256,p
          assert p['shifts']==[1,7,13,23,31],p
          assert p['support_selection']=='FULL102_CANONICAL_TOP64_AND_NEAREST_PARENT',p
          assert p['shadow_post_selection_weighting']=='DROP_MEDIUM48_OPERATOR48_PLUS_ACCOUNT6_ONLY',p
          assert p['teacher_config_tuning'] is False and p['teacher_semantics_changed'] is False,p
          assert p['fresh_market_data_downloaded'] is False and p['final_holdout_opened'] is False and p['r7_candidate_evaluated'] is False,p
          assert len(x['folds'])==5,x
          for f in x['folds']:
              assert f['fold'] in [1,2,3,4,5],f
              assert f['h53_shadow_aligned_qscore_identity_guard']=='PASS',f
              assert f['h5_frozen_canonical_qscore_identity_guard']=='PASS',f
              assert f['aligned_fixed_support_weighting_guard']=='PASS',f
              assert set(int(k) for k in f['shadow_shuffles'].keys())=={1,7,13,23,31},f
              for v in [f['shadow_aligned']['qscore'],f['frozen_canonical_aligned']['qscore'],f['climatology']['qscore'],f['median_shadow_shuffle_qscore']]:
                  assert math.isfinite(float(v)),(f['fold'],v)
              for rr in f['shuffle_receipts'].values():
                  rot=rr['rotation']
                  assert rot['target_feature_multiset_preserved'] is True and rot['train_features_byte_identical'] is True and rot['scenario_identity_preserved'] is True,rot
                  fw=rr['fixed_support_weighting']
                  assert fw['all_shadow_arms_selected_parent_rows_identical'] is True and fw['full102_reference_law_identity_guard']=='PASS',fw
          s=x['h5_4_summary']
          assert s['conclusion'] in {
              'H5_4_SINGLE_MEDIUM48_WEIGHTING_INTERVENTION_RESTORES_H5_STYLE_STATE_ALIGNMENT_TRANSPORT_ON_CONSUMED_TRAIN_ONLY_SUPPORT',
              'H5_4_MEDIUM48_WEIGHTING_GAIN_DOES_NOT_RESTORE_H5_STYLE_STATE_ALIGNMENT_TRANSPORT__DO_NOT_CHANGE_CANONICAL_TEACHER',
          },s
          assert 0<=int(s['shadow_lt_frozen_fold_count'])<=5,s
          assert 0<=int(s['shadow_lt_climatology_fold_count'])<=5,s
          assert 0<=int(s['shadow_lt_median_shuffle_fold_count'])<=5,s
          assert 0<=int(s['shadow_lt_each_shuffle_pair_count_of_25'])<=25,s
          assert s['market_information_verdict'] is False and s['canonical_change_authorized'] is False,s
          assert s['teacher_change_authorized'] is False and s['student_change_authorized'] is False,s
          g=x['semantic_guards']
          assert g['student_trained'] is False and g['student_inference_used'] is False,g
          assert g['production_teacher_changed'] is False and g['teacher_hyperparameter_tuned'] is False,g
          assert g['support_selection_rule_changed'] is False and g['new_direction_loss_created'] is False,g
          assert g['canonical_generation_advanced'] is False and g['champion_promoted'] is False and g['production_cutover'] is False,g
          assert g['market_information_verdict_reopened'] is False and g['final_holdout_payload_opened'] is False and g['r7_candidate_evaluated'] is False,g
          print(json.dumps({
              'status':x['status'],'overall_pass':s['overall_pass'],'conclusion':s['conclusion'],
              'shadow_lt_frozen_fold_count':s['shadow_lt_frozen_fold_count'],
              'shadow_lt_frozen_both_late_folds':s['shadow_lt_frozen_both_late_folds'],
              'shadow_lt_climatology_fold_count':s['shadow_lt_climatology_fold_count'],
              'shadow_lt_median_shuffle_fold_count':s['shadow_lt_median_shuffle_fold_count'],
              'shadow_lt_each_shuffle_pair_count_of_25':s['shadow_lt_each_shuffle_pair_count_of_25'],
              'late_transport':s['folds_4_and_5_both_pass_climatology_and_shuffle'],
              'all_identity_guards_pass':s['all_identity_guards_pass'],
              'per_fold':s['per_fold'],'next_legal_step':x['next_legal_step']
          },indent=2,sort_keys=True))
          PY

      - name: Upload H5.4 replication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-h5-4-medium48-weight-shadow-transport-replication-r0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_h54_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_h54_python.json
            ${{ runner.temp }}/cb16-r11-m-series-h54-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
