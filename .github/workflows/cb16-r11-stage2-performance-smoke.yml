name: CB16 R11 Stage-2 Performance Smoke

on:
  push:
    branches:
      - ai/r11-stage2-integration-r1
    paths:
      - scripts/run_r11_stage2_integration_burst.py

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage2-performance-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    env:
      PACKAGE_ROOT: /data/cb16_ci/r2-authority/package_r102
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
      R11_DIAG_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      WANDB_MODE: offline

    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify exact smoke boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage2-integration-r1"
          test -d "$PACKAGE_ROOT"
          test -d "$LEGACY_R104_ROOT/evidence_cache"
          pkg_opts="$(findmnt -n -o OPTIONS -T "$PACKAGE_ROOT")"
          r104_opts="$(findmnt -n -o OPTIONS -T "$LEGACY_R104_ROOT")"
          case ",$pkg_opts," in *,ro,*) ;; *) echo "PACKAGE_AUTHORITY_NOT_RO=$pkg_opts" >&2; exit 74 ;; esac
          case ",$r104_opts," in *,ro,*) ;; *) echo "R104_AUTHORITY_NOT_RO=$r104_opts" >&2; exit 74 ;; esac
          active="$(ps -eo pid=,comm=,args= | awk '$2 ~ /^python/ && $0 ~ /run_r104_long_research\.py/ {print}' || true)"
          test -z "$active" || { echo 'ACTIVE_LEGACY_R104_PROCESS_REFUSED' >&2; echo "$active" >&2; exit 75; }
          echo 'CB16_R11_STAGE2_SMOKE_BOUNDARY=PASS'

      - name: Resolve verified canonical Pascal Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          "$PYBIN" - <<'PY'
          import os, torch
          assert os.cpu_count() == 16
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.version.cuda == '12.6'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0)) == (6, 1)
          assert 'GTX 1060' in torch.cuda.get_device_name(0)
          assert torch.get_default_dtype() == torch.float32
          print('GPU=' + torch.cuda.get_device_name(0))
          print('CB16_R11_STAGE2_SMOKE_FP32=PASS')
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Static driver gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile scripts/run_r11_stage2_integration_burst.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root . \
            | tee ci_evidence/semantic_freeze.log

      - name: Prepare disposable smoke roots
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          SSD_ROOT="/var/tmp/cb16-r11-stage2-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          HDD_ROOT="$R11_DIAG_ROOT/r11-stage2-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SSD_ROOT" "$HDD_ROOT"
          mkdir -p "$SSD_ROOT" "$HDD_ROOT" ci_evidence/smoke-control
          echo "ssd=$SSD_ROOT" >> "$GITHUB_OUTPUT"
          echo "hdd=$HDD_ROOT" >> "$GITHUB_OUTPUT"

      - name: Run short real integrated smoke
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          HDD_ROOT: ${{ steps.roots.outputs.hdd }}
        run: |
          set -euo pipefail
          GPU_LOG="$GITHUB_WORKSPACE/ci_evidence/gpu_samples.txt"
          : > "$GPU_LOG"
          (
            while true; do
              nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null | head -1 >> "$GPU_LOG" || true
              sleep 1
            done
          ) &
          GPUPID=$!
          cleanup_sampler() { kill "$GPUPID" 2>/dev/null || true; wait "$GPUPID" 2>/dev/null || true; }
          trap cleanup_sampler EXIT

          export CB16_R11_BURST_SHORT_SMOKE=1
          export CB16_R11_BURST_WARMUP_SECONDS=10
          export CB16_R11_BURST_MEASURED_SECONDS=90
          export CB16_R11_BURST_TEACHER_WORKERS=8
          export CB16_R11_BURST_TRACE_WORKERS=8
          export CB16_R11_BURST_QUEUE_DEPTH=8
          export CB16_R11_BURST_BUFFER_MIB=64
          export CB16_R11_CANONICAL_DTYPE=FP32
          export CB16_R11_AMP=0
          export CB16_R11_BURST_TELEMETRY_JSONL="$GITHUB_WORKSPACE/ci_evidence/smoke_telemetry.jsonl"
          export CB16_R11_BURST_CORRECTNESS_JSON="$GITHUB_WORKSPACE/ci_evidence/smoke_correctness.json"
          export CB16_R11_BURST_WORK_ROOT="$GITHUB_WORKSPACE/ci_evidence/smoke-control"
          export CB16_R11_BURST_SSD_ROOT="$SSD_ROOT"
          export CB16_R11_BURST_HDD_ROOT="$HDD_ROOT"
          export CB16_R11_BURST_PACKAGE_ROOT="$PACKAGE_ROOT"
          export CB16_R11_BURST_LEGACY_R104_ROOT="$LEGACY_R104_ROOT"

          timeout 240s env PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/run_r11_stage2_integration_burst.py \
            2>&1 | tee ci_evidence/performance_smoke.log
          cleanup_sampler
          trap - EXIT

      - name: Short smoke acceptance gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import json, statistics
          from pathlib import Path

          c=json.load(open('ci_evidence/smoke_correctness.json'))
          required=(
              'semantic_freeze_pass','final_holdout_untouched','frozen_authority_unchanged',
              'teacher_identity_unchanged','h72_receipt_identity_unchanged',
              'training_differential_pass','no_forbidden_gradient','replay_zero_new_payload',
              'drain_or_crash_restart_receipt_valid','champion_challenger_lifecycle_correct',
          )
          bad=[k for k in required if c.get(k) is not True]
          assert not bad, bad
          assert c['scientific_semantics_changed'] is False
          assert c['training_dtype']=='FP32' and c['amp'] is False
          assert int(c['teacher_workers'])==8 and int(c['trace_workers'])==8
          assert int(c['cycles_committed']) >= 2, c['cycles_committed']

          rows=[json.loads(x) for x in Path('ci_evidence/smoke_telemetry.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows) >= 20, len(rows)
          first,last=rows[0],rows[-1]
          fsync_stall=float(last['fsync_stall_seconds'])-float(first['fsync_stall_seconds'])
          assert fsync_stall <= 4.5, fsync_stall

          gpu=[]
          for raw in Path('ci_evidence/gpu_samples.txt').read_text().splitlines():
              try: gpu.append(float(raw.strip()))
              except ValueError: pass
          assert len(gpu) >= 20, len(gpu)
          avg=statistics.fmean(gpu)
          idle=sum(v <= 1.0 for v in gpu)/len(gpu)
          # Smoke floors are deliberately lower than qualification floors; this gate only
          # rejects obvious starvation/regression before spending 420 measured seconds.
          assert avg >= 15.0, avg
          assert idle <= 0.70, idle
          summary={
              'status':'PASS',
              'cycles_committed':int(c['cycles_committed']),
              'gpu_avg_pct':avg,
              'gpu_idle_ratio':idle,
              'durability_barrier_stall_seconds':fsync_stall,
              'scientific_semantics_changed':False,
          }
          Path('ci_evidence/CB16_R11_STAGE2_PERFORMANCE_SMOKE_V1.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('CB16_R11_STAGE2_PERFORMANCE_SMOKE=' + json.dumps(summary,sort_keys=True))
          PY

      - name: Upload short smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage2-performance-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          retention-days: 30

      - name: Cleanup disposable smoke roots
        if: always()
        shell: bash
        env:
          SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          HDD_ROOT: ${{ steps.roots.outputs.hdd }}
        run: |
          set +e
          if [ -n "${SSD_ROOT:-}" ]; then rm -rf "$SSD_ROOT"; fi
          if [ -n "${HDD_ROOT:-}" ]; then rm -rf "$HDD_ROOT"; fi
          exit 0
