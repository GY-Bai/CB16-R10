name: CB16 R11 Stage4 S4A Authority Inventory

on:
  push:
    branches:
      - ai/r11-stage4-task-a-authority-inventory-r0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage4-s4a-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unit dependency
        run: python -m pip install -q pytest
      - name: Build deterministic writer registry
        run: python scripts/build_r11_stage4_authority_registry.py --repo-root .
      - name: Materialize registry on S4A branch when changed
        shell: bash
        run: |
          registry=authority/rearchitecture_r11/CB16_R11_STAGE4_AUTHORITY_WRITER_REGISTRY_V1.json
          if git diff --quiet -- "$registry"; then
            echo "Registry already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$registry"
          git commit -m "stage4 S4A: materialize authority writer registry"
          git push origin HEAD:ai/r11-stage4-task-a-authority-inventory-r0
      - name: Authority discovery and registry audit
        run: |
          set +e
          python scripts/audit_r11_stage4_authority_surface.py --repo-root . --print-discovered 2>&1 | tee stage4_s4a_discovery.txt
          code=${PIPESTATUS[0]}
          echo "$code" > stage4_s4a_discovery_exit_code.txt
          exit "$code"
      - name: Preserve S4A discovery output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-s4a-discovery
          path: |
            stage4_s4a_discovery.txt
            stage4_s4a_discovery_exit_code.txt
          if-no-files-found: error
      - name: Required S4A tests
        run: python -m pytest -q tests/test_stage4_gatework_r11.py tests/test_stage4_authority_inventory_r11.py
      - name: Frozen semantic static guard
        run: python -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
      - name: Receipt validation when receipt commit is present
        shell: bash
        run: |
          receipt=authority/rearchitecture_r11/stage4_receipts/S4A_RECEIPT_V1.json
          if [[ -f "$receipt" ]]; then
            python scripts/check_r11_stage4_task_receipt.py --receipt "$receipt" --repo-root .
          else
            echo "S4A receipt not present at implementation head; expected before receipt commit."
          fi
