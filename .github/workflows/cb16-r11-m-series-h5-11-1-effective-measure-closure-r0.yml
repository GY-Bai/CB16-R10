name: CB16 R11 M-Series H5.11.1 Effective-Measure Closure R0

on:
  push:
    branches:
      - ai/m-series-h5-11-1-effective-measure-closure-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_1_EFFECTIVE_MEASURE_CLOSURE_R0_GATE_V1.json
      - cb16_local_opt/h511_effective_measure_closure_h5111.py
      - tests/test_h511_effective_measure_closure_h5111.py
      - scripts/r11_m_series_h5_11_1_effective_measure_closure_r0.py
      - .github/workflows/cb16-r11-m-series-h5-11-1-effective-measure-closure-r0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  h5-11-1-effective-measure-closure:
    name: H5.11.1 Outcome-unused effective-measure closure audit
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify preregistration authority and frozen scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ffa3c1c1c9277e6ed50c66dc66aff0079a0cf8ee 0eaa3f705308f0a8247aaa60eb87e4c3f7be9f56
          git merge-base --is-ancestor 0eaa3f705308f0a8247aaa60eb87e4c3f7be9f56 HEAD
          test "$(git rev-parse 0eaa3f705308f0a8247aaa60eb87e4c3f7be9f56:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_1_EFFECTIVE_MEASURE_CLOSURE_R0_GATE_V1.json)" = "734bee34eeecdbcaf649d3b07a6db05470f11579"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_1_EFFECTIVE_MEASURE_CLOSURE_R0_GATE_V1.json)" = "734bee34eeecdbcaf649d3b07a6db05470f11579"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_COMMON_SUPPORT_RANK_GEOMETRY_MECHANISM_DECOMPOSITION_R0_ADJUDICATION_V1.json)" = "58f9c604cab90f61853bf6bb8594371485b21caf"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/common_support_rank_geometry_decomposition_h511.py)" = "918f98d499ff5ed2f36e7d6a6bf3268fca37c27c"
          test "$(git rev-parse HEAD:cb16_local_opt/h511_effective_measure_closure_h5111.py)" = "7063d52784880bb24555e7b177d5d86cb892fc15"
          test "$(git rev-parse HEAD:tests/test_h511_effective_measure_closure_h5111.py)" = "8ed1928e0dd329fc0817c186c88d959b0d5e18bc"
          test "$(git rev-parse HEAD:scripts/r11_m_series_h5_11_1_effective_measure_closure_r0.py)" = "11f8aca4415f6f5d6556d0d3cad6cc23b73998e0"
          test "$(git rev-parse HEAD:cb16_local_opt/medium48_temporal_halfblock_stability_h510.py)" = "176983eb0f7beb6396823126f4bc1504c4418054"
          test "$(git rev-parse HEAD:cb16_local_opt/operator_conditional_medium_geometry_h58.py)" = "aaddbad059c7262a8137db87bee25d38c07afd83"
          test "$(git rev-parse HEAD:cb16_local_opt/time_local_vs_forward_geometry_contrast_h56.py)" = "a264ff21d0447527c4dda06ee8fd63cf20207daf"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55.py)" = "1dd00ea9b40b8da4061c0983fc44fb2307c72587"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55_clarified.py)" = "faa5233170aa421c3bf44f023b1d8e2f7c187568"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_temporal_transport_audit_h5.py)" = "09b05de23c659fe6f47a43117ec70b5cafcf7d21"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_vectorized_r11.py)" = "083ca6541b45577cfeb6d9a376b25e0eaf8d060a"
          test "$(git rev-parse HEAD:cb16_local_opt/r102_evidence_cache.py)" = "91fb73565ec60f66bf4232957f9b9b2f88cc3cfe"
          test "$(git rev-parse HEAD:cb16_local_opt/reduced_teacher_target_information_audit_r6.py)" = "bd7a8780e8dcab05cfae92744fde523ce62cc9ae"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_h5111_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_h5111_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run H5.11.1 unit and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h5111_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/h511_effective_measure_closure_h5111.py \
            tests/test_h511_effective_measure_closure_h5111.py \
            scripts/r11_m_series_h5_11_1_effective_measure_closure_r0.py
          "$PYTHON" -m pytest -q \
            tests/test_h511_effective_measure_closure_h5111.py \
            tests/test_common_support_rank_geometry_decomposition_h511.py \
            tests/test_medium48_strict_clock_halfblock_replication_h5101.py \
            tests/test_medium48_temporal_halfblock_stability_h510.py \
            tests/test_medium48_antialignment_breadth_h59.py \
            tests/test_operator_conditional_medium_geometry_h58.py \
            tests/test_medium48_relational_composition_falsification_h57.py \
            tests/test_time_local_vs_forward_geometry_contrast_h56.py \
            tests/test_state_utility_geometry_transport_audit_h55.py \
            tests/test_state_utility_geometry_transport_audit_h55_clarified.py \
            tests/test_teacher_temporal_transport_audit_h5.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_independent_purge_alignment_replication_r5.py \
            tests/test_r11_teacher_balanced_binding.py

      - name: Execute preregistered H5.11.1 effective-measure closure audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h5111_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-h5111-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_h5111_run_root.txt"
          "$PYTHON" -m scripts.r11_m_series_h5_11_1_effective_measure_closure_r0 \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_H5_11_1_EFFECTIVE_MEASURE_CLOSURE_R0_RESULT.json"

      - name: Verify H5.11.1 receipt and authority guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_h5111_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_H5_11_1_EFFECTIVE_MEASURE_CLOSURE_R0_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_H5_11_1_EFFECTIVE_MEASURE_CLOSURE_R0_RESULT_V1',x
          assert x['status']=='H5_11_1_EFFECTIVE_MEASURE_CLOSURE_AUDIT_COMPLETE',x
          assert x['repo']['preregistration_commit']=='0eaa3f705308f0a8247aaa60eb87e4c3f7be9f56',x['repo']
          assert x['repo']['immutable_blobs']['gate']=='734bee34eeecdbcaf649d3b07a6db05470f11579',x['repo']
          assert x['repo']['immutable_blobs']['h511_adjudication']=='58f9c604cab90f61853bf6bb8594371485b21caf',x['repo']
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert x['protocol']['utility_values_used_by_audit_computation'] is False,x['protocol']
          assert x['protocol']['approximate_pass_threshold_defined'] is False,x['protocol']
          assert x['protocol']['same_future_group_is_dependence_unit'] is True,x['protocol']
          assert set(x['frozen_q_reproduction_max_abs_error_by_pair'])=={'1_2','2_3','3_4','4_5'},x
          assert max(map(float,x['frozen_q_reproduction_max_abs_error_by_pair'].values()))<=1e-12,x
          a=x['h5_11_1_audit']
          assert a['utility_values_referenced_by_audit'] is False,a
          assert len(a['pair_audits'])==4,a
          for p in a['pair_audits']:
              assert p['utility_values_referenced_by_audit'] is False,p
              assert p['nominal_a_max_abs_error_vs_q']<=1e-12 and p['nominal_b_max_abs_error_vs_q']<=1e-12,p
              for side in ('side_a','side_b'):
                  y=p[side]
                  assert abs(sum(map(float,y['effective_macro_candidate_mass']))-1.0)<=1e-12,y
                  assert math.isfinite(float(y['distance_vs_q']['max_abs'])),y
                  assert math.isfinite(float(y['distance_vs_q']['l1'])),y
                  assert math.isfinite(float(y['distance_vs_q']['total_variation'])),y
                  assert float(y['target_scenario_raw_multiplier_sum_min'])>0.0,y
              assert math.isfinite(float(p['effective_side_to_side_distance']['max_abs'])),p
          s=x['summary']
          assert s['classification'] in {
              'H5_11_EXACT_EFFECTIVE_COMMON_MEASURE_CLAIM_CONFIRMED',
              'H5_11_EXACT_EFFECTIVE_COMMON_MEASURE_CLAIM_FALSE__SHARED_CELL_MULTIPLIER_ROBUSTNESS_ONLY',
          },s
          assert s['h5_11_orientation_numbers_invalidated'] is False,s
          assert s['market_information_verdict_changed'] is False,s
          assert s['canonical_change_authorized'] is False,s
          assert s['h5_12_execution_authorized'] is False,s
          g=x['semantic_guards']
          assert g['utility_values_referenced_by_audit_computation'] is False,g
          assert g['h5_11_q_tuned_or_changed'] is False and g['h5_11_grid_changed'] is False,g
          assert g['h5_11_support_changed'] is False and g['h5_11_distance_metric_changed'] is False,g
          assert g['h5_12_executed'] is False,g
          assert g['teacher_changed'] is False and g['student_changed'] is False,g
          assert g['canonical_architecture_changed'] is False and g['learned_gate_created'] is False and g['time_or_regime_gate_created'] is False,g
          assert g['fresh_market_data_downloaded'] is False and g['final_holdout_payload_opened'] is False and g['r7_candidate_evaluated'] is False,g
          print(json.dumps({
              'status':x['status'],
              'classification':s['classification'],
              'exact_closure_all_pairs':s['exact_closure_all_pairs'],
              'global_max_abs_effective_side_vs_q':s['global_max_abs_effective_side_vs_q'],
              'global_max_abs_effective_side_to_side':s['global_max_abs_effective_side_to_side'],
              'global_max_total_variation_effective_side_vs_q':s['global_max_total_variation_effective_side_vs_q'],
              'global_max_total_variation_effective_side_to_side':s['global_max_total_variation_effective_side_to_side'],
              'next_legal_step':x['next_legal_step'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload H5.11.1 authority-audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-h5-11-1-effective-measure-closure-r0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_h5111_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_h5111_python.json
            ${{ runner.temp }}/cb16-r11-m-series-h5111-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
