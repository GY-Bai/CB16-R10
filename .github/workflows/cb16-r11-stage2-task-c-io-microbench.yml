name: CB16 R11 Stage2 Task C IO Microbench

on:
  push:
    branches:
      - ai/r11-stage2-task-c-io-throughput-r1

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage2-shanxi-microbench
  cancel-in-progress: false

jobs:
  task-c-io-microbench:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    steps:
      - name: Checkout exact Task C commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Identity and forbidden-input guard
        shell: bash
        run: |
          set -euo pipefail
          echo "TASK_C_SHA=$(git rev-parse HEAD)"
          echo "TASK_C_BRANCH=$(git rev-parse --abbrev-ref HEAD)"
          test "$(git rev-parse --abbrev-ref HEAD)" = "ai/r11-stage2-task-c-io-throughput-r1"
          python3 --version
          python3 - <<'PY'
          import numpy, torch
          print("numpy", numpy.__version__)
          print("torch", torch.__version__)
          PY
          echo "RAW_1M_READ=FORBIDDEN_AND_NOT_USED"
          echo "FINAL_HOLDOUT_READ=FORBIDDEN_AND_NOT_USED"

      - name: Task C correctness tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_r11_evidence_store.py \
            tests/test_r11_event_journal.py \
            tests/test_r11_checkpoint_store.py \
            tests/test_r11_storage_lifecycle.py \
            tests/test_r11_io_runtime.py

      - name: Synthetic SSD-HDD micro-benchmark
        shell: bash
        run: |
          set -euo pipefail
          HDD_BASE=/data/cb16_hdd
          test -d "$HDD_BASE"
          test -w "$HDD_BASE"
          if [ -d /data/cb16_ssd ] && [ -w /data/cb16_ssd ]; then
            META_BASE=/data/cb16_ssd
          else
            META_BASE="$RUNNER_TEMP"
          fi
          BENCH_TAG="task-c-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          META_ROOT="$META_BASE/$BENCH_TAG"
          PAYLOAD_ROOT="$HDD_BASE/.cb16_task_c_microbench/$BENCH_TAG"
          cleanup() {
            rm -rf "$META_ROOT" "$PAYLOAD_ROOT"
          }
          trap cleanup EXIT
          mkdir -p "$META_ROOT" "$PAYLOAD_ROOT"
          echo "TASK_C_META_ROOT=$META_ROOT"
          echo "TASK_C_PAYLOAD_ROOT=$PAYLOAD_ROOT"
          findmnt -T "$META_ROOT" || true
          findmnt -T "$PAYLOAD_ROOT" || true
          lsblk -o NAME,ROTA,TYPE,SIZE,MOUNTPOINTS || true
          timeout 220s python3 benchmarks/task_c_io_microbench_r11.py \
            --metadata-root "$META_ROOT" \
            --payload-root "$PAYLOAD_ROOT" \
            --count 2048 \
            --payload-bytes 32768 \
            --batch-size 128
