name: CB16 R11 Stage2 Task C IO Microbench

on:
  push:
    branches:
      - ai/r11-stage2-task-c-io-throughput-r1
    paths:
      - .github/workflows/cb16-r11-stage2-task-c-io-microbench.yml
      - benchmarks/task_c_io_microbench_r11.py
      - cb16_local_opt/io_runtime_r11.py
      - tests/test_r11_io_runtime.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-shanxi-wss-qualification-runner-queue
  cancel-in-progress: false

jobs:
  task-c-io-microbench:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    env:
      R11_DIAG_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native
    steps:
      - name: Checkout exact Task C commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Reuse verified canonical R10.4 Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          test -x "$PYBIN"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Identity and forbidden-input guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          echo "TASK_C_SHA=$(git rev-parse HEAD)"
          echo "TASK_C_BRANCH=$(git rev-parse --abbrev-ref HEAD)"
          test "$(git rev-parse --abbrev-ref HEAD)" = "ai/r11-stage2-task-c-io-throughput-r1"
          "$PY" --version
          "$PY" - <<'PY'
          import numpy, torch
          print("numpy", numpy.__version__)
          print("torch", torch.__version__)
          print("TASK_C_PYTHON_IDENTITY=PASS")
          PY
          echo "RAW_1M_READ=FORBIDDEN_AND_NOT_USED"
          echo "FINAL_HOLDOUT_READ=FORBIDDEN_AND_NOT_USED"

      - name: Task C correctness tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m pytest -q \
            tests/test_r11_evidence_store.py \
            tests/test_r11_event_journal.py \
            tests/test_r11_checkpoint_store.py \
            tests/test_r11_storage_lifecycle.py \
            tests/test_r11_io_runtime.py

      - name: Synthetic SSD-HDD micro-benchmark
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          META_BASE=/var/tmp
          HDD_BASE="$R11_DIAG_ROOT"
          test -d "$META_BASE" && test -w "$META_BASE"
          test -d "$HDD_BASE" && test -w "$HDD_BASE"
          python3 - <<'PY'
          import os
          from pathlib import Path
          def device(path):
              st=os.stat(path)
              major,minor=os.major(st.st_dev),os.minor(st.st_dev)
              resolved=Path(f'/sys/dev/block/{major}:{minor}').resolve()
              rotational=None
              for q in (resolved/'queue/rotational', resolved.parent/'queue/rotational'):
                  if q.is_file():
                      rotational=int(q.read_text().strip())
                      break
              return major,minor,rotational,resolved.name
          ssd=device('/var/tmp')
          hdd=device(os.environ['R11_DIAG_ROOT'])
          print('TASK_C_SSD_DEVICE=',ssd)
          print('TASK_C_HDD_DEVICE=',hdd)
          assert ssd[:2] != hdd[:2], 'TASK_C_SSD_HDD_SAME_DEVICE'
          assert ssd[2] == 0, f'TASK_C_METADATA_NOT_SSD:{ssd}'
          assert hdd[2] == 1, f'TASK_C_PAYLOAD_NOT_HDD:{hdd}'
          PY
          BENCH_TAG="task-c-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          META_ROOT="$META_BASE/$BENCH_TAG"
          PAYLOAD_ROOT="$HDD_BASE/.cb16_task_c_microbench/$BENCH_TAG"
          cleanup() {
            rm -rf "$META_ROOT" "$PAYLOAD_ROOT"
          }
          trap cleanup EXIT
          mkdir -p "$META_ROOT" "$PAYLOAD_ROOT"
          echo "TASK_C_META_ROOT=$META_ROOT"
          echo "TASK_C_PAYLOAD_ROOT=$PAYLOAD_ROOT"
          findmnt -T "$META_ROOT" || true
          findmnt -T "$PAYLOAD_ROOT" || true
          lsblk -o NAME,ROTA,TYPE,SIZE,MOUNTPOINTS || true
          timeout 220s "$PY" benchmarks/task_c_io_microbench_r11.py \
            --metadata-root "$META_ROOT" \
            --payload-root "$PAYLOAD_ROOT" \
            --count 2048 \
            --payload-bytes 32768 \
            --batch-size 128 \
            2>&1 | tee ci_evidence/task_c_micro_stdout.log

      - name: Gate correctness identity and benchmark scope
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          line = next(
              x for x in Path('ci_evidence/task_c_micro_stdout.log').read_text().splitlines()
              if x.startswith('TASK_C_MICROBENCH_JSON=')
          )
          r=json.loads(line.split('=',1)[1])
          assert r['correctness_identity']=='PASS'
          assert r['replay_new_payloads']==0
          assert r['replay_new_evidence']==0
          assert r['baseline_audit_pass'] is True
          assert r['optimized_audit_pass'] is True
          assert r['raw_1m_read'] is False
          assert r['final_holdout_read'] is False
          assert r['scientific_verdict_produced'] is False
          assert r['baseline_evidence_set_hash']==r['optimized_evidence_set_hash']
          print('TASK_C_REAL_MACHINE_MICRO_BENCHMARK=PASS')
          PY

      - name: Upload Task C microbenchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage2-task-c-micro-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          if-no-files-found: warn
          retention-days: 30
