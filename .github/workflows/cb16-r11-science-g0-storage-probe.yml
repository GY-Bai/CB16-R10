name: CB16 R11 Docker Storage Contract

on:
  push:
    branches:
      - ai/r11-science-g0-historical-r0
      - ai/r11-docker-runner-r0
    paths:
      - ci/docker_preflight.py
      - .github/workflows/cb16-r11-science-g0-storage-probe.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_UV_CACHE_DIR: /cb16/uv-cache
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env
  CB16_PACKAGE_ROOT: /cb16/package
  CB16_PARENT_R101_ROOT: /cb16/parent-r101
  CB16_PARENT_G0: /cb16/parents/r10_1.pt

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  probe:
    name: Verify Docker volume permissions
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify R11 science ancestry and freeze
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fc11c18ebd6dd0c883216766ed59cacb05e9a0c0 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"

      - name: Verify core Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_docker_preflight.json"

      - name: Verify mounted volume contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/cb16_r11_storage_contract.json" <<'PY'
          import json, os, sys
          from pathlib import Path

          out = Path(sys.argv[1])
          failures = []
          transport_warnings = []

          # Qualification-critical authority/reference mounts need only be readable.
          # Worker configuration is infrastructure-owned and is intentionally allowed
          # to be read-only inside the runner container.
          required_readable = {
              'raw': Path('/cb16/raw'),
              'r104': Path('/cb16/runtime/r104'),
              'venv': Path('/cb16/venv'),
              'package': Path('/cb16/package'),
              'parent_r101': Path('/cb16/parent-r101'),
              'parents': Path('/cb16/parents'),
              'r2_authority': Path('/cb16/r2-authority'),
              'worker': Path('/cb16/worker'),
              'uv_cache': Path('/cb16/uv-cache'),
          }
          # Only scientific/runtime output mounts are authority-critical writable
          # surfaces for the current R11 qualification path.
          required_writable = {
              'g0': Path('/cb16/g0'),
              'r2_native': Path('/cb16/r2-native'),
          }

          readable = {}
          for name, path in required_readable.items():
              ok = path.exists() and os.access(path, os.R_OK)
              readable[name] = {'path': str(path), 'ok': ok}
              if not ok:
                  failures.append(f'READABLE_VOLUME_MISSING:{name}:{path}')

          writable = {}
          for name, path in required_writable.items():
              ok = path.is_dir() and os.access(path, os.W_OK)
              detail = 'ACCESS_OK' if ok else 'NOT_WRITABLE'
              writable[name] = {'path': str(path), 'ok': ok, 'detail': detail}
              if not ok:
                  failures.append(f'WRITABLE_VOLUME_FAILED:{name}:{detail}')

          provision = Path('/cb16/worker/provision.env')
          provision_ok = provision.is_file() and os.access(provision, os.R_OK)
          if not provision_ok:
              failures.append('PROVISION_ENV_MISSING')

          # UV cache mutability affects download-cache efficiency only. No current
          # R11 qualification workflow performs network installation, so cache
          # writability is reported but cannot alter scientific/runtime authority.
          uv_cache = Path('/cb16/uv-cache')
          uv_cache_writable = uv_cache.is_dir() and os.access(uv_cache, os.W_OK)
          if not uv_cache_writable:
              transport_warnings.append('UV_CACHE_READ_ONLY_OR_NOT_WRITABLE')

          result = {
              'schema': 'CB16_R11_DOCKER_STORAGE_CONTRACT_V2',
              'status': 'PASS' if not failures else 'FAIL_CLOSED',
              'readable_volumes': readable,
              'writable_volumes': writable,
              'provision_env_present': provision_ok,
              'uv_cache_writable': uv_cache_writable,
              'transport_warnings': transport_warnings,
              'network_install_attempted': False,
              'git_annex_used': False,
              'host_directory_scan_performed': False,
              'scientific_payload_opened': False,
              'training_started': False,
              'final_holdout_payload_opened': False,
              'new_evidence_created': False,
              'new_scientific_verdict': False,
              'failures': failures,
          }
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(78)
          PY

      - name: Upload Docker storage receipts
        uses: actions/upload-artifact@v5
        with:
          name: cb16-r11-docker-storage-contract
          path: |
            ${{ runner.temp }}/cb16_r11_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_storage_contract.json
          if-no-files-found: error
          retention-days: 30
