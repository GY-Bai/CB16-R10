name: CB16 R11 M-Series H5.10.1 Strict-Clock Half-Block Replication R0

on:
  push:
    branches:
      - ai/m-series-h5-10-1-strict-clock-halfblock-replication-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_10_1_STRICT_CLOCK_HALFBLOCK_REPLICATION_R0_GATE_V1.json
      - cb16_local_opt/medium48_strict_clock_halfblock_replication_h5101.py
      - tests/test_medium48_strict_clock_halfblock_replication_h5101.py
      - scripts/r11_m_series_h5_10_1_strict_clock_halfblock_replication_r0.py
      - .github/workflows/cb16-r11-m-series-h5-10-1-strict-clock-halfblock-replication-r0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  h5-10-1-strict-clock-halfblock-replication:
    name: H5.10.1 Student-free Teacher-free strict-clock replication
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify preregistration authority and frozen scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8564ea932dadc0d2b1e1a661f0563755a1566e2c d917980113d2893d0d3ac4248d7c409898dc3602
          git merge-base --is-ancestor d917980113d2893d0d3ac4248d7c409898dc3602 HEAD
          test "$(git rev-parse d917980113d2893d0d3ac4248d7c409898dc3602:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_10_1_STRICT_CLOCK_HALFBLOCK_REPLICATION_R0_GATE_V1.json)" = "0cf5460a704d0713fb4c45fc335151e134335c8a"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_10_1_STRICT_CLOCK_HALFBLOCK_REPLICATION_R0_GATE_V1.json)" = "0cf5460a704d0713fb4c45fc335151e134335c8a"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_10_MEDIUM48_TEMPORAL_HALFBLOCK_STABILITY_R0_ADJUDICATION_V1.json)" = "00166dfa2c6692b68d0fcbf65b6fbb332edfece5"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/medium48_strict_clock_halfblock_replication_h5101.py)" = "f63e68673a8763265d7ff1b8009a3cb04f23fbd3"
          test "$(git rev-parse HEAD:tests/test_medium48_strict_clock_halfblock_replication_h5101.py)" = "4243c9278015a27cceb921cc135a48c9dcf381a4"
          test "$(git rev-parse HEAD:scripts/r11_m_series_h5_10_1_strict_clock_halfblock_replication_r0.py)" = "bb1f77d83bbb5231e71404a16f5fc66d5f6680a9"
          test "$(git rev-parse HEAD:cb16_local_opt/medium48_temporal_halfblock_stability_h510.py)" = "176983eb0f7beb6396823126f4bc1504c4418054"
          test "$(git rev-parse HEAD:cb16_local_opt/operator_conditional_medium_geometry_h58.py)" = "aaddbad059c7262a8137db87bee25d38c07afd83"
          test "$(git rev-parse HEAD:cb16_local_opt/time_local_vs_forward_geometry_contrast_h56.py)" = "a264ff21d0447527c4dda06ee8fd63cf20207daf"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55.py)" = "1dd00ea9b40b8da4061c0983fc44fb2307c72587"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55_clarified.py)" = "faa5233170aa421c3bf44f023b1d8e2f7c187568"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_temporal_transport_audit_h5.py)" = "09b05de23c659fe6f47a43117ec70b5cafcf7d21"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_vectorized_r11.py)" = "083ca6541b45577cfeb6d9a376b25e0eaf8d060a"
          test "$(git rev-parse HEAD:cb16_local_opt/r102_evidence_cache.py)" = "91fb73565ec60f66bf4232957f9b9b2f88cc3cfe"
          test "$(git rev-parse HEAD:cb16_local_opt/reduced_teacher_target_information_audit_r6.py)" = "bd7a8780e8dcab05cfae92744fde523ce62cc9ae"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_h5101_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_h5101_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run H5.10.1 unit and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h5101_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/medium48_strict_clock_halfblock_replication_h5101.py \
            tests/test_medium48_strict_clock_halfblock_replication_h5101.py \
            scripts/r11_m_series_h5_10_1_strict_clock_halfblock_replication_r0.py
          "$PYTHON" -m pytest -q \
            tests/test_medium48_strict_clock_halfblock_replication_h5101.py \
            tests/test_medium48_temporal_halfblock_stability_h510.py \
            tests/test_medium48_antialignment_breadth_h59.py \
            tests/test_operator_conditional_medium_geometry_h58.py \
            tests/test_medium48_relational_composition_falsification_h57.py \
            tests/test_time_local_vs_forward_geometry_contrast_h56.py \
            tests/test_state_utility_geometry_transport_audit_h55.py \
            tests/test_state_utility_geometry_transport_audit_h55_clarified.py \
            tests/test_teacher_temporal_transport_audit_h5.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_independent_purge_alignment_replication_r5.py \
            tests/test_r11_teacher_balanced_binding.py

      - name: Execute preregistered H5.10.1 strict-clock replication
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h5101_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-h5101-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_h5101_run_root.txt"
          "$PYTHON" -m scripts.r11_m_series_h5_10_1_strict_clock_halfblock_replication_r0 \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_H5_10_1_STRICT_CLOCK_HALFBLOCK_REPLICATION_R0_RESULT.json"

      - name: Verify H5.10.1 receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_h5101_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_H5_10_1_STRICT_CLOCK_HALFBLOCK_REPLICATION_R0_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_H5_10_1_STRICT_CLOCK_HALFBLOCK_REPLICATION_R0_RESULT_V1',x
          assert x['status']=='H5_10_1_STRICT_CLOCK_HALFBLOCK_REPLICATION_COMPLETE',x
          assert x['repo']['preregistration_commit']=='d917980113d2893d0d3ac4248d7c409898dc3602',x['repo']
          assert x['repo']['immutable_blobs']['gate']=='0cf5460a704d0713fb4c45fc335151e134335c8a',x['repo']
          assert x['repo']['immutable_blobs']['h510_adjudication']=='00166dfa2c6692b68d0fcbf65b6fbb332edfece5',x['repo']
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert [int(f['fold']) for f in x['folds']]==[1,2,3,4,5],x['folds']
          for f in x['folds']:
              assert f['full_fold']['reproduced'] is True,f
              assert len(f['halves'])==2,f
              assert all(int(h['future_group_count'])>=32 for h in f['halves']),f
              assert all(int(h['decision_clock_count'])>=1 for h in f['halves']),f
              assert f['strict_clock_sets_disjoint'] is True and f['strict_clock_order_passed'] is True,f
              assert f['same_decision_clock_never_split'] is True,f
              assert int(f['halves'][0]['last_timestamp_ms']) < int(f['halves'][1]['first_timestamp_ms']),f
              assert f['all_null_medium_distance_multisets_preserved'] is True,f
              assert f['partition_boundary_uses_utility'] is False and f['partition_boundary_uses_features'] is False,f
              assert f['change_point_search_used'] is False and f['calendar_or_market_regime_labels_used'] is False,f
              assert f['partition_changes_support_normalization_distance_or_null'] is False,f
              assert f['teacher_compilation_used'] is False and f['teacher_kernel_used'] is False and f['teacher_support_selection_used'] is False,f
              assert f['student_training_used'] is False and f['student_inference_used'] is False,f
              assert f['new_representation_used'] is False and f['medium_dimensions_subselected'] is False,f
              assert f['fusion_weights_searched'] is False and f['distance_metric_tuned'] is False,f
          s=x['h5_10_1_summary']
          assert s['classification'] in {
              'STRICT_CLOCK_WITHIN_FOLD_RELATION_STABLE__CROSS_FOLD_SIGN_REVERSAL',
              'STRICT_CLOCK_FAILURE_FOLDS_STABLE__POSITIVE_FOLDS_INTERNALLY_MIXED',
              'STRICT_CLOCK_FAILURE_FOLDS_INTERNALLY_MIXED__POSITIVE_FOLDS_STABLE',
              'STRICT_CLOCK_TEMPORAL_RELATION_MIXED_WITHIN_AND_ACROSS_FOLDS',
              'H5_10_1_BASELINE_REPRODUCTION_FAILED',
          },s
          assert s['market_information_verdict'] is False and s['canonical_change_authorized'] is False,s
          assert s['time_gating_authorized'] is False and s['handcrafted_regime_activation_authorized'] is False,s
          g=x['semantic_guards']
          assert g['same_decision_clock_split_across_halves'] is False,g
          assert g['strict_clock_half_sets_disjoint'] is True and g['strict_clock_order_required'] is True,g
          assert g['future_utility_used_to_select_temporal_boundaries'] is False and g['features_used_to_select_temporal_boundaries'] is False,g
          assert g['change_point_search_used'] is False and g['calendar_or_market_regime_labels_used'] is False,g
          assert g['support_normalization_distance_or_null_recomputed_after_partition'] is False,g
          assert g['medium_dimensions_split_post_hoc'] is False and g['timesfm_1280d_pre_adapter_latent_accessed'] is False,g
          assert g['fusion_weights_searched'] is False and g['organ_weights_tuned'] is False and g['distance_metric_tuned'] is False,g
          assert g['handcrafted_regime_or_cycle_activation_created'] is False and g['fold_or_half_id_used_as_decision_feature_or_permission_rule'] is False,g
          assert g['chronological_belief_expiry_created'] is False,g
          assert g['final_holdout_payload_opened'] is False and g['r7_candidate_evaluated'] is False,g
          print(json.dumps({
              'status':x['status'],
              'classification':s['classification'],
              'conclusion':s['conclusion'],
              'baseline_reproduction_passed':s['baseline_reproduction_passed'],
              'failure_fold_persistence_4_of_4':s['failure_fold_persistence_4_of_4'],
              'positive_fold_persistence_6_of_6':s['positive_fold_persistence_6_of_6'],
              'strict_clock_half_sequence':s['strict_clock_half_sequence'],
              'next_legal_step':x['next_legal_step'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload H5.10.1 evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-h5-10-1-strict-clock-halfblock-replication-r0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_h5101_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_h5101_python.json
            ${{ runner.temp }}/cb16-r11-m-series-h5101-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
