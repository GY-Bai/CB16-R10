name: CB16 R11 Stage4 INTG Hostile Harness

on:
  push:
    branches:
      - ai/r11-stage4-int-g-hostile-harness-r0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-intg-hostile-harness
  cancel-in-progress: true

jobs:
  stage4-intg-hostile-harness:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact Integration ancestry
        shell: bash
        run: |
          set -euo pipefail
          seed=86a4ac8a9080cd8382600cb998059e9585495a11
          git merge-base --is-ancestor "$seed" HEAD
          test "$(git rev-parse "$seed:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")" = "3c401a0a350984381912f7860181e3e96eb8d7cf"

      - name: Resolve verified canonical R10.4 Python
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/resolve_verified_r104_python.py --out stage4_intg_verified_python.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("stage4_intg_verified_python.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["status"] == "READY", r
          assert r["mode"] == "VERIFIED_CANONICAL_R104_VENV_REUSE", r
          py = Path(r["python"]["venv"]) / "bin/python"
          assert py.is_file(), py
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"CB16_PYTHON={py}\n")
          PY

      - name: Gatework, S4H, and INTG tests
        shell: bash
        run: |
          set -euo pipefail
          "$CB16_PYTHON" -m pytest -q \
            tests/test_stage4_gatework_r11.py \
            tests/test_stage4_hostile_cutover_r11.py \
            tests/test_stage4_hostile_integration_harness_r11.py

      - name: Static semantic authority guard
        shell: bash
        run: |
          set -euo pipefail
          "$CB16_PYTHON" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Run INTG reference binding matrix
        shell: bash
        run: |
          set -euo pipefail
          "$CB16_PYTHON" scripts/run_r11_stage4_integrated_hostile_matrix.py \
            --output stage4_intg_hostile_report.json \
            --manifest-output stage4_intg_binding_manifest.json
          "$CB16_PYTHON" - <<'PY'
          import json
          report = json.load(open("stage4_intg_hostile_report.json", encoding="utf-8"))
          manifest = json.load(open("stage4_intg_binding_manifest.json", encoding="utf-8"))
          assert report["status"] == "PASS", report
          assert report["case_count"] == report["passed_cases"] == 20, report
          assert report["integrated_runtime_qualified"] is False, report
          assert manifest["integrated_runtime_qualification_claimed"] is False, manifest
          assert manifest["sibling_integration_dependency_used"] is False, manifest
          PY

      - name: Validate INTG receipt shape when present
        shell: bash
        run: |
          set -euo pipefail
          receipt=authority/rearchitecture_r11/stage4_integration_receipts/INTG_RECEIPT_V1.json
          if test -f "$receipt"; then
            "$CB16_PYTHON" - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("authority/rearchitecture_r11/stage4_integration_receipts/INTG_RECEIPT_V1.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("authority/rearchitecture_r11/CB16_R11_STAGE4_INTEGRATION_RECEIPT_SCHEMA_V1.json").read_text(encoding="utf-8"))
          assert set(schema["required"]).issubset(receipt)
          assert receipt["schema"] == "CB16_R11_STAGE4_INTEGRATION_RECEIPT_V1"
          assert receipt["task_id"] == "INTG"
          assert receipt["integration_seed_sha"] == "86a4ac8a9080cd8382600cb998059e9585495a11"
          assert receipt["branch"] == "ai/r11-stage4-int-g-hostile-harness-r0"
          assert receipt["tests"]["passed"] is True
          assert receipt["semantic_guards"]["sibling_integration_dependency_used"] is False
          assert receipt["correctness_invariants"]["integrated_runtime_qualification_claimed"] is False
          PY
          else
            echo "INTG_RECEIPT_NOT_YET_PRESENT=SKIP"
          fi
