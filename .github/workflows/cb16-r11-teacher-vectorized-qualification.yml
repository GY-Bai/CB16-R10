name: CB16 R11 Vectorized Teacher Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r11-semantic-rearchitecture-r0
    paths:
      - .github/cb16-r11-teacher-v7-trigger.json

permissions:
  contents: read

concurrency:
  group: cb16-r11-vectorized-teacher-qualification
  cancel-in-progress: false

jobs:
  teacher-v7:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 40
    env:
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
      TEACHER_CACHE_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native/compiled_teacher_authority
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout R11 source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify read-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d "$LEGACY_R104_ROOT/evidence_cache"
          test -d "$TEACHER_CACHE_ROOT"
          r104_opts="$(findmnt -n -o OPTIONS -T "$LEGACY_R104_ROOT")"
          case ",$r104_opts," in *,ro,*) ;; *) echo "R104_AUTHORITY_NOT_RO=$r104_opts" >&2; exit 74 ;; esac
          active="$(ps -eo pid=,comm=,args= | awk '$2 ~ /^python/ && $0 ~ /scripts\/run_r104_long_research\.py/ {print}' || true)"
          if [ -n "$active" ]; then
            echo 'ACTIVE_LEGACY_R104_PROCESS_REFUSED' >&2
            echo "$active" >&2
            exit 75
          fi
          echo 'R11_READ_ONLY_AUTHORITY_BOUNDARY=PASS'

      - name: Reuse verified canonical R10.4 Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          test -x "$PYBIN"
          "$PYBIN" - <<'PY'
          import numpy, torch
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0)) == (6, 1)
          print('TORCH=' + torch.__version__)
          print('NUMPY=' + numpy.__version__)
          print('GPU=' + torch.cuda.get_device_name(0))
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Syntax and semantic freeze gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile \
            cb16_local_opt/rearchitecture_authority_r11.py \
            cb16_local_opt/teacher_vectorized_r11.py \
            scripts/run_r11_teacher_vectorized_qualification.py \
            tests/test_teacher_vectorized_r11.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Run synthetic differential oracle tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m unittest tests.test_teacher_vectorized_r11

      - name: Run full frozen R10.4 Teacher oracle qualification
        id: qual
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -uo pipefail
          set +e
          /usr/bin/time -v -o ci_evidence/time_verbose.txt \
            "$PY" scripts/run_r11_teacher_vectorized_qualification.py \
              --legacy-r104-root "$LEGACY_R104_ROOT" \
              --teacher-cache-root "$TEACHER_CACHE_ROOT" \
              --block-targets 64 \
              --out ci_evidence/r11_teacher_v7_result.json \
              2>&1 | tee ci_evidence/r11_teacher_v7_stdout.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "$rc" > ci_evidence/exit_code.txt
          exit 0

      - name: Final Teacher V7 gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          RC: ${{ steps.qual.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$RC" = 0
          "$PY" - <<'PY'
          import json
          x=json.load(open('ci_evidence/r11_teacher_v7_result.json'))
          assert x['status']=='PASS'
          assert x['scientific_semantics_changed'] is False
          assert x['oracle']['mode']=='REUSED_VERIFIED_AUTHORITY'
          assert x['equivalence']['train']['pass'] is True
          assert x['equivalence']['validation']['pass'] is True
          assert x['forbidden_work']['raw_1m_archive_read'] is False
          assert x['forbidden_work']['final_holdout_payload_read'] is False
          assert x['forbidden_work']['h72_physics_execution'] is False
          assert x['forbidden_work']['central_brain_training'] is False
          print('R11_VECTORIZED_TEACHER_QUALIFICATION=PASS')
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-teacher-v7-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          if-no-files-found: warn
          retention-days: 30
