name: CB16 Provision Mirror Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r2-evidence-storage-r0
    paths:
      - .github/cb16-provision-mirror-qualification-trigger.json

permissions:
  contents: write

concurrency:
  group: cb16-provision-mirror-qualification
  cancel-in-progress: false

jobs:
  qualify-host-mirror:
    runs-on: [self-hosted, shanxi, cb16-r10-canonical]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            provision/scripts/provision_python.py \
            ci/qualify_provision_mirror.py \
            tests/test_provision_mirror_routing.py

      - name: Mirror routing unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 -m unittest tests.test_provision_mirror_routing -v \
            2>&1 | tee ci_evidence/unit_tests.log

      - name: Qualify real Shanxi host mirror binding without installs
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/qualify_provision_mirror.py \
            --out ci_evidence/provision_mirror_qualification.json \
            2>&1 | tee ci_evidence/qualification_stdout.log

      - name: Verify frozen R10.4 Python remains usable
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/resolve_verified_r104_python.py \
            --out ci_evidence/verified_r104_python.json \
            2>&1 | tee ci_evidence/verified_r104_python.stdout
          python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/verified_r104_python.json'))
          assert x['status']=='READY'
          assert x['python']['network_install_attempted'] is False
          print('VERIFIED_R104_PYTHON_REUSE=PASS')
          PY

      - name: Materialize mirror verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('ci_evidence')
          q=json.load(open(p/'provision_mirror_qualification.json')) if (p/'provision_mirror_qualification.json').exists() else None
          v=json.load(open(p/'verified_r104_python.json')) if (p/'verified_r104_python.json').exists() else None
          errors=[]
          if not q or q.get('status')!='PASS': errors.append('HOST_MIRROR_QUALIFICATION_FAIL')
          if not v or v.get('status')!='READY': errors.append('VERIFIED_R104_PYTHON_FAIL')
          result={
            'schema':'CB16_PROVISION_MIRROR_CI_QUALIFICATION_V1',
            'status':'PASS' if not errors else 'FAIL',
            'errors':errors,
            'host_mirror':q,
            'verified_r104_python':v,
            'network_install_attempted':False,
            'scientific_semantics_changed':False,
            'final_holdout_2025_09_accessed':False,
          }
          (p/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':result['status'],'errors':errors},sort_keys=True))
          PY
          (cd ci_evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)

      - name: Persist sanitized mirror qualification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          SNAP="/tmp/cb16-provision-mirror-qual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SNAP" && mkdir -p "$SNAP"
          cp -a ci_evidence/. "$SNAP"/
          BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          DEST="ci-results/provision-mirror-qualification/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp -a "$SNAP"/. "$DEST"/
          git config user.name 'cb16-provision-mirror-qual-ci'
          git config user.email '37661207+GY-Bai@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "ci-results: provision mirror qualification ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Upload mirror qualification artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cb16-provision-mirror-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          retention-days: 14

      - name: Final mirror gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ci_evidence/result.json
          python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/result.json'))
          assert x['status']=='PASS'
          assert x['network_install_attempted'] is False
          print('PROVISION_MIRROR_QUALIFICATION=PASS')
          PY
