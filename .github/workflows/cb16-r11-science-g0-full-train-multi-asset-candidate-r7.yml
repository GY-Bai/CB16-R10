name: CB16 R11 Science G0 Full-TRAIN Multi-Asset Candidate R7

on:
  push:
    branches:
      - ai/r11-science-g0-full-train-multi-asset-candidate-r7
    paths:
      - authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_FULL_TRAIN_MULTI_ASSET_CANONICAL_CANDIDATE_R7_GATE_V1.json
      - cb16_local_opt/full_train_multi_asset_candidate_r7.py
      - tests/test_full_train_multi_asset_candidate_r7.py
      - scripts/r11_science_g0_full_train_multi_asset_candidate_r7.py
      - scripts/r11_science_g0_full_train_multi_asset_candidate_r7_entrypoint.py
      - .github/workflows/cb16-r11-science-g0-full-train-multi-asset-candidate-r7.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env
  CB16_PACKAGE_ROOT: /cb16/package

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  full-train-candidate-r7:
    name: R11 full-TRAIN multi-asset canonical candidate R7
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable R7 preregistration and authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6bcea1ea631d1df077a70199d62acd83bbd35da1 HEAD
          test "$(git rev-parse 6bcea1ea631d1df077a70199d62acd83bbd35da1:authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_FULL_TRAIN_MULTI_ASSET_CANONICAL_CANDIDATE_R7_GATE_V1.json)" = "40f2431e1dfea2f3198272b4f57147f97f3cd43e"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_FULL_TRAIN_MULTI_ASSET_CANONICAL_CANDIDATE_R7_GATE_V1.json)" = "40f2431e1dfea2f3198272b4f57147f97f3cd43e"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_REDUCED_TEACHER_TARGET_INFORMATION_AUDIT_R6_ADJUDICATION_V1.json)" = "5a38e4d33e20c049507f3935b4de6b10c0a12912"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/typed_central_brain_r10.py)" = "899065a9b9c015fd5a0e24fc919a79ff7d3a67ff"
          test "$(git rev-parse HEAD:cb16_local_opt/training_runtime_r11.py)" = "56c227800d7a5c82ef88c691bb69d7550aee8b39"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_runtime_r11.py)" = "656f1483f2e6a96daae5c98eb96cd75805d3547c"
          test -f "$CB16_G0_ROOT/bootstrap/R11_G0_INITIAL_CHAMPION.pt"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"
          test -d "$CB16_PACKAGE_ROOT"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_science_g0_r7_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_science_g0_r7_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run R7 unit and regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_science_g0_r7_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/full_train_multi_asset_candidate_r7.py \
            tests/test_full_train_multi_asset_candidate_r7.py \
            scripts/r11_science_g0_full_train_multi_asset_candidate_r7.py \
            scripts/r11_science_g0_full_train_multi_asset_candidate_r7_entrypoint.py
          "$PYTHON" -m pytest -q \
            tests/test_full_train_multi_asset_candidate_r7.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_training_runtime_r11.py \
            tests/test_training_integration_r11.py \
            tests/test_r11_teacher_balanced_binding.py \
            tests/test_teacher_runtime_r11.py

      - name: Execute preregistered R7 full-TRAIN candidate materialization
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_science_g0_r7_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-science-g0-r7-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_science_g0_r7_run_root.txt"
          "$PYTHON" scripts/r11_science_g0_full_train_multi_asset_candidate_r7_entrypoint.py \
            --g0-root "$CB16_G0_ROOT" \
            --package-root "$CB16_PACKAGE_ROOT" \
            --r104-root "$CB16_R104_ROOT" \
            --work-root "$RUN_ROOT" \
            --output "$RUN_ROOT/CB16_R11_SCIENCE_G0_FULL_TRAIN_MULTI_ASSET_CANONICAL_CANDIDATE_R7_RESULT.json" \
            --device cuda

      - name: Verify R7 receipt and unevaluated boundary
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_science_g0_r7_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_SCIENCE_G0_FULL_TRAIN_MULTI_ASSET_CANONICAL_CANDIDATE_R7_RESULT.json" "$RUN_ROOT/R11_R7_FROZEN_UNEVALUATED_CANDIDATE.pt" <<'PY'
          import json,math,os,sys
          x=json.load(open(sys.argv[1])); checkpoint=sys.argv[2]
          assert x['schema']=='CB16_R11_SCIENCE_G0_FULL_TRAIN_MULTI_ASSET_CANONICAL_CANDIDATE_R7_RESULT_V1',x
          assert x['status']=='R11_FULL_TRAIN_MULTI_ASSET_CANONICAL_CANDIDATE_R7_MATERIALIZED',x
          assert x['frozen_scientific_status_before']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert x['frozen_scientific_status_after']==x['frozen_scientific_status_before'],x
          src=x['source']; t=x['teacher']; m=x['materialization']; s=x['semantic_guards']
          assert src['train_parent_contexts']==9714 and src['train_branch_samples']==87426 and src['train_dependence_groups']==1619,x
          assert src['legacy_validation_rows_used'] is False and src['r5_purge_support_used'] is False and src['r6_outer_eval_reused'] is False,x
          assert src['raw_market_payload_used'] is False,x
          assert t['summary']['total']==9714 and t['summary']['admitted']==9714 and t['summary']['admitted_dependence_groups']==1619,x
          assert t['all_train_parent_contexts_admitted'] is True,x
          assert len(m['reproduction_runs'])==2,x
          assert m['reproduction_policy_hash_match'] is True and m['reproduction_state_tensors_exact_match'] is True,x
          assert m['candidate_evaluation_state']=='UNEVALUATED_OUTSIDE_TRAIN_FIT',x
          assert m['candidate_promotion_state']=='NOT_AUTHORIZED',x
          assert m['train_fit_slot_is_independent_evaluation'] is False,x
          assert os.path.isfile(checkpoint),checkpoint
          hashes={r['candidate_policy_hash'] for r in m['reproduction_runs']}
          assert hashes=={m['candidate_policy_hash']},m
          for r in m['reproduction_runs']:
              assert r['generation_seed']==24680 and r['optimizer_steps']==228,r
              assert r['train_evidence_hash']==t['prepared_evidence_hash'],r
              assert r['train_fit_slot_evidence_hash']==t['prepared_evidence_hash'],r
              assert r['train_fit_is_independent_evaluation'] is False,r
              assert set(r['gradient_owner_set_last_step']) == {
                  'Operator Brain Stem','Medium Brain Stem','Account Brain Stem',
                  'Shared Decision Core','Direction Head','Requested-Risk Head'
              },r
              assert all(math.isfinite(float(v)) and float(v)>0 for v in r['gradient_group_norms_last_step'].values()),r
              assert all(math.isfinite(float(v)) and float(v)>0 for v in r['update_group_norms'].values()),r
          for key in ('canonical_generation_advanced','champion_promoted','production_cutover','market_information_verdict_reopened','scientific_verdict_created','profitability_or_alpha_claimed','legacy_validation_evaluated','r5_purge_evaluated','r6_outer_eval_reused','final_holdout_payload_opened','fresh_market_data_downloaded','raw_market_payload_used'):
              assert s[key] is False,(key,s)
          assert s['frozen_package_unchanged'] is True and s['g0_authority_unchanged'] is True,x
          print(json.dumps({
              'status':x['status'],
              'candidate_policy_hash':m['candidate_policy_hash'],
              'candidate_identity_sha256':m['candidate_identity']['candidate_identity_sha256'],
              'full_train_evidence_hash':t['prepared_evidence_hash'],
              'train_fit_before':m['reproduction_runs'][0]['train_fit_before']['loss'],
              'train_fit_after':m['reproduction_runs'][0]['train_fit_after']['loss'],
              'next_legal_step':x['next_legal_step'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload R7 frozen candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-science-g0-full-train-multi-asset-candidate-r7-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_science_g0_r7_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_science_g0_r7_python.json
            ${{ runner.temp }}/cb16-r11-science-g0-r7-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90
