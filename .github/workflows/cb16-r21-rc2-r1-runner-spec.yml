name: CB16 R21 RC2 R1 Runner Spec

on:
  push:
    branches:
      - ai/r21-rc2-r1-runner-spec
    paths:
      - "infra/shanxi_runner/**"
      - "scripts/generate_shanxi_runner_snapshot_v1.py"
      - "scripts/verify_r21_rc2_runner_definition_v1.py"
      - "tests/test_r21_rc2_runner_definition_v1.py"
      - ".github/workflows/cb16-r21-rc2-r1-runner-spec.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_UV_CACHE_DIR: /cb16/uv-cache
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  r1-runner-definition:
    name: R1 runner definition and live surface self-check
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout R1 runner-spec branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/r1_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r1_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['python']['network_install_attempted'] is False, p
          print('R1_PYTHON_ENV_READY')
          PY

      - name: Run R1 static definition tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r1_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          PYTHONPATH=. "$PYTHON" -m pytest -q tests/test_r21_rc2_runner_definition_v1.py

      - name: Verify static runner definition contract
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r1_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          PYTHONPATH=. "$PYTHON" scripts/verify_r21_rc2_runner_definition_v1.py \
            --static \
            --json-out "$RUNNER_TEMP/R1_STATIC_VERIFICATION.json"

      - name: Run read-only live surface self-check
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r1_python.json"
          PYTHON=$(python3 - "$OUT" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print(p['python']['venv'] + '/bin/python')
          PY
          )
          PYTHONPATH=. "$PYTHON" scripts/verify_r21_rc2_runner_definition_v1.py \
            --self-check \
            --json-out "$RUNNER_TEMP/R1_LIVE_SURFACE_SELF_CHECK.json"
          echo "R1_LIVE_SURFACE_SELF_CHECK_IS_READ_ONLY_NOT_DISPOSABLE_LAUNCH"

      - name: Upload R1 runner definition evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r21-rc2-r1-runner-spec-evidence
          path: |
            ${{ runner.temp }}/R1_STATIC_VERIFICATION.json
            ${{ runner.temp }}/R1_LIVE_SURFACE_SELF_CHECK.json
            ${{ runner.temp }}/r1_python.json
            ${{ runner.temp }}/r1_docker_preflight.json
          if-no-files-found: error
          retention-days: 30
