name: CB16 R11 Stage-2 Pipeline Qualification

on:
  push:
    branches:
      - ai/r11-stage2-integration-r1
    paths:
      - .github/cb16-r11-stage2-pipeline-trigger.json

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      armed: ${{ steps.guard.outputs.armed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Hosted pipeline contract preflight
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage2-integration-r1"
          python3 -m py_compile scripts/run_r11_stage2_pipeline_qualification.py
          python3 - <<'PY'
          import json, os
          x=json.load(open('.github/cb16-r11-stage2-pipeline-trigger.json'))
          assert x['schema']=='CB16_R11_STAGE2_PIPELINE_TRIGGER_V1'
          assert x['qualification_branch']=='ai/r11-stage2-integration-r1'
          assert x['performance_thresholds'] is False
          assert x['pipeline_cycles']==1
          assert 1 <= int(x['hard_timeout_minutes']) <= 5
          armed=bool(x.get('armed', False))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"armed={'true' if armed else 'false'}\n")
          print('CB16_R11_STAGE2_PIPELINE_TRIGGER_ARMED=' + str(armed))
          PY

  pipeline:
    needs: authorize
    if: needs.authorize.outputs.armed == 'true' && github.ref_name == 'ai/r11-stage2-integration-r1'
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 5
    env:
      PACKAGE_ROOT: /data/cb16_ci/r2-authority/package_r102
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
      R11_DIAG_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify exact branch and read-only authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage2-integration-r1"
          test -d "$PACKAGE_ROOT"
          test -d "$LEGACY_R104_ROOT/evidence_cache"
          pkg_opts="$(findmnt -n -o OPTIONS -T "$PACKAGE_ROOT")"
          r104_opts="$(findmnt -n -o OPTIONS -T "$LEGACY_R104_ROOT")"
          case ",$pkg_opts," in *,ro,*) ;; *) exit 74 ;; esac
          case ",$r104_opts," in *,ro,*) ;; *) exit 74 ;; esac
          echo 'CB16_R11_STAGE2_PIPELINE_AUTHORITY_BOUNDARY=PASS'

      - name: Resolve verified canonical Pascal Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/pipeline_python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/pipeline_python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          "$PYBIN" - <<'PY'
          import os, torch
          assert os.cpu_count()==16
          assert torch.__version__=='2.8.0+cu126'
          assert torch.version.cuda=='12.6'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0))==(6,1)
          assert 'GTX 1060' in torch.cuda.get_device_name(0)
          assert torch.get_default_dtype()==torch.float32
          print('CB16_R11_STAGE2_PIPELINE_HARDWARE=PASS')
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Verify pipeline sources and semantic freeze
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile \
            sitecustomize.py \
            scripts/run_r11_stage2_pipeline_qualification.py \
            scripts/run_r11_stage2_integration_burst.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root . \
            | tee ci_evidence/pipeline_semantic_freeze.log

      - name: Verify SSD metadata and HDD payload placement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ci_evidence/pipeline_storage_guard.txt
          import os
          from pathlib import Path
          def dev(path):
              st=os.stat(path)
              major,minor=os.major(st.st_dev),os.minor(st.st_dev)
              resolved=Path(f'/sys/dev/block/{major}:{minor}').resolve()
              rotational=None
              for q in (resolved/'queue/rotational', resolved.parent/'queue/rotational'):
                  if q.is_file():
                      rotational=int(q.read_text().strip()); break
              return major,minor,resolved.name,rotational
          ssd=dev('/var/tmp'); hdd=dev(os.environ['R11_DIAG_ROOT'])
          assert ssd[:2] != hdd[:2]
          assert ssd[3] == 0
          assert hdd[3] == 1
          print('SSD',ssd,'HDD',hdd)
          PY

      - name: Prepare disposable pipeline roots
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          SSD_ROOT="/var/tmp/cb16-r11-stage2-pipeline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          HDD_ROOT="$R11_DIAG_ROOT/r11-stage2-pipeline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SSD_ROOT" "$HDD_ROOT"
          mkdir -p "$SSD_ROOT" "$HDD_ROOT"
          echo "ssd=$SSD_ROOT" >> "$GITHUB_OUTPUT"
          echo "hdd=$HDD_ROOT" >> "$GITHUB_OUTPUT"

      - name: Run one-cycle real Stage-2 pipeline qualification
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          HDD_ROOT: ${{ steps.roots.outputs.hdd }}
          CB16_R11_BURST_PACKAGE_ROOT: ${{ env.PACKAGE_ROOT }}
          CB16_R11_BURST_LEGACY_R104_ROOT: ${{ env.LEGACY_R104_ROOT }}
          CB16_R11_BURST_SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          CB16_R11_BURST_HDD_ROOT: ${{ steps.roots.outputs.hdd }}
          CB16_R11_BURST_TRACE_WORKERS: '8'
          CB16_R11_BURST_TEACHER_WORKERS: '8'
          CB16_R11_BURST_WARMUP_SECONDS: '30'
          CB16_R11_CANONICAL_DTYPE: FP32
          CB16_R11_AMP: '0'
          CB16_R11_PIPELINE_OUT: ${{ github.workspace }}/ci_evidence/CB16_R11_STAGE2_PIPELINE_QUALIFICATION_V1.json
        run: |
          set -euo pipefail
          env PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/run_r11_stage2_pipeline_qualification.py \
            2>&1 | tee ci_evidence/stage2_pipeline.log

      - name: Final pipeline-only acceptance gate
        if: always()
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          test -f ci_evidence/CB16_R11_STAGE2_PIPELINE_QUALIFICATION_V1.json
          "$PY" - <<'PY'
          import json
          x=json.load(open('ci_evidence/CB16_R11_STAGE2_PIPELINE_QUALIFICATION_V1.json'))
          assert x['schema']=='CB16_R11_STAGE2_PIPELINE_QUALIFICATION_V1'
          assert x['status']=='PASS'
          assert x['performance_thresholds_evaluated'] is False
          assert x['burst_or_endurance_test'] is False
          assert x['pipeline_cycles']==1
          assert all(v is True for v in x['handoffs'].values()), x['handoffs']
          s=x['semantic']
          required=(
              'semantic_freeze_pass','final_holdout_untouched','frozen_authority_unchanged',
              'teacher_identity_unchanged','training_differential_pass','gradient_ownership_pass',
              'h72_receipt_identity_unchanged','storage_replay_zero','durable_recovery_pass',
              'champion_challenger_lifecycle_correct',
          )
          assert all(s[k] is True for k in required), s
          assert s['scientific_semantics_changed'] is False
          assert s['new_scientific_verdict'] is False
          print('CB16_R11_STAGE2_PIPELINE_QUALIFICATION=PASS')
          PY

      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-stage2-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          retention-days: 30

      - name: Cleanup disposable pipeline roots
        if: always()
        shell: bash
        env:
          SSD_ROOT: ${{ steps.roots.outputs.ssd }}
          HDD_ROOT: ${{ steps.roots.outputs.hdd }}
        run: |
          set +e
          [ -z "${SSD_ROOT:-}" ] || rm -rf "$SSD_ROOT"
          [ -z "${HDD_ROOT:-}" ] || rm -rf "$HDD_ROOT"
          exit 0
