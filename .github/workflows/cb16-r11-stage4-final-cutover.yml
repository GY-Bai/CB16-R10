name: CB16 R11 Stage4 Final Consolidated Cutover

on:
  push:
    branches:
      - ai/r11-stage4-final-cutover-r0
    paths:
      - 'scripts/adjudicate_r11_stage4_final_cutover.py'
      - 'scripts/adjudicate_r11_stage4_final_cutover_v2.py'
      - '.github/workflows/cb16-r11-stage4-final-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-final-cutover
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  final-cutover:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 20
    steps:
      - name: Checkout final cutover qualification branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact final ancestry and accepted integration refs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage4-final-cutover-r0"
          SEED=86a4ac8a9080cd8382600cb998059e9585495a11
          UNION=5769848b2cc2ec459f25655610f69068f812e16d
          FREEZE=3c401a0a350984381912f7860181e3e96eb8d7cf
          git merge-base --is-ancestor "$SEED" HEAD
          git merge-base --is-ancestor "$UNION" HEAD
          test -z "$(git rev-list --merges "$SEED..HEAD")"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "$FREEZE"
          # checkout@v6 with fetch-depth:0 has already fetched all remote branches.
          for b in \
            ai/r11-stage4-int-a-runtime-spine-r0 \
            ai/r11-stage4-int-b-persistence-fencing-r0 \
            ai/r11-stage4-int-c-engine-authority-r0 \
            ai/r11-stage4-int-d-permission-execution-r0 \
            ai/r11-stage4-int-e-adoption-recovery-r0 \
            ai/r11-stage4-int-f-worker-lifecycle-r0 \
            ai/r11-stage4-int-g-hostile-harness-r0 \
            ai/r11-stage4-int-h-final-gates-r0; do
            git rev-parse --verify "refs/remotes/origin/$b" >/dev/null
          done

      - name: Resolve verified canonical R10.4 Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/stage4_final_python.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/stage4_final_python.json'))
          assert x['status']=='READY', x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE', x
          assert x['python']['network_install_attempted'] is False, x
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          test -x "$PYBIN"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Run complete Stage4 integration correctness suite
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_runtime_spine_integration_r11.py \
            tests/test_stage4_fenced_persistence_r11.py \
            tests/test_stage4_authoritative_engines_r11.py \
            tests/test_stage4_execution_integration_r11.py \
            tests/test_stage4_recovery_integration_r11.py \
            tests/test_stage4_orchestration_provider_r11.py \
            tests/test_stage4_hostile_cutover_r11.py \
            tests/test_stage4_hostile_integration_harness_r11.py \
            tests/test_stage4_integration_gate_compiler_r11.py \
            tests/test_stage4_consolidated_authority_r11.py \
            tests/test_stage4_consolidated_hostile_adapter_r11.py
          "$PY" - <<'PY'
          import json, subprocess
          from pathlib import Path
          head=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          Path('ci_evidence/stage4_final_correctness.pass.json').write_text(
              json.dumps({'head_sha': head, 'passed': True}, sort_keys=True)+'\n', encoding='utf-8')
          PY

      - name: Reconfirm frozen scientific authority
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
          ! git diff --name-only 86a4ac8a9080cd8382600cb998059e9585495a11..HEAD | grep -E '(^|/)(final_holdout|2025-09|market_data)(/|$)'
          ! git diff --name-only 86a4ac8a9080cd8382600cb998059e9585495a11..HEAD | grep '^provision/assets/binance_usdm_1m_funding_2020_2026'

      - name: Final consolidated adjudication
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/adjudicate_r11_stage4_final_cutover_v2.py
          "$PY" - <<'PY'
          import json
          p=json.load(open('ci_evidence/stage4_final_cutover/final_cutover_report.json'))
          assert p['verdict']=='R11_CANONICAL_AUTHORITY_CUTOVER_QUALIFIED', p
          assert all(p['qualification_gates'].values()), p['qualification_gates']
          print('R11_CANONICAL_AUTHORITY_CUTOVER_QUALIFIED')
          PY

      - name: Upload final Stage4 cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb16-r11-stage4-final-cutover-${{ github.run_id }}
          path: |
            ci_evidence/stage4_final_python.json
            ci_evidence/stage4_final_correctness.pass.json
            ci_evidence/stage4_final_cutover/
          if-no-files-found: warn
          retention-days: 30
