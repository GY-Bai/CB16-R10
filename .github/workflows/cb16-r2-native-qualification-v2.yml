name: CB16 R2 Native Campaign Qualification V2

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r2-evidence-storage-r0
    paths:
      - .github/cb16-r2-native-v2-trigger.json

permissions:
  contents: write

concurrency:
  group: cb16-r2-native-campaign-qualification-v2
  cancel-in-progress: false

jobs:
  native-r2-v2:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 120
    env:
      R2_RUNNER_UNIT: cb16-github-runner.service
      R103_HOST_SOURCE: /home/bgy/cb16_ssd/runtime/R10_3/qualification_r8_3_8w
      R103_ROOT: /data/cb16_ci/r2-authority/r103
      PACKAGE_HOST_SOURCE: /home/bgy/m3-infra/CB16_SHANXI_R10_2_REAL_HISTORICAL_G0_LEARNING_V1
      PACKAGE_ROOT: /data/cb16_ci/r2-authority/package_r102
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
      R2_QUAL_HDD_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native
    steps:
      - name: Checkout R2 source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fail closed unless WSS least-privilege authority aliases are qualified
        shell: bash
        run: |
          set -euo pipefail
          cgroup="$(cat /proc/self/cgroup)"
          grep -q '/system.slice/cb16-github-runner.service' <<<"$cgroup"
          protect_system="$(systemctl show "$R2_RUNNER_UNIT" -p ProtectSystem --value)"
          protect_home="$(systemctl show "$R2_RUNNER_UNIT" -p ProtectHome --value)"
          rw="$(systemctl show "$R2_RUNNER_UNIT" -p ReadWritePaths --value)"
          bro="$(systemctl show "$R2_RUNNER_UNIT" -p BindReadOnlyPaths --value)"
          test "$protect_system" = strict
          test "$protect_home" = yes
          grep -Fq '/data/cb16_ci/github-runner-qualification/actions-runner' <<<"$rw"
          grep -Fq "$R2_QUAL_HDD_ROOT" <<<"$rw"
          grep -Fq "$R103_HOST_SOURCE:$R103_ROOT" <<<"$bro"
          grep -Fq "$PACKAGE_HOST_SOURCE:$PACKAGE_ROOT" <<<"$bro"

          test -d "$R103_ROOT" -a -r "$R103_ROOT" -a -x "$R103_ROOT"
          test -d "$PACKAGE_ROOT" -a -r "$PACKAGE_ROOT" -a -x "$PACKAGE_ROOT"
          test -d "$LEGACY_R104_ROOT" -a -r "$LEGACY_R104_ROOT"

          r103_opts="$(findmnt -n -o OPTIONS -T "$R103_ROOT")"
          pkg_opts="$(findmnt -n -o OPTIONS -T "$PACKAGE_ROOT")"
          r104_opts="$(findmnt -n -o OPTIONS -T "$LEGACY_R104_ROOT")"
          case ",$r103_opts," in *,ro,*) ;; *) echo "R103_ALIAS_NOT_RO=$r103_opts" >&2; exit 74 ;; esac
          case ",$pkg_opts," in *,ro,*) ;; *) echo "PACKAGE_ALIAS_NOT_RO=$pkg_opts" >&2; exit 74 ;; esac
          case ",$r104_opts," in *,ro,*) ;; *) echo "R104_AUTHORITY_NOT_RO=$r104_opts" >&2; exit 74 ;; esac

          if test -r "$R103_HOST_SOURCE" || test -x "$R103_HOST_SOURCE"; then
            echo 'DIRECT_HOME_R103_UNEXPECTEDLY_VISIBLE' >&2
            exit 74
          fi
          if test -r "$PACKAGE_HOST_SOURCE" || test -x "$PACKAGE_HOST_SOURCE"; then
            echo 'DIRECT_HOME_PACKAGE_UNEXPECTEDLY_VISIBLE' >&2
            exit 74
          fi
          echo 'R2_WSS_ALIAS_SANDBOX=PASS'

      - name: Refuse overlap with legacy R10.4 writer
        shell: bash
        run: |
          set -euo pipefail
          active="$(ps -eo pid=,comm=,args= | awk '$2 ~ /^python/ && $0 ~ /scripts\/run_r104_long_research\.py/ {print}' || true)"
          if [ -n "$active" ]; then
            echo 'ACTIVE_LEGACY_R104_PROCESS_REFUSED' >&2
            echo "$active" >&2
            exit 75
          fi
          echo 'LEGACY_R104_PROCESS=NOT_RUNNING'

      - name: Reuse verified canonical R10.4 ML Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          assert x['python']['network_install_attempted'] is False
          assert x['python']['package_hash_validation_used'] is False
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          test -x "$PYBIN"
          "$PYBIN" - <<'PY'
          import torch
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.cuda.is_available()
          print('CUDA=' + str(torch.version.cuda))
          print('GPU=' + torch.cuda.get_device_name(0))
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Prepare true SSD metadata plus HDD payload topology
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          BASE="/tmp/cb16-r2-native-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUN="$BASE/run"
          META="$BASE/meta"
          PAYLOAD_RUN_ROOT="$R2_QUAL_HDD_ROOT/native-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PAYLOAD="$PAYLOAD_RUN_ROOT/payload"
          rm -rf "$BASE" "$PAYLOAD_RUN_ROOT"
          mkdir -p "$RUN" "$META" "$PAYLOAD" ci_evidence
          canary="$PAYLOAD/.write_canary"
          printf '%s\n' r2-native-v2 > "$canary"
          sync "$canary"
          rm -f "$canary"

          META_SRC="$(findmnt -n -o SOURCE -T "$META")"
          PAYLOAD_SRC="$(findmnt -n -o SOURCE -T "$PAYLOAD")"
          {
            echo "RUN_ROOT=$RUN"
            echo "METADATA_ROOT=$META"
            echo "PAYLOAD_ROOT=$PAYLOAD"
            echo "METADATA_SOURCE=$META_SRC"
            echo "PAYLOAD_SOURCE=$PAYLOAD_SRC"
            echo '=== metadata ==='
            findmnt -T "$META" -o TARGET,SOURCE,FSTYPE,OPTIONS
            echo '=== payload ==='
            findmnt -T "$PAYLOAD" -o TARGET,SOURCE,FSTYPE,OPTIONS
            echo '=== devices ==='
            lsblk -o NAME,KNAME,TYPE,ROTA,SIZE,FSTYPE,MOUNTPOINTS,MODEL,TRAN
          } | tee ci_evidence/storage_topology.txt

          test "$META_SRC" != "$PAYLOAD_SRC"
          test "$PAYLOAD_SRC" = '/dev/sda1'
          case "$META_SRC" in
            /dev/mapper/ubuntu--vg-ubuntu--lv|/dev/sdb3|/dev/sdb) ;;
            *) echo "UNEXPECTED_METADATA_DEVICE=$META_SRC" >&2; exit 76 ;;
          esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "meta=$META" >> "$GITHUB_OUTPUT"
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Syntax and import gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile \
            cb16_local_opt/r2_campaign.py \
            cb16_local_opt/r2_evidence_storage.py \
            cb16_local_opt/r2_event_journal.py \
            scripts/run_r2_native_qualification.py \
            scripts/run_r2_native_qualification_v2.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" - <<'PY'
          from cb16_local_opt.r2_campaign import run_campaign_r2
          print('R2_NATIVE_V2_IMPORT=PASS')
          PY

      - name: Start lightweight utilization observers
        id: observers
        shell: bash
        run: |
          set -euo pipefail
          if command -v iostat >/dev/null 2>&1; then
            iostat -xz 1 > ci_evidence/iostat.log 2>&1 & echo "iostat_pid=$!" >> "$GITHUB_OUTPUT"
          else
            echo "iostat_pid=" >> "$GITHUB_OUTPUT"; echo IOSTAT_NOT_INSTALLED > ci_evidence/iostat.log
          fi
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi dmon -s pucm -d 1 > ci_evidence/gpu_dmon.log 2>&1 & echo "gpu_pid=$!" >> "$GITHUB_OUTPUT"
          else
            echo "gpu_pid=" >> "$GITHUB_OUTPUT"; echo NVIDIA_SMI_NOT_AVAILABLE > ci_evidence/gpu_dmon.log
          fi

      - name: Run two-generation native R2 V2 equivalence qualification
        id: native
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          RUN: ${{ steps.roots.outputs.run }}
          META: ${{ steps.roots.outputs.meta }}
          PAYLOAD: ${{ steps.roots.outputs.payload }}
        run: |
          set -uo pipefail
          set +e
          /usr/bin/time -v -o ci_evidence/time_verbose.txt \
            "$PY" scripts/run_r2_native_qualification_v2.py \
              --package-root "$PACKAGE_ROOT" \
              --r103-root "$R103_ROOT" \
              --legacy-r104-root "$LEGACY_R104_ROOT" \
              --run-root "$RUN" \
              --metadata-root "$META" \
              --payload-root "$PAYLOAD" \
              --attempts 2 \
              --out ci_evidence/native_result.json \
              2>&1 | tee ci_evidence/native_stdout.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "$rc" > ci_evidence/native_exit_code.txt
          exit 0

      - name: Stop utilization observers
        if: always()
        shell: bash
        env:
          IOPID: ${{ steps.observers.outputs.iostat_pid }}
          GPUPID: ${{ steps.observers.outputs.gpu_pid }}
        run: |
          set +e
          if [ -n "$IOPID" ]; then kill "$IOPID" 2>/dev/null; wait "$IOPID" 2>/dev/null; fi
          if [ -n "$GPUPID" ]; then kill "$GPUPID" 2>/dev/null; wait "$GPUPID" 2>/dev/null; fi
          exit 0

      - name: Materialize compact evidence
        if: always()
        shell: bash
        env:
          RUN: ${{ steps.roots.outputs.run }}
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          if [ -n "${RUN:-}" ] && [ -d "$RUN" ]; then
            for f in \
              PRESTART_ENVIRONMENT_R2.json \
              R2_EXTERNAL_EVIDENCE_CACHE_BINDING.json \
              R2_FROZEN_ADOPTION_REUSE.json \
              PARENT_ADOPTION_RECEIPT_R102.json \
              R2_TRAINING_EVIDENCE_MATERIALIZATION_FIRST.json \
              R2_TRAINING_EVIDENCE_MATERIALIZATION_REPLAY.json \
              FINAL_RESULT_R2_FIRST.json FINAL_RESULT_R2.json; do
              if [ -f "$RUN/$f" ]; then cp "$RUN/$f" "ci_evidence/$f"; fi
            done
            for g in 00 01; do
              if [ -f "$RUN/generations/G$g/GENERATION_RESULT.json" ]; then
                cp "$RUN/generations/G$g/GENERATION_RESULT.json" "ci_evidence/G${g}_GENERATION_RESULT.json"
              fi
            done
          fi
          (cd ci_evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)

      - name: Validate native R2 V2 gates
        if: always()
        shell: bash
        env:
          RC: ${{ steps.native.outputs.exit_code }}
        run: |
          set -euo pipefail
          test -f ci_evidence/native_result.json
          python3 - <<'PY'
          import json, os
          rc=int(os.environ.get('RC') or 255)
          x=json.load(open('ci_evidence/native_result.json'))
          print(json.dumps({
            'exit_code':rc,
            'status':x['status'],
            'first_run_seconds':x['first_run_seconds'],
            'replay_seconds':x['replay_seconds'],
            'first_created_payload_count':x['first_materialization']['created_payload_count'],
            'replay_created_payload_count':x['replay_materialization']['created_payload_count'],
            'generation_equivalence':[g['pass'] for g in x['generation_equivalence']],
            'gate':x['gate'],
            'parent_adoption_reexecuted':x.get('parent_adoption_reexecuted'),
            'package_root_modified':x.get('package_root_modified'),
          },indent=2,sort_keys=True))
          assert rc == 0
          assert x['status']=='PASS'
          assert x['gate']['legacy_scientific_equivalence_pass'] is True
          assert x['gate']['replay_created_zero_new_payloads'] is True
          assert x['gate']['replay_generation_files_byte_identical'] is True
          assert x['gate']['source_legacy_cache_unchanged'] is True
          assert x['gate']['single_hdd_payload_lane'] is True
          assert x['parent_adoption_reexecuted'] is False
          assert x['package_root_modified'] is False
          assert x['canonical_r104_modified'] is False
          assert x['scientific_semantics_changed'] is False
          assert x['final_holdout_2025_09_accessed'] is False
          PY

      - name: Persist sanitized evidence to branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          SNAP="/tmp/cb16-r2-native-v2-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SNAP" && mkdir -p "$SNAP" && cp -a ci_evidence/. "$SNAP"/
          BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          DEST="ci-results/r2-native-v2/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$DEST" && mkdir -p "$DEST" && cp -a "$SNAP"/. "$DEST"/
          git config user.name 'cb16-r2-native-v2-ci'
          git config user.email '37661207+GY-Bai@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "ci-results: R2 native V2 qualification ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Upload native V2 artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r2-native-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup disposable roots
        if: always()
        shell: bash
        env:
          RUN: ${{ steps.roots.outputs.run }}
          PAYLOAD: ${{ steps.roots.outputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${RUN:-}" ]; then
            base="$(dirname "$RUN")"
            case "$base" in /tmp/cb16-r2-native-v2-*) rm -rf "$base" ;; *) echo "REFUSE_RUN_CLEANUP=$base" >&2; exit 77 ;; esac
          fi
          if [ -n "${PAYLOAD:-}" ]; then
            pbase="$(dirname "$PAYLOAD")"
            case "$pbase" in /data/cb16_hdd/cb16_diagnostics/r2_native/native-v2-*) rm -rf "$pbase" ;; *) echo "REFUSE_PAYLOAD_CLEANUP=$pbase" >&2; exit 77 ;; esac
          fi

      - name: Final native R2 V2 gate
        if: always()
        shell: bash
        env:
          RC: ${{ steps.native.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "${RC:-255}" = '0'
          test -f ci_evidence/native_result.json
          python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/native_result.json'))
          assert x['status']=='PASS'
          print('R2_NATIVE_V2_QUALIFICATION=PASS')
          PY
