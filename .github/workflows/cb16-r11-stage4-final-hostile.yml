name: CB16 R11 Stage4 Final Hostile Qualification

on:
  push:
    branches:
      - ai/r11-stage4-final-hostile-r0
    paths:
      - 'cb16_local_opt/stage4_consolidated_hostile_adapter_r11.py'
      - 'tests/test_stage4_consolidated_hostile_adapter_r11.py'
      - '.github/workflows/cb16-r11-stage4-final-hostile.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  hostile:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify branch and Stage4 ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ai/r11-stage4-final-hostile-r0"
          git merge-base --is-ancestor 86a4ac8a9080cd8382600cb998059e9585495a11 HEAD
          test "$(git diff 86a4ac8a9080cd8382600cb998059e9585495a11...HEAD -- authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json | wc -c)" -eq 0

      - name: Resolve verified canonical Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/final_hostile_python.json
          cat ci_evidence/final_hostile_python.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/final_hostile_python.json'))
          assert x['status']=='READY', x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE', x
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          test -x "$PYBIN"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Run real consolidated H01-H20
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_hostile_cutover_r11.py \
            tests/test_stage4_hostile_integration_harness_r11.py \
            tests/test_stage4_consolidated_hostile_adapter_r11.py

      - name: Static authority guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
