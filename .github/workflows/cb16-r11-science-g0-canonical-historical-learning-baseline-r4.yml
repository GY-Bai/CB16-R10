name: CB16 R11 Science G0 Canonical Historical Learning Baseline R4

on:
  push:
    branches:
      - ai/r11-science-g0-canonical-historical-learning-baseline-r4
    paths:
      - authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_CANONICAL_HISTORICAL_LEARNING_BASELINE_R4_GATEWORK_V1.json
      - cb16_local_opt/canonical_historical_learning_baseline_r4.py
      - tests/test_canonical_historical_learning_baseline_r4.py
      - scripts/r11_science_g0_canonical_historical_learning_baseline_r4.py
      - scripts/r11_science_g0_canonical_historical_learning_baseline_r4_entrypoint.py
      - .github/workflows/cb16-r11-science-g0-canonical-historical-learning-baseline-r4.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env
  CB16_PACKAGE_ROOT: /cb16/package

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  canonical-historical-learning-r4:
    name: R11 canonical historical learning baseline R4
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_science_g0_r4_docker_preflight.json"

      - name: Verify R3.4 adjudication and immutable R11 authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5a500e572b20f26bb597db726bb768bb46166c10 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_DISTRIBUTIONAL_BELIEF_DECISION_BRIDGE_R3_4_ADJUDICATION_V1.json)" = "fe4865c5c559f509f0dfbbcff0fc0d059f2b833c"
          test "$(git rev-parse HEAD:cb16_local_opt/typed_central_brain_r10.py)" = "899065a9b9c015fd5a0e24fc919a79ff7d3a67ff"
          test "$(git rev-parse HEAD:cb16_local_opt/training_runtime_r11.py)" = "56c227800d7a5c82ef88c691bb69d7550aee8b39"
          test "$(git rev-parse HEAD:cb16_local_opt/training_integration_r11.py)" = "e604467f4288326f56d1c20dbe2634e442e37a63"
          test "$(git rev-parse HEAD:cb16_local_opt/science_feedback_diagnostics_r11.py)" = "9c9e484deb227c67211d0575eeda4756e2a6e42d"
          test "$(git rev-parse HEAD:cb16_local_opt/probabilistic_teacher_r6.py)" = "3de3092d244c3fd315950c9f8b0bf4d78c50ee2b"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_runtime_r11.py)" = "656f1483f2e6a96daae5c98eb96cd75805d3547c"
          test "$(git rev-parse HEAD:cb16_local_opt/r11_teacher_authority_candidate.py)" = "6e77e8f989a6d4358a7feac99c269db7b7d6549e"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_historical_r1.py)" = "9fcbd58275208423ce2a6bb20ec1c54739c6e17f"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_geometry_r2_1.py)" = "131cc17d983c8daccbc5df919ebee02b3e4f9b05"
          test -f /cb16/g0/authority/CB16_R11_G0_GENESIS_SOURCE_RECORD.json
          test -f /cb16/g0/authority/CB16_R11_G0_DERIVED_CACHE_LINEAGE.json
          test -f /cb16/g0/bootstrap/R11_G0_INITIAL_CHAMPION.pt
          test -d /cb16/g0/market_cache
          test -d /cb16/package

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_science_g0_r4_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          assert p['observed']['python_series'] == [3,10], p
          PY

      - name: Compile and run R4 canonical unit gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_science_g0_r4_python.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/canonical_historical_learning_baseline_r4.py \
            tests/test_canonical_historical_learning_baseline_r4.py \
            scripts/r11_science_g0_canonical_historical_learning_baseline_r4.py \
            scripts/r11_science_g0_canonical_historical_learning_baseline_r4_entrypoint.py
          "$PYTHON" -m pytest -q \
            tests/test_canonical_historical_learning_baseline_r4.py \
            tests/test_training_runtime_r11.py \
            tests/test_training_integration_r11.py \
            tests/test_science_feedback_diagnostics_r11.py \
            tests/test_r11_teacher_balanced_binding.py \
            tests/test_r11_teacher_authority_candidate.py \
            tests/test_teacher_runtime_r11.py \
            tests/test_teacher_vectorized_r11.py

      - name: Execute R4 bounded canonical historical learning
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_science_g0_r4_python.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-science-g0-canonical-historical-learning-baseline-r4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_science_g0_r4_run_root.txt"
          "$PYTHON" scripts/r11_science_g0_canonical_historical_learning_baseline_r4_entrypoint.py \
            --g0-root "$CB16_G0_ROOT" \
            --package-root "$CB16_PACKAGE_ROOT" \
            --work-root "$RUN_ROOT" \
            --output "$RUN_ROOT/CB16_R11_SCIENCE_G0_CANONICAL_HISTORICAL_LEARNING_BASELINE_R4_RESULT.json" \
            --device cuda --symbol BTCUSDT --train-groups 48 --validation-groups 12 \
            --candidate-factor 2 --sensory-batch-size 8 --teacher-workers 4 --teacher-block-targets 32

      - name: Verify R4 receipt
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_science_g0_r4_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_SCIENCE_G0_CANONICAL_HISTORICAL_LEARNING_BASELINE_R4_RESULT.json" <<'PY'
          import json, math, sys
          x=json.load(open(sys.argv[1]))
          assert x['schema'] == 'CB16_R11_SCIENCE_G0_CANONICAL_HISTORICAL_LEARNING_BASELINE_R4_RESULT_V1', x
          assert x['status'] == 'R11_CANONICAL_HISTORICAL_LEARNING_BASELINE_R4_PASS', x
          p=x['protocol']; t=x['challenger']['training_receipt']; s=x['semantic_guards']; r=x['shadow_tournament']
          assert p['epochs'] == 12 and p['batch_size'] == 512, x
          assert p['lr'] == 0.0003 and p['weight_decay'] == 0.0001, x
          assert p['generation_seed'] == 24680 and p['optional_stopping'] is False, x
          assert p['distributional_r3_artifacts_in_gradient_graph'] is False, x
          assert t['optimizer'] == 'AdamW_FP32' and t['amp'] is False and t['dtype'] == 'torch.float32', x
          assert t['optimizer_steps'] > 0 and t['parameter_l2_delta'] > 0.0, x
          assert set(t['gradient_owner_set_last_step']) == {
              'Operator Brain Stem','Medium Brain Stem','Account Brain Stem',
              'Shared Decision Core','Direction Head','Requested-Risk Head'
          }, x
          assert all(math.isfinite(v) and v > 0.0 for v in t['gradient_group_norms_last_step'].values()), x
          assert all(math.isfinite(v) and v > 0.0 for v in t['update_group_norms'].values()), x
          assert r['basis'] == 'FROZEN_VALIDATION_PROBABILISTIC_TEACHER_TARGET_LOSS', x
          assert r['canonical_promotion_authorized'] is False, x
          assert r['canonical_generation_advance_authorized'] is False, x
          assert r['legacy_r10_0_1_percent_threshold_used'] is False, x
          assert s['distributional_r3_modules_loaded'] == [], x
          assert s['distributional_r3_artifacts_in_gradient_graph'] is False, x
          assert s['canonical_generation_advanced'] is False and s['champion_promoted'] is False, x
          assert s['canonical_g0_state_mutated'] is False, x
          assert s['historical_market_information_verdict_reopened'] is False, x
          assert s['scientific_verdict_created'] is False, x
          assert s['final_holdout_payload_opened'] is False, x
          assert s['fresh_market_data_downloaded'] is False, x
          print(json.dumps({
              'status': x['status'],
              'champion_validation_loss': x['champion']['validation']['loss'],
              'challenger_validation_loss': t['validation_after']['loss'],
              'relative_validation_improvement': r['relative_validation_improvement'],
              'direction_loss_delta': r['direction_loss_delta_challenger_minus_champion'],
              'sizing_loss_delta': r['sizing_loss_delta_challenger_minus_champion'],
              'shadow_winner': r['shadow_winner'],
              'optimizer_steps': t['optimizer_steps'],
              'parameter_l2_delta': t['parameter_l2_delta'],
              'learning_direction': x['feedback_diagnostics']['learning_direction'],
              'next_legal_step': x['next_legal_step'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload compact R4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-science-g0-canonical-historical-learning-baseline-r4-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_science_g0_r4_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_science_g0_r4_python.json
            ${{ runner.temp }}/cb16-r11-science-g0-canonical-historical-learning-baseline-r4-${{ github.run_id }}-${{ github.run_attempt }}/CB16_R11_SCIENCE_G0_CANONICAL_HISTORICAL_LEARNING_BASELINE_R4_RESULT.json
            ${{ runner.temp }}/cb16-r11-science-g0-canonical-historical-learning-baseline-r4-${{ github.run_id }}-${{ github.run_attempt }}/CB16_R11_G0_R4_SHADOW_FROZEN_TRAINING_SNAPSHOT.json
            ${{ runner.temp }}/cb16-r11-science-g0-canonical-historical-learning-baseline-r4-${{ github.run_id }}-${{ github.run_attempt }}/R11_G0_R4_SHADOW_CHALLENGER.pt
            ${{ runner.temp }}/cb16-r11-science-g0-canonical-historical-learning-baseline-r4-${{ github.run_id }}-${{ github.run_attempt }}/shadow_training/R11_CHALLENGER_TRAINING_RECEIPT_G0.json
          if-no-files-found: warn
          retention-days: 30
