name: CB16 R11 M-Series H5.11.2 IPF Effective Common Measure R0

on:
  push:
    branches:
      - ai/m-series-h5-11-2-ipf-effective-common-measure-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_2_IPF_EFFECTIVE_COMMON_MEASURE_R0_GATE_V1.json
      - cb16_local_opt/ipf_effective_common_measure_h5112.py
      - tests/test_ipf_effective_common_measure_h5112.py
      - scripts/r11_m_series_h5_11_2_ipf_effective_common_measure_r0.py
      - .github/workflows/cb16-r11-m-series-h5-11-2-ipf-effective-common-measure-r0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  h5-11-2-ipf-effective-common-measure:
    name: H5.11.2 IPF corrected effective common-measure test
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify preregistration authority and immutable scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor dca61e693858d90af785dfb7697d399df4eb65c3 7446e07238e8d2575194b50cf9e8890d08d59607
          git merge-base --is-ancestor 7446e07238e8d2575194b50cf9e8890d08d59607 HEAD
          test "$(git rev-parse 7446e07238e8d2575194b50cf9e8890d08d59607:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_2_IPF_EFFECTIVE_COMMON_MEASURE_R0_GATE_V1.json)" = "92bb7001070e31669f6765dfb05e598926683452"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_2_IPF_EFFECTIVE_COMMON_MEASURE_R0_GATE_V1.json)" = "92bb7001070e31669f6765dfb05e598926683452"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_11_1_EFFECTIVE_MEASURE_CLOSURE_R0_ADJUDICATION_V1.json)" = "d4be3239da97e89b99f9992068ce13490d86cabf"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/common_support_rank_geometry_decomposition_h511.py)" = "918f98d499ff5ed2f36e7d6a6bf3268fca37c27c"
          test "$(git rev-parse HEAD:cb16_local_opt/ipf_effective_common_measure_h5112.py)" = "e23e939fa43208a948ecf9a3a108fea1831777ce"
          test "$(git rev-parse HEAD:tests/test_ipf_effective_common_measure_h5112.py)" = "0c2abc3e15df5dca07766daa5efc7cfdc6f671fd"
          test "$(git rev-parse HEAD:scripts/r11_m_series_h5_11_2_ipf_effective_common_measure_r0.py)" = "940caa338256fe65b7b648ff8430e64428e89381"
          test "$(git rev-parse HEAD:cb16_local_opt/medium48_temporal_halfblock_stability_h510.py)" = "176983eb0f7beb6396823126f4bc1504c4418054"
          test "$(git rev-parse HEAD:cb16_local_opt/operator_conditional_medium_geometry_h58.py)" = "aaddbad059c7262a8137db87bee25d38c07afd83"
          test "$(git rev-parse HEAD:cb16_local_opt/time_local_vs_forward_geometry_contrast_h56.py)" = "a264ff21d0447527c4dda06ee8fd63cf20207daf"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55.py)" = "1dd00ea9b40b8da4061c0983fc44fb2307c72587"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55_clarified.py)" = "faa5233170aa421c3bf44f023b1d8e2f7c187568"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_temporal_transport_audit_h5.py)" = "09b05de23c659fe6f47a43117ec70b5cafcf7d21"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_vectorized_r11.py)" = "083ca6541b45577cfeb6d9a376b25e0eaf8d060a"
          test "$(git rev-parse HEAD:cb16_local_opt/r102_evidence_cache.py)" = "91fb73565ec60f66bf4232957f9b9b2f88cc3cfe"
          test "$(git rev-parse HEAD:cb16_local_opt/reduced_teacher_target_information_audit_r6.py)" = "bd7a8780e8dcab05cfae92744fde523ce62cc9ae"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_h5112_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_h5112_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run H5.11.2 unit and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h5112_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/ipf_effective_common_measure_h5112.py \
            tests/test_ipf_effective_common_measure_h5112.py \
            scripts/r11_m_series_h5_11_2_ipf_effective_common_measure_r0.py
          "$PYTHON" -m pytest -q \
            tests/test_ipf_effective_common_measure_h5112.py \
            tests/test_h511_effective_measure_closure_h5111.py \
            tests/test_common_support_rank_geometry_decomposition_h511.py \
            tests/test_medium48_strict_clock_halfblock_replication_h5101.py \
            tests/test_medium48_temporal_halfblock_stability_h510.py \
            tests/test_medium48_antialignment_breadth_h59.py \
            tests/test_operator_conditional_medium_geometry_h58.py \
            tests/test_medium48_relational_composition_falsification_h57.py \
            tests/test_time_local_vs_forward_geometry_contrast_h56.py \
            tests/test_state_utility_geometry_transport_audit_h55.py \
            tests/test_state_utility_geometry_transport_audit_h55_clarified.py \
            tests/test_teacher_temporal_transport_audit_h5.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_independent_purge_alignment_replication_r5.py \
            tests/test_r11_teacher_balanced_binding.py

      - name: Execute preregistered H5.11.2 IPF corrected standardization
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h5112_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-h5112-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_h5112_run_root.txt"
          "$PYTHON" -m scripts.r11_m_series_h5_11_2_ipf_effective_common_measure_r0 \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_H5_11_2_IPF_EFFECTIVE_COMMON_MEASURE_R0_RESULT.json"

      - name: Verify H5.11.2 receipt and authority guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_h5112_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_H5_11_2_IPF_EFFECTIVE_COMMON_MEASURE_R0_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_H5_11_2_IPF_EFFECTIVE_COMMON_MEASURE_R0_RESULT_V1',x
          assert x['status']=='H5_11_2_IPF_EFFECTIVE_COMMON_MEASURE_EXECUTION_COMPLETE',x
          assert x['repo']['preregistration_commit']=='7446e07238e8d2575194b50cf9e8890d08d59607',x['repo']
          assert x['repo']['immutable_blobs']['gate']=='92bb7001070e31669f6765dfb05e598926683452',x['repo']
          assert x['repo']['immutable_blobs']['parent_adjudication']=='d4be3239da97e89b99f9992068ce13490d86cabf',x['repo']
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          r=x['h5_11_sibling_reproduction']
          assert r['passed'] is True,r
          assert r['max_aligned_abs_error']<=1e-12,r
          assert r['max_null_median_abs_error']<=1e-12,r
          assert len(x['pair_results'])==4,x
          for p in x['pair_results']:
              assert p['exact_effective_margin_closure'] is True,p
              assert p['calibration']['side_a']['converged'] is True,p
              assert p['calibration']['side_b']['converged'] is True,p
              assert p['side_a']['effective_max_abs_error_vs_q']<=1e-12,p
              assert p['side_b']['effective_max_abs_error_vs_q']<=1e-12,p
              assert p['effective_side_to_side_max_abs']<=2e-12,p
              assert p['side_a']['same_aligned_candidate_weights_used_for_all_nulls'] is True,p
              assert p['side_b']['same_aligned_candidate_weights_used_for_all_nulls'] is True,p
          s=x['summary']
          assert s['classification'] in {
              'EXACT_MACRO_CELL_OCCUPANCY_STANDARDIZATION__NATIVE_TRANSITIONS_PERSIST',
              'EXACT_MACRO_CELL_OCCUPANCY_STANDARDIZATION__NATIVE_TRANSITIONS_REMOVED',
              'EXACT_MACRO_CELL_OCCUPANCY_STANDARDIZATION__MIXED',
          },s
          assert s['global_max_abs_effective_side_vs_q']<=1e-12,s
          assert s['global_max_abs_effective_side_to_side']<=2e-12,s
          assert s['market_information_verdict_changed'] is False,s
          assert s['canonical_change_authorized'] is False,s
          assert s['h5_12_execution_authorized'] is False,s
          g=x['semantic_guards']
          assert g['h5_11_q_changed_or_tuned'] is False,g
          assert g['h5_11_grid_changed'] is False and g['h5_11_support_changed'] is False,g
          assert g['h5_11_normalization_changed'] is False and g['h5_11_distance_metric_changed'] is False,g
          assert g['h5_11_primary_statistic_changed'] is False and g['h5_11_structured_null_changed'] is False,g
          assert g['account6_extension_executed'] is False and g['h5_12_executed'] is False,g
          assert g['teacher_changed'] is False and g['student_changed'] is False and g['canonical_architecture_changed'] is False,g
          assert g['learned_router_or_gate_created'] is False and g['time_or_regime_gate_created'] is False,g
          assert g['calendar_or_fold_id_used_as_runtime_feature'] is False,g
          assert g['fresh_market_data_downloaded'] is False and g['final_holdout_payload_opened'] is False,g
          assert g['r7_candidate_evaluated'] is False and g['champion_promoted'] is False,g
          print(json.dumps({
              'status':x['status'],
              'classification':s['classification'],
              'native_flip_persistence_count_of_3':s['native_flip_persistence_count_of_3'],
              'native_flip_clean_removal_count_of_3':s['native_flip_clean_removal_count_of_3'],
              'positive_control_pair_stable':s['positive_control_pair_stable'],
              'global_max_abs_effective_side_vs_q':s['global_max_abs_effective_side_vs_q'],
              'global_max_abs_effective_side_to_side':s['global_max_abs_effective_side_to_side'],
              'max_ipf_iterations':s['max_ipf_iterations'],
              'max_multiplier_max_to_min_ratio':s['max_multiplier_max_to_min_ratio'],
              'next_legal_step':x['next_legal_step'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload H5.11.2 evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-h5-11-2-ipf-effective-common-measure-r0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_h5112_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_h5112_python.json
            ${{ runner.temp }}/cb16-r11-m-series-h5112-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
