name: CB16 R11 M-Series H5.6 Authority Repair Replay R0

on:
  push:
    branches:
      - ai/m-series-h5-6-authority-repair-replay-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_6_TIME_LOCAL_VS_FORWARD_STATE_UTILITY_GEOMETRY_CONTRAST_R0_GATE_V1.json
      - scripts/r11_m_series_h5_6_time_local_vs_forward_geometry_contrast_r0.py
      - .github/workflows/cb16-r11-m-series-h5-6-authority-repair-replay-r0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  h5-6-authority-repair-replay:
    name: H5.6 exact-authority Student-free Teacher-free replay
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact original preregistration authority and frozen implementation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8dc374cae5dc08d3e879779fcabb86e0b390eff6 HEAD
          test "$(git rev-parse 8dc374cae5dc08d3e879779fcabb86e0b390eff6:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_6_TIME_LOCAL_VS_FORWARD_STATE_UTILITY_GEOMETRY_CONTRAST_R0_GATE_V1.json)" = "922de652a2218f295d49f5dba6d030cec965152e"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_6_TIME_LOCAL_VS_FORWARD_STATE_UTILITY_GEOMETRY_CONTRAST_R0_GATE_V1.json)" = "922de652a2218f295d49f5dba6d030cec965152e"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_5_STATE_UTILITY_GEOMETRY_TRANSPORT_AUDIT_R0_ADJUDICATION_V1.json)" = "c336e2789ba41e2131679abcd1e6d51c1b545a1c"
          test "$(git rev-parse HEAD:cb16_local_opt/time_local_vs_forward_geometry_contrast_h56.py)" = "a264ff21d0447527c4dda06ee8fd63cf20207daf"
          test "$(git rev-parse HEAD:tests/test_time_local_vs_forward_geometry_contrast_h56.py)" = "dec7653d1495dc30f60cc9aa5aabff9495bc0845"
          test "$(git rev-parse HEAD:scripts/r11_m_series_h5_6_time_local_vs_forward_geometry_contrast_r0.py)" = "2fba8cea028fd40290fd80362387949b81f740e0"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55.py)" = "1dd00ea9b40b8da4061c0983fc44fb2307c72587"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55_clarified.py)" = "faa5233170aa421c3bf44f023b1d8e2f7c187568"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_temporal_transport_audit_h5.py)" = "09b05de23c659fe6f47a43117ec70b5cafcf7d21"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_vectorized_r11.py)" = "083ca6541b45577cfeb6d9a376b25e0eaf8d060a"
          test "$(git rev-parse HEAD:cb16_local_opt/r102_evidence_cache.py)" = "91fb73565ec60f66bf4232957f9b9b2f88cc3cfe"
          test "$(git rev-parse HEAD:cb16_local_opt/reduced_teacher_target_information_audit_r6.py)" = "bd7a8780e8dcab05cfae92744fde523ce62cc9ae"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_h56_replay_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_h56_replay_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run H5.6 unit and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h56_replay_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/time_local_vs_forward_geometry_contrast_h56.py \
            tests/test_time_local_vs_forward_geometry_contrast_h56.py \
            scripts/r11_m_series_h5_6_time_local_vs_forward_geometry_contrast_r0.py
          "$PYTHON" -m pytest -q \
            tests/test_time_local_vs_forward_geometry_contrast_h56.py \
            tests/test_state_utility_geometry_transport_audit_h55.py \
            tests/test_state_utility_geometry_transport_audit_h55_clarified.py \
            tests/test_teacher_temporal_transport_audit_h5.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_independent_purge_alignment_replication_r5.py \
            tests/test_r11_teacher_balanced_binding.py

      - name: Execute unchanged preregistered H5.6 geometry contrast
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h56_replay_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-h56-authority-replay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_h56_replay_run_root.txt"
          "$PYTHON" -m scripts.r11_m_series_h5_6_time_local_vs_forward_geometry_contrast_r0 \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_H5_6_TIME_LOCAL_VS_FORWARD_STATE_UTILITY_GEOMETRY_CONTRAST_R0_RESULT.json"

      - name: Verify replay receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_h56_replay_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_H5_6_TIME_LOCAL_VS_FORWARD_STATE_UTILITY_GEOMETRY_CONTRAST_R0_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_H5_6_TIME_LOCAL_VS_FORWARD_STATE_UTILITY_GEOMETRY_CONTRAST_R0_RESULT_V1',x
          assert x['status']=='H5_6_TIME_LOCAL_VS_FORWARD_STATE_UTILITY_GEOMETRY_CONTRAST_COMPLETE',x
          assert x['repo']['preregistration_commit']=='8dc374cae5dc08d3e879779fcabb86e0b390eff6',x['repo']
          assert x['repo']['immutable_blobs']['gate']=='922de652a2218f295d49f5dba6d030cec965152e',x['repo']
          assert x['repo']['immutable_blobs']['h56_helper']=='a264ff21d0447527c4dda06ee8fd63cf20207daf',x['repo']
          assert x['forward_h5_5_authority_reproduction']['status']=='PASS',x
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert len(x['folds'])==5,x
          for f in x['folds']:
              assert f['teacher_compilation_used'] is False and f['teacher_kernel_used'] is False and f['teacher_support_selection_used'] is False,f
              assert f['local_support_rule']=='SAME_EVAL_BLOCK_OTHER_FUTURE_GROUPS_SAME_SCENARIO_TARGET_GROUP_EXCLUDED',f
              assert f['local_normalization_rule']=='EXACT_SAME_SCENARIO_LOCAL_SUPPORT_ROWS_TARGET_GROUP_EXCLUDED',f
              for rr in f['rotation_receipts'].values():
                  assert rr['target_feature_multiset_preserved'] is True and rr['train_features_byte_identical'] is True and rr['scenario_identity_preserved'] is True,rr
              for name,m in f['local_state_metrics'].items():
                  assert int(m['local_support_future_groups_min'])>=32,(name,m)
                  assert int(m['local_support_future_groups_min'])==int(m['local_support_future_groups_max']),(name,m)
                  assert m['target_future_group_excluded'] is True,m
                  assert m['normalization_rows_equal_same_scenario_support_rows'] is True,m
                  assert m['utility_used_to_select_support'] is False,m
                  assert math.isfinite(float(m['aligned_centered_profile_spearman_rho'])),m
          s=x['h5_6_summary']
          assert s['classification'] in {
              'TIME_LOCAL_MARKET_GEOMETRY_EXISTS__CROSS_TIME_NONTRANSFER_SUPPORTED',
              'TIME_LOCAL_OPERATOR_GEOMETRY_EXISTS__MEDIUM48_DEGRADES_CROSS_TIME_COMPOSITION',
              'STATE_UTILITY_GEOMETRY_WEAK_EVEN_TIME_LOCAL',
              'LOCAL_VS_FORWARD_GEOMETRY_MIXED_UNRESOLVED',
          },s
          assert s['all_rotation_identity_guards_pass'] is True,s
          assert s['market_information_verdict'] is False and s['canonical_change_authorized'] is False,s
          assert s['teacher_change_authorized'] is False and s['student_change_authorized'] is False,s
          g=x['semantic_guards']
          assert g['teacher_compiled_for_scientific_score'] is False and g['teacher_kernel_used'] is False and g['teacher_support_selection_used'] is False,g
          assert g['future_utility_used_to_select_local_support'] is False and g['utility_outcomes_rotated_with_features'] is False,g
          assert g['organ_weights_tuned'] is False and g['distance_metric_tuned'] is False,g
          assert g['final_holdout_payload_opened'] is False and g['r7_candidate_evaluated'] is False,g
          print(json.dumps({
              'status':x['status'],
              'classification':s['classification'],
              'conclusion':s['conclusion'],
              'forward_reproduction':x['forward_h5_5_authority_reproduction']['status'],
              'local_metric_gates':s['local_metric_gates'],
              'local_vs_forward_contrast':s['local_vs_forward_contrast'],
              'next_legal_step':x['next_legal_step'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload exact-authority H5.6 replay evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-h5-6-authority-repair-replay-r0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_h56_replay_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_h56_replay_python.json
            ${{ runner.temp }}/cb16-r11-m-series-h56-authority-replay-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
