name: CB16 R11 Task F Integration Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r11-task-f-integration-r0
    paths:
      - .github/cb16-r11-task-f-trigger.json

permissions:
  contents: read

concurrency:
  group: cb16-r11-task-f-integration-acceptance
  cancel-in-progress: false

jobs:
  task-f:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 120
    env:
      PACKAGE_ROOT: /data/cb16_ci/r2-authority/package_r102
      LEGACY_R104_ROOT: /data/cb16_hdd/cb16_runtime/R10_4
      TEACHER_CACHE_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native/compiled_teacher_authority
      R11_DIAG_ROOT: /data/cb16_hdd/cb16_diagnostics/r2_native
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
    steps:
      - name: Checkout Task F source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify read-only scientific authorities
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PACKAGE_ROOT"
          test -d "$LEGACY_R104_ROOT/evidence_cache"
          test -d "$TEACHER_CACHE_ROOT"
          pkg_opts="$(findmnt -n -o OPTIONS -T "$PACKAGE_ROOT")"
          r104_opts="$(findmnt -n -o OPTIONS -T "$LEGACY_R104_ROOT")"
          case ",$pkg_opts," in *,ro,*) ;; *) echo "PACKAGE_AUTHORITY_NOT_RO=$pkg_opts" >&2; exit 74 ;; esac
          case ",$r104_opts," in *,ro,*) ;; *) echo "R104_AUTHORITY_NOT_RO=$r104_opts" >&2; exit 74 ;; esac
          active="$(ps -eo pid=,comm=,args= | awk '$2 ~ /^python/ && $0 ~ /scripts\/run_r104_long_research\.py/ {print}' || true)"
          if [ -n "$active" ]; then
            echo 'ACTIVE_LEGACY_R104_PROCESS_REFUSED' >&2
            echo "$active" >&2
            exit 75
          fi
          echo 'R11_TASK_F_READ_ONLY_AUTHORITY_BOUNDARY=PASS'

      - name: Reuse verified canonical R10.4 Python and Pascal runtime
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          test -x "$PYBIN"
          "$PYBIN" - <<'PY'
          import numpy, torch, pytest, threadpoolctl
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0)) == (6, 1)
          assert all(p.dtype == torch.float32 for p in [torch.nn.Parameter(torch.zeros(1, device='cuda'))])
          print('TORCH=' + torch.__version__)
          print('NUMPY=' + numpy.__version__)
          print('PYTEST=' + pytest.__version__)
          print('GPU=' + torch.cuda.get_device_name(0))
          print('CAPABILITY=' + str(torch.cuda.get_device_capability(0)))
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Prepare disposable Task F roots
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$R11_DIAG_ROOT/r11-task-f-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$ROOT"
          mkdir -p "$ROOT" ci_evidence
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Static integration and Semantic Freeze gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" -m py_compile \
            cb16_local_opt/teacher_vectorized_r11.py \
            cb16_local_opt/teacher_scheduler_r11.py \
            cb16_local_opt/teacher_runtime_r11.py \
            cb16_local_opt/training_runtime_r11.py \
            cb16_local_opt/market_runtime_cache_r11.py \
            cb16_local_opt/trace_runtime_r11.py \
            cb16_local_opt/evidence_store_r11.py \
            cb16_local_opt/event_journal_r11.py \
            cb16_local_opt/checkpoint_store_r11.py \
            cb16_local_opt/runtime_events_r11.py \
            cb16_local_opt/runtime_protocols_r11.py \
            cb16_local_opt/orchestrator_r11.py \
            cb16_local_opt/integration_adapters_r11.py \
            scripts/run_r11_task_f_acceptance.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root . | tee ci_evidence/semantic_freeze.log

      - name: Run full A-E and Task F integrated fault tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_teacher_vectorized_r11.py \
            tests/test_teacher_runtime_r11.py \
            tests/test_training_runtime_r11.py \
            tests/test_r11_trace_runtime.py \
            tests/test_r11_evidence_store.py \
            tests/test_r11_event_journal.py \
            tests/test_r11_checkpoint_store.py \
            tests/test_r11_storage_lifecycle.py \
            tests/test_r11_async_orchestrator.py \
            tests/test_r11_task_f_integration.py \
            2>&1 | tee ci_evidence/integrated_tests.log

      - name: Benchmark real R10.4 Teacher topology
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" scripts/run_r11_teacher_topology_benchmark.py \
            --legacy-r104-root "$LEGACY_R104_ROOT" \
            --out ci_evidence/teacher_topology.json \
            2>&1 | tee ci_evidence/teacher_topology.log

      - name: Run real frozen-stack Task F acceptance
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
          WORK: ${{ steps.roots.outputs.root }}
        run: |
          set -euo pipefail
          BEST="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/teacher_topology.json'))
          assert x['status']=='PASS'
          assert x['evidence_hash_identical_across_all_runs'] is True
          print(x['best_workers_by_median'])
          PY
          )"
          /usr/bin/time -v -o ci_evidence/task_f_time_verbose.txt \
            "$PY" scripts/run_r11_task_f_acceptance.py \
              --package-root "$PACKAGE_ROOT" \
              --legacy-r104-root "$LEGACY_R104_ROOT" \
              --teacher-cache-root "$TEACHER_CACHE_ROOT" \
              --work-root "$WORK/acceptance" \
              --teacher-workers "$BEST" \
              --trace-workers 8 \
              --out ci_evidence/task_f_acceptance.json \
              2>&1 | tee ci_evidence/task_f_acceptance.log

      - name: Final Task F gate
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import json
          t=json.load(open('ci_evidence/teacher_topology.json'))
          x=json.load(open('ci_evidence/task_f_acceptance.json'))
          assert t['status']=='PASS'
          assert t['evidence_hash_identical_across_all_runs'] is True
          assert x['status']=='PASS'
          assert x['scientific_semantics_changed'] is False
          assert x['teacher']['train']['pass'] is True
          assert x['teacher']['validation']['pass'] is True
          assert x['training']['state_equivalence']['pass'] is True
          assert x['training']['behavior_sha_equal'] is True
          assert x['trace']['receipt_exact_equal'] is True
          assert x['storage']['replay']['created_payload_count'] == 0
          assert x['storage']['replay']['created_evidence_count'] == 0
          assert x['checkpoint_orchestrator']['durable_recovery_equal'] is True
          assert x['frozen_authority_unchanged'] is True
          assert all(v is False for v in x['forbidden_work'].values())
          print('CB16_R11_TASK_F_INTEGRATION_ACCEPTANCE=PASS')
          print('BEST_TEACHER_WORKERS=' + str(t['best_workers_by_median']))
          PY

      - name: Upload Task F evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cb16-r11-task-f-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_evidence
          retention-days: 30

      - name: Cleanup disposable Task F root
        if: always()
        shell: bash
        env:
          WORK: ${{ steps.roots.outputs.root }}
        run: |
          set +e
          if [ -n "${WORK:-}" ]; then rm -rf "$WORK"; fi
          exit 0
