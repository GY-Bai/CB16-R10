name: CB16 UV Host Environment Download Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - ai/r2-evidence-storage-r0
    paths:
      - .github/cb16-uv-host-env-download-trigger.json

permissions:
  contents: write

concurrency:
  group: cb16-uv-host-env-download-qualification
  cancel-in-progress: false

jobs:
  uv-host-env-download:
    runs-on: [self-hosted, shanxi, cb16-r10-canonical]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Syntax and no-channel lint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            provision/scripts/provision_python.py \
            ci/resolve_verified_r104_python.py \
            ci/qualify_uv_host_env_download.py \
            tests/test_provision_mirror_routing.py
          python3 -m unittest tests.test_provision_mirror_routing -v
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for name in ('requirements-shanxi-pascal.txt','requirements-ci-runtime.txt'):
              for n,line in enumerate(Path(name).read_text().splitlines(),1):
                  s=line.strip().lower()
                  if s and not s.startswith('#') and (s.startswith(('--index-url','--extra-index-url','--find-links','-i ')) or '://' in s):
                      bad.append(f'{name}:{n}')
          assert not bad, 'REPOSITORY_PACKAGE_CHANNEL_FORBIDDEN:' + ','.join(bad)
          print('NO_REPOSITORY_PACKAGE_CHANNEL_LINT=PASS')
          PY

      - name: Verify canonical version reference without SHA package gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/canonical_version_reference.json
          python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/canonical_version_reference.json'))
          assert x['status']=='READY'
          assert x['python']['package_hash_validation_used'] is False
          assert x['python']['direct_package_versions']['all_requirements_satisfied'] is True
          print('CANONICAL_VERSION_REFERENCE=PASS')
          PY

      - name: Check disposable disk capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h /tmp
          avail_kb="$(df -Pk /tmp | awk 'NR==2{print $4}')"
          test "$avail_kb" -ge 8388608

      - name: Full UV download and install through host environment only
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/cb16-uv-host-env-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$ROOT"
          mkdir -p "$ROOT" ci_evidence
          python3 ci/qualify_uv_host_env_download.py \
            --root "$ROOT" \
            --out ci_evidence/uv_host_env_download_result.json
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate UV result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/uv_host_env_download_result.json'))
          assert x['status']=='PASS'
          assert x['network_download_exercised'] is True
          assert x['repository_selected_channel_arguments'] is False
          assert x['install_command_has_url_or_channel_flag'] is False
          assert x['direct_package_versions_exact_match'] is True
          assert x['package_hash_validation_used'] is False
          assert x['cuda_import_canary_rc']==0
          print('UV_HOST_ENV_DOWNLOAD_QUALIFICATION=PASS')
          PY

      - name: Persist qualification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SNAP="/tmp/cb16-uv-host-env-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$SNAP" && mkdir -p "$SNAP"
          cp -a ci_evidence/. "$SNAP"/
          BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          DEST="ci-results/uv-host-env/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp -a "$SNAP"/. "$DEST"/
          git config user.name 'cb16-uv-host-env-ci'
          git config user.email '37661207+GY-Bai@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "ci-results: UV host-env qualification ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Cleanup disposable UV environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.qualify.outputs.root }}"
          if [ -n "$ROOT" ]; then
            case "$ROOT" in /tmp/cb16-uv-host-env-*) rm -rf "$ROOT" ;; *) exit 77 ;; esac
          fi
