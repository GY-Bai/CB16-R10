name: CB16 Package Channel Policy

on:
  push:
    paths:
      - 'requirements*.txt'
      - 'provision/environments/**'
      - 'provision/scripts/provision_python.py'
      - 'ci/resolve_verified_r104_python.py'
      - 'tests/test_provision_mirror_routing.py'
      - '.github/workflows/cb16-package-channel-policy.yml'
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'provision/environments/**'
      - 'provision/scripts/provision_python.py'
      - 'ci/resolve_verified_r104_python.py'
      - 'tests/test_provision_mirror_routing.py'
      - '.github/workflows/cb16-package-channel-policy.yml'

permissions:
  contents: read

jobs:
  no-repository-selected-package-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Static channel lint and policy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile provision/scripts/provision_python.py ci/resolve_verified_r104_python.py tests/test_provision_mirror_routing.py
          python3 -m unittest tests.test_provision_mirror_routing -v
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for path in sorted(Path('.').glob('requirements*.txt')):
              for n,line in enumerate(path.read_text().splitlines(),1):
                  s=line.strip().lower()
                  if not s or s.startswith('#'):
                      continue
                  if s.startswith(('--index-url','--extra-index-url','--find-links','-i ')) or '://' in s:
                      bad.append(f'{path}:{n}')
          if bad:
              raise SystemExit('REPOSITORY_PACKAGE_CHANNEL_FORBIDDEN:' + ','.join(bad))

          import sys
          sys.path.insert(0, str(Path('provision/scripts').resolve()))
          import provision_python as pp
          cmd=pp._uv_install_command(Path('/tmp/venv/bin/python'), [Path('requirements-shanxi-pascal.txt'),Path('requirements-ci-runtime.txt')])
          pp._assert_no_channel_args(cmd)
          print('PACKAGE_CHANNEL_POLICY=PASS')
          print('ROUTING_OWNER=HOST_ENVIRONMENT_AND_LOCAL_PROXY')
          print('PACKAGE_HASH_VALIDATION_POLICY=DISABLED')
          PY
