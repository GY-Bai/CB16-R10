name: CB16 R11 Stage4 S4F State Roots

on:
  push:
    branches:
      - ai/r11-stage4-task-f-state-roots-r0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4f-unit-and-gatework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Stage4 Gatework and S4F tests
        run: python -m pytest -q tests/test_stage4_gatework_r11.py tests/test_stage4_state_roots_r11.py
      - name: Static semantic authority guard
        run: python -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .
      - name: Validate S4F receipt when present
        shell: bash
        run: |
          receipt=authority/rearchitecture_r11/stage4_receipts/S4F_RECEIPT_V1.json
          if [[ -f "$receipt" ]]; then
            python scripts/check_r11_stage4_task_receipt.py --receipt "$receipt" --repo-root .
          else
            echo "S4F receipt not present yet; implementation-head run only."
          fi
