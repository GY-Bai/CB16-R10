name: CB16 R11 M-Series M2 Frozen G0 Direction Residual

on:
  push:
    branches:
      - ai/m-series-m2-implementation-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M2_FROZEN_G0_DIRECTION_RESIDUAL_GATE_V1.json
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M1_DIRECTION_RELATIVE_SUFFICIENCY_ADJUDICATION_V1.json
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_ADJUDICATION_V1.json
      - cb16_local_opt/m_series_m2_frozen_g0_direction_residual.py
      - tests/test_m_series_m2_frozen_g0_direction_residual.py
      - scripts/r11_m_series_m2_frozen_g0_direction_residual.py
      - scripts/r11_m_series_m2_frozen_g0_direction_residual_entrypoint.py
      - .github/workflows/cb16-r11-m-series-m2-frozen-g0-direction-residual.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env
  CB16_PACKAGE_ROOT: /cb16/package

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  m2-frozen-g0-direction-residual:
    name: M2 frozen-G0 Direction residual matched arms
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable M2 preregistration and frozen science ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 62ad74a0c62ab616dfceaf70c6f7b30f7088c81f HEAD
          git merge-base --is-ancestor 27a06659a09e75f3fcf49351f174ab115bd3c564 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M2_FROZEN_G0_DIRECTION_RESIDUAL_GATE_V1.json)" = "8c80273998f33821514c75c774e21649e08dfd43"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M1_DIRECTION_RELATIVE_SUFFICIENCY_ADJUDICATION_V1.json)" = "e814c0cd3f3f9556b9477107d2f0cb00905220fb"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_ADJUDICATION_V1.json)" = "54174f86fee2ae0da5c1813af44fa84fe82962db"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_REDUCED_TEACHER_TARGET_INFORMATION_AUDIT_R6_GATE_V1.json)" = "1d1254fb03cc00283423426e07ae240a196c627e"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/training_runtime_r11.py)" = "56c227800d7a5c82ef88c691bb69d7550aee8b39"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_runtime_r11.py)" = "656f1483f2e6a96daae5c98eb96cd75805d3547c"
          test -f "$CB16_G0_ROOT/bootstrap/R11_G0_INITIAL_CHAMPION.pt"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"
          test -d "$CB16_PACKAGE_ROOT"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_m2_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_m2_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run M2 unit and regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_m2_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/m_series_m2_frozen_g0_direction_residual.py \
            tests/test_m_series_m2_frozen_g0_direction_residual.py \
            scripts/r11_m_series_m2_frozen_g0_direction_residual.py \
            scripts/r11_m_series_m2_frozen_g0_direction_residual_entrypoint.py
          "$PYTHON" -m pytest -q \
            tests/test_m_series_m2_frozen_g0_direction_residual.py \
            tests/test_m_series_m1_direction_relative_sufficiency.py \
            tests/test_m_series_m0_policy_drift_attribution.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_canonical_state_alignment_falsification_r41.py \
            tests/test_training_runtime_r11.py \
            tests/test_r11_teacher_balanced_binding.py \
            tests/test_teacher_runtime_r11.py

      - name: Execute preregistered M2 matched-arm experiment
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_m2_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-m2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_m2_run_root.txt"
          "$PYTHON" scripts/r11_m_series_m2_frozen_g0_direction_residual_entrypoint.py \
            --g0-root "$CB16_G0_ROOT" \
            --package-root "$CB16_PACKAGE_ROOT" \
            --r104-root "$CB16_R104_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_M2_FROZEN_G0_DIRECTION_RESIDUAL_RESULT.json" \
            --device cuda

      - name: Verify M2 receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_m2_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_M2_FROZEN_G0_DIRECTION_RESIDUAL_RESULT.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_M2_FROZEN_G0_DIRECTION_RESIDUAL_RESULT_V1',x
          assert x['status']=='M2_FROZEN_G0_DIRECTION_RESIDUAL_EXECUTION_COMPLETE',x
          assert x['frozen_scientific_status_before']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert x['frozen_scientific_status_after']==x['frozen_scientific_status_before'],x
          p=x['protocol']
          assert p['g0_parameters_frozen']==189052,p
          assert p['residual_parameters_trainable']==16643,p
          assert p['sizing_in_gradient_graph'] is False,p
          assert p['r7_candidate_evaluated'] is False,p
          assert p['final_holdout_opened'] is False and p['fresh_market_data'] is False,p
          assert p['same_minibatch_permutations_across_matched_arms'] is True,p
          assert len(x['fold_results'])==5,x
          shifts=(1,7,13,23,31)
          expected={'ABS_CE_ALIGNED','SELECTIVE_ALIGNED'}
          expected |= {f'ABS_CE_SHUFFLE_{s}' for s in shifts}
          expected |= {f'SELECTIVE_SHUFFLE_{s}' for s in shifts}
          for f in x['fold_results']:
              assert f['fold'] in (1,2,3,4,5),f
              assert f['residual_parameter_count']==16643,f
              assert set(f['arms'])==expected,f
              for name,arm in f['arms'].items():
                  assert arm['g0_gradient_parameters']==0,arm
                  assert arm['sizing_gradient_parameters']==0,arm
                  tr=arm['training']
                  assert tr['optimizer']=='AdamW_FP32',tr
                  assert tr['epochs']==12 and tr['batch_size']==512,tr
                  assert tr['lr']==0.0003 and tr['weight_decay']==0.0001,tr
                  assert tr['base_seed']==24680,tr
                  assert tr['optimizer_steps']>0,tr
                  assert tr['initial_g0_policy_max_abs_error'] <= 1e-7,tr
                  assert math.isfinite(float(tr['residual_parameter_l2'])),tr
                  ev=arm['evaluation']
                  for k in (
                      'discrete_champion_relative_gain','discrete_teacher_regret',
                      'soft_expected_champion_relative_gain','negative_gain_rate',
                      'teacher_g0_agreement_change_rate','teacher_g0_disagreement_move_to_teacher_rate',
                      'direction_change_rate','direction_ce_to_aligned_eval_teacher',
                      'jensen_shannon_divergence_vs_g0','residual_delta_logit_l2_mean',
                  ):
                      assert ev[k] is not None and math.isfinite(float(ev[k])),(name,k,ev)
                  cr=arm['control_receipt']
                  if 'SHUFFLE_' in name:
                      assert cr['target_multiset_exactly_preserved'] is True,cr
                      assert cr['scenario_identity_preserved'] is True,cr
                      assert cr['input_features_byte_identical'] is True,cr
                      assert cr['group_weights_byte_identical'] is True,cr
                      rr=cr['rich_surface_rotation']
                      assert rr['teacher_surface_multiset_preserved'] is True,rr
                      assert rr['same_donor_mapping_as_reduced_targets'] is True,rr
          s=x['m2_summary']
          assert s['selective_alignment_conclusion'] in {
              'FROZEN_G0_SELECTIVE_RESIDUAL_EXTRACTS_ALIGNMENT_SPECIFIC_DIRECTION_GAIN_ON_CONSUMED_TRAIN_ONLY_SUPPORT',
              'FROZEN_G0_SELECTIVE_RESIDUAL_ALIGNMENT_SPECIFIC_GAIN_NOT_ESTABLISHED',
          },s
          assert s['preservation_conclusion'] in {
              'SELECTIVE_CHAMPION_PRESERVE_OBJECTIVE_REDUCES_UNNECESSARY_DIRECTION_DRIFT_VS_ABSOLUTE_CE',
              'SELECTIVE_CHAMPION_PRESERVE_OBJECTIVE_DOES_NOT_RELIABLY_REDUCE_AGREEMENT_STATE_DRIFT_VS_ABSOLUTE_CE',
          },s
          assert s['market_information_verdict'] is False,s
          assert s['canonical_promotion_authorized'] is False,s
          g=x['semantic_guards']
          for k in ('canonical_generation_advanced','champion_promoted','production_cutover','market_information_verdict_reopened','profitability_or_alpha_claimed','r7_candidate_evaluated','final_holdout_payload_opened','fresh_market_data_downloaded','r5_purge_support_reopened','legacy_validation_rows_used','raw_market_payload_used'):
              assert g[k] is False,(k,g)
          assert g['g0_trainable_parameters']==0,g
          assert g['sizing_gradient_parameters']==0,g
          assert g['teacher_future_physics_gradient_parameters']==0,g
          assert g['frozen_package_unchanged'] is True and g['g0_authority_unchanged'] is True,g
          print(json.dumps({
              'status':x['status'],
              'selective_alignment_conclusion':s['selective_alignment_conclusion'],
              'preservation_conclusion':s['preservation_conclusion'],
              'selective_positive_gain_fold_count':s['selective_positive_gain_fold_count'],
              'selective_gain_gt_shuffle_median_fold_count':s['selective_gain_gt_shuffle_median_fold_count'],
              'selective_move_to_teacher_gt_shuffle_median_fold_count':s['selective_move_to_teacher_gt_shuffle_median_fold_count'],
              'selective_preservation_better_than_abs_ce_fold_count':s['selective_preservation_better_than_abs_ce_fold_count'],
              'abs_ce_gain_gt_shuffle_median_fold_count':s['abs_ce_gain_gt_shuffle_median_fold_count'],
              'per_fold':s['per_fold'],
              'next_legal_step':x['next_legal_step'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload M2 mechanistic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-m2-frozen-g0-direction-residual-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_m2_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_m2_python.json
            ${{ runner.temp }}/cb16-r11-m-series-m2-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
