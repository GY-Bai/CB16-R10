name: CB16 Node24 Actions Policy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  node24-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with Node24-native action
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Enforce Node24 action policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          forbidden_opt_out = 'ACTIONS_ALLOW_USE_' + 'UNSECURE_NODE_VERSION'
          checks = [
              (r'actions/checkout@v(?:1|2|3|4)(?:\b|\.)', 'checkout pre-Node24 major'),
              (r'actions/upload-artifact@v(?:1|2|3|4)(?:\b|\.)', 'upload-artifact legacy major'),
              (r'actions/download-artifact@v(?:1|2|3|4)(?:\b|\.)', 'download-artifact legacy major'),
              (re.escape(forbidden_opt_out), 'forbidden Node20 opt-out'),
          ]
          errors=[]
          inventory=[]
          for p in sorted(Path('.github/workflows').glob('*.y*ml')):
              text=p.read_text()
              for pat, desc in checks:
                  if re.search(pat, text):
                      errors.append(f'{p}: {desc}')
              for i, line in enumerate(text.splitlines(), 1):
                  if 'uses:' in line:
                      inventory.append(f'{p}:{i}:{line.strip()}')
          print('--- action inventory ---')
          print('\n'.join(inventory))
          if errors:
              print('NODE24_ACTION_POLICY=FAIL')
              print('\n'.join(errors))
              raise SystemExit(1)
          print('NODE24_ACTION_POLICY=PASS')
          PY
