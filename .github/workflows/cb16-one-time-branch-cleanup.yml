name: CB16 One-Time Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cb16-one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECT_ARCHIVE: fc1378357e6ad5c2efd19d6d53eca767ba7f96d6
      EXPECT_SCIENCE: cff10413f147f755624b0a724c23f235016666ae
      EXPECT_STORAGE: 081863412162dab7947cc5781159cc273d7761e3
      EXPECT_DOCKER: 021adef6485269c8d62339d29525e3510fe78229
    steps:
      - name: Verify all deletion candidates are exact merged ancestors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          check_ref() {
            branch="$1"
            expected="$2"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$actual" = "$expected" || {
              echo "FAIL_CLOSED_REF_MOVED branch=$branch expected=$expected actual=$actual"
              exit 1
            }
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$expected...$GITHUB_SHA" --jq '.status')"
            behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/$expected...$GITHUB_SHA" --jq '.behind_by')"
            merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$expected...$GITHUB_SHA" --jq '.merge_base_commit.sha')"
            test "$behind" = "0"
            test "$merge_base" = "$expected"
            case "$status" in ahead|identical) ;; *) echo "FAIL_CLOSED_NOT_ANCESTOR $branch status=$status"; exit 1 ;; esac
            echo "ANCESTRY_PASS $branch $expected"
          }

          check_ref 'archive/r10.4-canonical' "$EXPECT_ARCHIVE"
          check_ref 'ai/r11-science-g0-historical-r0' "$EXPECT_SCIENCE"
          check_ref 'ai/r11-generational-storage-qualification-r0' "$EXPECT_STORAGE"
          check_ref 'ai/r11-docker-runner-r0' "$EXPECT_DOCKER"

          # Explicit preservation gates.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/ai/v63-activation-r0" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/ci-results" >/dev/null
          echo ALL_DELETE_CANDIDATES_PREVERIFIED

      - name: Delete only the four preverified merged refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            'archive/r10.4-canonical' \
            'ai/r11-science-g0-historical-r0' \
            'ai/r11-generational-storage-qualification-r0' \
            'ai/r11-docker-runner-r0'
          do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "FAIL_CLOSED_REF_STILL_EXISTS $branch"
              exit 1
            fi
            echo "DELETED $branch"
          done

          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/ai/v63-activation-r0" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/ci-results" >/dev/null
          echo BRANCH_CLEANUP_PASS
