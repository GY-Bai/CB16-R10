name: CB16 R11 M-Series H5.16 Full-State Nonlinear Utility Invariance R0

on:
  push:
    branches:
      - ai/m-series-h5-16-full-state-nonlinear-utility-invariance-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_GATE_V1.json
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_PRE_EXECUTION_CLARIFICATION_V1.json
      - cb16_local_opt/full_state_nonlinear_utility_invariance_h516.py
      - tests/test_full_state_nonlinear_utility_invariance_h516.py
      - scripts/r11_m_series_h5_16_full_state_nonlinear_utility_invariance_r0.py
      - .github/workflows/cb16-r11-m-series-h5-16-full-state-nonlinear-utility-invariance-r0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_R104_ROOT: /cb16/runtime/r104

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  h5-16-fixed-rf:
    name: H5.16 bounded fixed-RF utility invariance probe
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify preregistration authority and immutable scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor efd6427a861c836185919d8192f6f74c66cb440e 68f2f7ea43c333983297a67a7253f963db19eb7f
          git merge-base --is-ancestor 68f2f7ea43c333983297a67a7253f963db19eb7f 1fe97c634f0d7850dc638b51f8e068e5c5957e84
          git merge-base --is-ancestor 1fe97c634f0d7850dc638b51f8e068e5c5957e84 HEAD
          test "$(git rev-parse 68f2f7ea43c333983297a67a7253f963db19eb7f:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_GATE_V1.json)" = "b4847abda958f0c3e00b6fb23ccd4463c4e41084"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_GATE_V1.json)" = "b4847abda958f0c3e00b6fb23ccd4463c4e41084"
          test "$(git rev-parse 1fe97c634f0d7850dc638b51f8e068e5c5957e84:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_PRE_EXECUTION_CLARIFICATION_V1.json)" = "c92f8dcbed19175e4781a6095105bd1bd49d20ed"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_PRE_EXECUTION_CLARIFICATION_V1.json)" = "c92f8dcbed19175e4781a6095105bd1bd49d20ed"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_15_FULL_STATE_LINEAR_OFFSET_TRANSPORT_R0_ADJUDICATION_V1.json)" = "22fd3a62b9695e3246eb95b457bfb36ad0b4ce29"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_15_POSTMORTEM_COMPETING_HYPOTHESES_REASSESSMENT_V1.json)" = "41a1b0e70c612ea268d84c15a08752edc84d0836"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_5_STATE_UTILITY_GEOMETRY_TRANSPORT_AUDIT_R0_GATE_V1.json)" = "54b9492e74d5017711b671837ef402abd604c7c6"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_5_STATE_UTILITY_GEOMETRY_TRANSPORT_AUDIT_R0_ADJUDICATION_V1.json)" = "c336e2789ba41e2131679abcd1e6d51c1b545a1c"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/full_state_nonlinear_utility_invariance_h516.py)" = "bfa28be3ad6676f26676404bb170a73b474b6192"
          test "$(git rev-parse HEAD:tests/test_full_state_nonlinear_utility_invariance_h516.py)" = "7937c23facc6305b960c0ec19ae976ebb53df3ae"
          test "$(git rev-parse HEAD:scripts/r11_m_series_h5_16_full_state_nonlinear_utility_invariance_r0.py)" = "f7351e08f6a4c22c009843fc4da60661685f80d5"
          test "$(git rev-parse HEAD:cb16_local_opt/state_utility_geometry_transport_audit_h55.py)" = "1dd00ea9b40b8da4061c0983fc44fb2307c72587"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_temporal_transport_audit_h5.py)" = "09b05de23c659fe6f47a43117ec70b5cafcf7d21"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_vectorized_r11.py)" = "083ca6541b45577cfeb6d9a376b25e0eaf8d060a"
          test "$(git rev-parse HEAD:cb16_local_opt/reduced_teacher_target_information_audit_r6.py)" = "bd7a8780e8dcab05cfae92744fde523ce62cc9ae"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test "$(git rev-parse HEAD:requirements-shanxi-pascal.txt)" = "da3813ec5bfd79973e425ce49eff473db6f07c4b"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_h516_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_h516_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          pk={r['name'].lower():r for r in x['observed']['direct_package_versions']['packages']}
          assert pk['scikit-learn']['satisfied'] is True,pk['scikit-learn']
          PY

      - name: Compile and run H5.16 synthetic and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h516_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/full_state_nonlinear_utility_invariance_h516.py \
            tests/test_full_state_nonlinear_utility_invariance_h516.py \
            scripts/r11_m_series_h5_16_full_state_nonlinear_utility_invariance_r0.py
          "$PYTHON" -m pytest -q \
            tests/test_full_state_nonlinear_utility_invariance_h516.py \
            tests/test_state_utility_geometry_transport_audit_h55.py \
            tests/test_full_state_linear_offset_transport_h515.py

      - name: Execute frozen H5.16 three-arm probe
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h516_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          OUTDIR="$RUNNER_TEMP/cb16-r11-m-series-h516-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$OUTDIR"
          "$PYTHON" -m scripts.r11_m_series_h5_16_full_state_nonlinear_utility_invariance_r0 \
            --r104-root "$CB16_R104_ROOT" \
            --output "$OUTDIR/RESULT.json"
          cp authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_GATE_V1.json "$OUTDIR/GATE.json"
          cp authority/rearchitecture_r11/CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_PRE_EXECUTION_CLARIFICATION_V1.json "$OUTDIR/PRE_EXECUTION_CLARIFICATION.json"
          sha256sum "$OUTDIR/RESULT.json" > "$OUTDIR/SHA256SUMS.txt"
          echo "H516_OUTDIR=$OUTDIR" >> "$GITHUB_ENV"

      - name: Validate H5.16 result contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_h516_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" - "$H516_OUTDIR/RESULT.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['schema']=='CB16_R11_M_SERIES_H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_R0_RESULT_V1',x
          assert x['frozen_scientific_status_before']==x['frozen_scientific_status_after']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          allowed={
            'FULL102_NONLINEAR_LOCAL_MAP_AND_NATIVE_FORWARD_TRANSPORT_SUPPORTED__NO_ENVIRONMENT_INCREMENT',
            'FULL102_NONLINEAR_LOCAL_MAP_EXISTS__FORWARD_NONTRANSPORT__ENVIRONMENT_INDEX_INCREMENT_WITHIN_FIXED_RF',
            'FULL102_NONLINEAR_UTILITY_MAP_WEAK_EVEN_LOCAL',
            'FULL102_NONLINEAR_LOCAL_FORWARD_OR_ENVIRONMENT_INCREMENT_MIXED',
            'EXECUTION_BLOCKED__PARENT_AUTHORITY_DRIFT',
            'EXECUTION_BLOCKED__STATE_UTILITY_OR_ACTION_GRID_DRIFT',
            'EXECUTION_BLOCKED__DEPENDENCE_CLOCK_OR_SCENARIO_DRIFT',
            'EXECUTION_BLOCKED__NONLINEAR_RUNTIME_OR_NUMERICAL_FAILURE',
            'EXECUTION_BLOCKED__NEGATIVE_CONTROL_IDENTITY',
          }
          cls=x['summary']['classification']
          assert cls in allowed,cls
          g=x['semantic_guards']
          assert g['h5_12r_pair_side_ipf_target_used'] is False,g
          assert g['target_is_common_centered_9_action_realized_utility_profile'] is True,g
          assert g['rf_hyperparameter_or_seed_search_used'] is False,g
          assert g['feature_subselection_ablation_or_reweighting_search_used'] is False,g
          assert g['calendar_or_fold_id_runtime_input_used'] is False,g
          assert g['environment_index_runtime_feature_used'] is False,g
          assert g['environment_index_science_diagnostic_only'] is True,g
          assert g['teacher_changed'] is False and g['student_changed'] is False and g['canonical_architecture_changed'] is False,g
          assert g['learned_runtime_router_or_regime_gate_created'] is False,g
          assert g['fresh_market_data_downloaded'] is False and g['final_holdout_payload_opened'] is False,g
          assert g['r7_candidate_evaluated'] is False and g['champion_promoted'] is False,g
          if not cls.startswith('EXECUTION_BLOCKED__'):
              assert x['status']=='H5_16_FULL_STATE_NONLINEAR_UTILITY_INVARIANCE_EXECUTION_COMPLETE',x['status']
              assert len(x['dataset_receipts'])==5,x['dataset_receipts']
              assert len(x['local_results'])==5,x['local_results']
              assert len(x['forward_results'])==4,x['forward_results']
              assert len(x['environment_results'])==4,x['environment_results']
              assert all(r['state_dimension']==102 and r['utility_dimension']==9 and r['scenario_count_per_group']==6 for r in x['dataset_receipts'])
              assert all(r['timestamps_nondecreasing'] is True for r in x['dataset_receipts'])
              assert x['runtime']['fixed_regressor']['n_estimators']==100,x['runtime']
              assert x['runtime']['fixed_regressor']['max_features']==10,x['runtime']
              assert x['runtime']['fixed_regressor']['min_samples_leaf']==5,x['runtime']
              assert x['runtime']['fixed_regressor']['random_state']==51616,x['runtime']
              assert x['runtime']['secondary_classifier_is_gate'] is False,x['runtime']
              assert all(len(r['shift_control_gain'])==5 for r in x['local_results'])
              assert all(len(r['shift_control_gain'])==5 for r in x['forward_results'])
              assert all(len(r['fake_environment_increment'])==5 for r in x['environment_results'])
          print(json.dumps({'classification':cls,'summary':x['summary'],'sklearn_version':x['runtime']['sklearn_version'],'next_legal_step':x['next_legal_step']},indent=2,sort_keys=True))
          PY

      - name: Upload H5.16 evidence
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-h5-16-full-state-nonlinear-utility-invariance-r0-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_h516_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_h516_python.json
            ${{ env.H516_OUTDIR }}/
          if-no-files-found: error
          retention-days: 30
