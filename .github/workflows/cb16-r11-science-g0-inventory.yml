name: CB16 R11 Science G0 Dataset Inventory

on:
  push:
    branches:
      - ai/r11-science-g0-historical-r0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  inventory:
    name: R11 Science G0 Metadata Inventory
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean-main ancestry and frozen authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fc11c18ebd6dd0c883216766ed59cacb05e9a0c0 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          echo SCIENCE_G0_PARENT_AND_FREEZE_PASS

      - name: Run metadata-only dataset inventory
        env:
          CB16_G0_INVENTORY_OUT: /tmp/cb16_r11_science_g0_inventory.json
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r11_science_g0_inventory.py

      - name: Upload inventory engineering evidence
        uses: actions/upload-artifact@v5
        with:
          name: cb16-r11-science-g0-dataset-inventory
          path: /tmp/cb16_r11_science_g0_inventory.json
          if-no-files-found: error
          retention-days: 30
