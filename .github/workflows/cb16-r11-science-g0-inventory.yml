name: CB16 R11 Science G0 Dataset Seal

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_UV_CACHE_DIR: /cb16/uv-cache
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /run/secrets/cb16-provision.env

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  seal:
    name: R11 Science G0 Inventory and Seal
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_g0_inventory_docker_preflight.json"

      - name: Verify clean-main ancestry and frozen authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fc11c18ebd6dd0c883216766ed59cacb05e9a0c0 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          echo SCIENCE_G0_PARENT_AND_FREEZE_PASS

      - name: Run metadata-only dataset inventory
        shell: bash
        run: |
          set -euo pipefail
          export CB16_G0_INVENTORY_OUT="$RUNNER_TEMP/cb16_r11_science_g0_inventory.json"
          python3 scripts/r11_science_g0_inventory.py

      - name: Materialize canonical historical dataset seal
        shell: bash
        run: |
          set -euo pipefail
          export CB16_G0_SEAL_OUT="$RUNNER_TEMP/cb16_r11_science_g0_dataset_seal.json"
          python3 scripts/r11_science_g0_seal.py

      - name: Upload dataset authority evidence
        uses: actions/upload-artifact@v5
        with:
          name: cb16-r11-science-g0-dataset-authority
          path: |
            ${{ runner.temp }}/cb16_r11_science_g0_inventory.json
            ${{ runner.temp }}/cb16_r11_science_g0_dataset_seal.json
          if-no-files-found: error
          retention-days: 30
