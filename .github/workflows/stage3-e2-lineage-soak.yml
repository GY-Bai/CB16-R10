name: stage3-e2-lineage-soak

on:
  push:
    branches:
      - ai/r11-stage3-e2-lineage-soak-r0
    paths:
      - cb16_local_opt/stage3_e2_lineage_soak_r11.py
      - tests/test_stage3_e2_lineage_soak_r11.py
      - .github/workflows/stage3-e2-lineage-soak.yml
  workflow_dispatch:

concurrency:
  group: cb16-r11-stage3-e2-lineage-soak
  cancel-in-progress: false

jobs:
  e2-100-generation-control-plane:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      CB16_STAGE3_E2_RUN_1000: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true

      - name: Verify frozen semantic authority
        run: python3 -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Compile E2 harness and tests
        run: |
          python3 -m py_compile \
            cb16_local_opt/stage3_e2_lineage_soak_r11.py \
            tests/test_stage3_e2_lineage_soak_r11.py

      - name: Run E2 invariant tests
        run: python3 -m pytest -q tests/test_stage3_e2_lineage_soak_r11.py -k 'not 1000_generation_extension'

      - name: Run 100-generation E2 qualification
        run: |
          rm -rf stage3_e2_work stage3_e2_report.json
          python3 -m cb16_local_opt.stage3_e2_lineage_soak_r11 \
            --root stage3_e2_work \
            --repo-root . \
            --generations 100 \
            --synchronous FULL \
            --report stage3_e2_report.json

      - name: Verify machine-readable PASS contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('stage3_e2_report.json')
          r = json.loads(p.read_text())
          assert r['verdict'] == 'PASS', r.get('first_failure')
          assert r['correctness_identity']['status'] == 'CORRECTNESS_PASS'
          assert r['runtime_endurance']['status'] == 'CONTROL_PLANE_RUNTIME_PASS'
          assert r['completed_generations'] == 100
          assert r['final_authority_identity']['generation'] == 100
          assert r['journal_audit']['pass'] is True
          assert r['final_holdout_opened'] is False
          assert r['repeated_frozen_replay_counts_as_new_scientific_evidence'] is False
          PY

      - name: Upload E2 machine-readable ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-e2-lineage-soak-report
          path: stage3_e2_report.json
          if-no-files-found: warn
          retention-days: 30
