name: stage3-e2-lineage-soak

on:
  push:
    branches:
      - ai/r11-stage3-e2-lineage-soak-r0
    paths:
      - cb16_local_opt/stage3_e2_lineage_soak_r11.py
      - tests/test_stage3_e2_lineage_soak_r11.py
      - tests/test_stage3_e2_release_boundary_r11.py
      - .github/workflows/stage3-e2-lineage-soak.yml
  workflow_dispatch:

concurrency:
  group: cb16-r11-stage3-e2-lineage-soak
  cancel-in-progress: false

jobs:
  e2-100-generation-control-plane:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      CB16_STAGE3_E2_RUN_1000: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true

      - name: Resolve verified canonical R11/Pascal Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/python_provision.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/python_provision.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          "$PYBIN" - <<'PY'
          import os, torch
          assert os.cpu_count() == 16
          assert torch.__version__ == '2.8.0+cu126'
          assert torch.version.cuda == '12.6'
          assert torch.cuda.is_available()
          assert tuple(torch.cuda.get_device_capability(0)) == (6, 1)
          assert 'GTX 1060' in torch.cuda.get_device_name(0)
          assert torch.get_default_dtype() == torch.float32
          import pytest
          print('E2_PYTEST=' + pytest.__version__)
          print('E2_CANONICAL_FP32_AMP_FALSE_ENV=PASS')
          PY
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Verify frozen semantic authority
        env:
          PY: ${{ steps.py.outputs.python }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Compile E2 harness and tests
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m py_compile \
            cb16_local_opt/stage3_e2_lineage_soak_r11.py \
            tests/test_stage3_e2_lineage_soak_r11.py \
            tests/test_stage3_e2_release_boundary_r11.py

      - name: Run E2 invariant tests
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage3_e2_lineage_soak_r11.py \
            tests/test_stage3_e2_release_boundary_r11.py \
            -k 'not 1000_generation_extension'

      - name: Run 100-generation E2 qualification
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          rm -rf stage3_e2_work stage3_e2_report.json
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.stage3_e2_lineage_soak_r11 \
            --root stage3_e2_work \
            --repo-root . \
            --generations 100 \
            --synchronous FULL \
            --report stage3_e2_report.json

      - name: Verify 100-generation machine-readable PASS contract
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          p = Path('stage3_e2_report.json')
          r = json.loads(p.read_text())
          assert r['verdict'] == 'PASS', r.get('first_failure')
          assert r['correctness_identity']['status'] == 'CORRECTNESS_PASS'
          assert r['runtime_endurance']['status'] == 'CONTROL_PLANE_RUNTIME_PASS'
          assert r['completed_generations'] == 100
          assert r['final_authority_identity']['generation'] == 100
          assert r['journal_audit']['pass'] is True
          assert r['runtime_endurance']['restart_reconstruction_checks'] == 100
          assert r['runtime_endurance']['attack_rejections'] == 500
          assert r['runtime_endurance']['idempotent_duplicate_checks'] == 400
          assert r['final_holdout_opened'] is False
          assert r['fresh_market_data_downloaded'] is False
          assert r['repeated_frozen_replay_counts_as_new_scientific_evidence'] is False
          PY

      - name: Run 1000-generation logical control-plane extension
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          rm -rf stage3_e2_work_1000 stage3_e2_report_1000.json
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.stage3_e2_lineage_soak_r11 \
            --root stage3_e2_work_1000 \
            --repo-root . \
            --generations 1000 \
            --synchronous OFF \
            --report stage3_e2_report_1000.json

      - name: Verify 1000-generation logical PASS contract
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('stage3_e2_report_1000.json').read_text())
          assert r['verdict'] == 'PASS', r.get('first_failure')
          assert r['correctness_identity']['status'] == 'CORRECTNESS_PASS'
          assert r['runtime_endurance']['status'] == 'CONTROL_PLANE_RUNTIME_PASS'
          assert r['completed_generations'] == 1000
          assert r['final_authority_identity']['generation'] == 1000
          assert r['journal_audit']['pass'] is True
          assert r['runtime_endurance']['restart_reconstruction_checks'] == 1000
          assert r['runtime_endurance']['attack_rejections'] == 5000
          assert r['runtime_endurance']['idempotent_duplicate_checks'] == 4000
          assert r['final_holdout_opened'] is False
          assert r['fresh_market_data_downloaded'] is False
          assert r['repeated_frozen_replay_counts_as_new_scientific_evidence'] is False
          PY

      - name: Upload E2 machine-readable ledgers
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage3-e2-lineage-soak-reports
          path: |
            stage3_e2_report.json
            stage3_e2_report_1000.json
          if-no-files-found: warn
          retention-days: 30
