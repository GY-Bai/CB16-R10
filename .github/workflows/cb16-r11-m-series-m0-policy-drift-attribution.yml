name: CB16 R11 M-Series M0 Policy Drift Attribution

on:
  push:
    branches:
      - ai/m-series-research-r0
    paths:
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_GATE_V1.json
      - authority/rearchitecture_r11/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_GATE_V2.json
      - cb16_local_opt/m_series_m0_policy_drift_attribution.py
      - tests/test_m_series_m0_policy_drift_attribution.py
      - scripts/r11_m_series_m0_policy_drift_attribution.py
      - scripts/r11_m_series_m0_policy_drift_attribution_entrypoint.py
      - .github/workflows/cb16-r11-m-series-m0-policy-drift-attribution.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env
  CB16_PACKAGE_ROOT: /cb16/package

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  m0-policy-drift-attribution:
    name: M0 consumed-TRAIN policy drift attribution
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable M0 V2 preregistration and frozen science ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 62ad74a0c62ab616dfceaf70c6f7b30f7088c81f HEAD
          git merge-base --is-ancestor 54e1b2135acf97fdf34bcaf97e487b929d39fd17 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_GATE_V2.json)" = "ef2edc3d4cdad1ba6e9e808f5ca024ece74bc1ff"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_GATE_V1.json)" = "88b8664f6c8f0d8474ce73872986c6a8a33e3552"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_R11_SCIENCE_G0_REDUCED_TEACHER_TARGET_INFORMATION_AUDIT_R6_GATE_V1.json)" = "1d1254fb03cc00283423426e07ae240a196c627e"
          test "$(git rev-parse HEAD:scripts/r11_science_g0_reduced_teacher_target_information_audit_r6.py)" = "72bede8dd09015c702ec26ead639a81f48efe38a"
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test "$(git rev-parse HEAD:cb16_local_opt/training_runtime_r11.py)" = "56c227800d7a5c82ef88c691bb69d7550aee8b39"
          test "$(git rev-parse HEAD:cb16_local_opt/teacher_runtime_r11.py)" = "656f1483f2e6a96daae5c98eb96cd75805d3547c"
          test -f "$CB16_G0_ROOT/bootstrap/R11_G0_INITIAL_CHAMPION.pt"
          test -f "$CB16_R104_ROOT/REAL_EVIDENCE_CACHE_MANIFEST_R102.json"
          test -d "$CB16_PACKAGE_ROOT"

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_m0_docker_preflight.json"

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_m0_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='READY',x
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE',x
          assert x['python']['network_install_attempted'] is False,x
          assert x['observed']['python_series']==[3,10],x
          PY

      - name: Compile and run M0 unit and regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_m0_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/m_series_m0_policy_drift_attribution.py \
            tests/test_m_series_m0_policy_drift_attribution.py \
            scripts/r11_m_series_m0_policy_drift_attribution.py \
            scripts/r11_m_series_m0_policy_drift_attribution_entrypoint.py
          "$PYTHON" -m pytest -q \
            tests/test_m_series_m0_policy_drift_attribution.py \
            tests/test_reduced_teacher_target_information_audit_r6.py \
            tests/test_training_runtime_r11.py \
            tests/test_training_integration_r11.py \
            tests/test_r11_teacher_balanced_binding.py \
            tests/test_teacher_runtime_r11.py

      - name: Execute preregistered M0 attribution audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_m0_python.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-m-series-m0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"; mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_m0_run_root.txt"
          "$PYTHON" scripts/r11_m_series_m0_policy_drift_attribution_entrypoint.py \
            --g0-root "$CB16_G0_ROOT" \
            --package-root "$CB16_PACKAGE_ROOT" \
            --r104-root "$CB16_R104_ROOT" \
            --work-root "$RUN_ROOT" \
            --output "$RUN_ROOT/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_RESULT.json" \
            --device cuda

      - name: Verify M0 receipt and semantic guards
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_m0_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_RESULT.json" "$RUN_ROOT" <<'PY'
          import hashlib,json,math,pathlib,sys
          result_path=pathlib.Path(sys.argv[1]); root=pathlib.Path(sys.argv[2])
          x=json.load(open(result_path))
          assert x['schema']=='CB16_R11_M_SERIES_M0_POLICY_DRIFT_ATTRIBUTION_RESULT_V1',x
          assert x['frozen_scientific_status_before']=='DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE',x
          assert x['frozen_scientific_status_after']==x['frozen_scientific_status_before'],x
          s=x['semantic_guards']
          for k in ('canonical_generation_advanced','champion_promoted','production_cutover','market_information_verdict_reopened','scientific_market_verdict_created','profitability_or_alpha_claimed','r7_candidate_evaluated','final_holdout_payload_opened','fresh_market_data_downloaded','r5_purge_support_reopened','legacy_validation_rows_used','raw_market_payload_used'):
              assert s[k] is False,(k,x)
          assert s['frozen_package_unchanged'] is True and s['g0_authority_unchanged'] is True,x
          if x['status']=='M0_SUPPORT_NOT_READY':
              assert x['primary_adjudication_performed'] is False,x
              print(json.dumps({'status':x['status'],'reason':x['reason'],'next_legal_step':x['next_legal_step']},indent=2,sort_keys=True))
          else:
              assert x['status']=='M0_POLICY_DRIFT_ATTRIBUTION_PASS',x
              assert len(x['fold_results'])==5,x
              assert x['protocol']['r7_candidate_evaluated'] is False,x
              assert x['protocol']['softmax_log_ratio_advantage_used'] is False,x
              assert x['protocol']['continuous_g0_requested_risk_projection_used'] is False,x
              assert x['protocol']['independent_quantile_subtraction_used'] is False,x
              for f in x['fold_results']:
                  assert f['fold'] in (1,2,3,4,5),f
                  assert f['r6_aligned_numeric_reproduction'] is True,f
                  a=f['policy_drift_attribution']
                  assert a['rows'] > 0,a
                  assert sum(a['class_counts'].values()) == a['rows'],a
                  assert a['softmax_log_ratio_advantage_used'] is False,a
                  assert a['continuous_g0_requested_risk_projection_used'] is False,a
                  assert a['independent_quantile_subtraction_used'] is False,a
                  c=a['direction_change_count']
                  if c:
                      d=float(a['direct_teacher_correction_fraction_of_all_direction_changes'])
                      n=float(a['non_teacher_attributable_fraction_of_all_direction_changes'])
                      assert math.isclose(d+n,1.0,rel_tol=0.0,abs_tol=1e-12),a
                  rr=f['row_evidence']
                  p=root/f"fold_{f['fold']}"/rr['file']
                  assert p.is_file(),p
                  assert sum(1 for _ in open(p,encoding='utf-8')) == rr['rows'],rr
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert h==rr['sha256'],rr
              a=x['m0_summary']
              assert a['conclusion'] in {
                  'DIRECTION_UPDATE_MAJORITY_TEACHER_ATTRIBUTABLE_ON_CONSUMED_TRAIN_ONLY_SUPPORT',
                  'DIRECTION_UPDATE_MAJORITY_NOT_TEACHER_ATTRIBUTABLE_ON_CONSUMED_TRAIN_ONLY_SUPPORT',
                  'MIXED_POLICY_DRIFT_ATTRIBUTION_ON_CONSUMED_TRAIN_ONLY_SUPPORT',
              },a
              assert a['market_information_verdict'] is False,a
              assert a['canonical_promotion_authorized'] is False,a
              assert a['r7_candidate_evaluated'] is False,a
              print(json.dumps({
                  'status':x['status'],
                  'conclusion':a['conclusion'],
                  'direct_teacher_correction_majority_fold_count':a['direct_teacher_correction_majority_fold_count'],
                  'non_teacher_attributable_majority_fold_count':a['non_teacher_attributable_majority_fold_count'],
                  'per_fold':a['per_fold'],
                  'next_legal_step':x['next_legal_step'],
              },indent=2,sort_keys=True))
          PY

      - name: Upload M0 mechanistic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-m-series-m0-policy-drift-attribution-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_m0_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_m0_python.json
            ${{ runner.temp }}/cb16-r11-m-series-m0-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
