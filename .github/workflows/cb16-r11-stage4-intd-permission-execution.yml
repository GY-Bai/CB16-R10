name: CB16 R11 Stage4 INTD Permission Execution

on:
  push:
    branches:
      - ai/r11-stage4-int-d-permission-execution-r0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb16-r11-stage4-intd-permission-execution
  cancel-in-progress: false

jobs:
  intd-permission-execution:
    runs-on: [self-hosted, shanxi, cb16-wss-qualification]
    timeout-minutes: 10
    steps:
      - name: Checkout INTD branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable seed ancestry and owned paths
        shell: bash
        run: |
          set -euo pipefail
          SEED=86a4ac8a9080cd8382600cb998059e9585495a11
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SEED" HEAD
          if [[ -n "$(git rev-list --merges "$SEED..HEAD")" ]]; then
            echo "INTD forbids sibling integration merges" >&2
            exit 1
          fi
          SEED_FREEZE="$(git rev-parse "$SEED:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")"
          HEAD_FREEZE="$(git rev-parse "HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json")"
          [[ "$SEED_FREEZE" == "$HEAD_FREEZE" ]]
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/cb16-r11-stage4-intd-permission-execution.yml|\
              cb16_local_opt/stage4_execution_integration_r11.py|\
              tests/test_stage4_execution_integration_r11.py|\
              docs/CB16_R11_STAGE4_INTD_PERMISSION_EXECUTION_R0.md|\
              authority/rearchitecture_r11/stage4_integration_receipts/INTD_RECEIPT_V1.json)
                ;;
              *)
                echo "INTD touched path outside ownership: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$SEED..HEAD")

      - name: Resolve verified qualification Python
        id: py
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python3 ci/resolve_verified_r104_python.py --out ci_evidence/intd_python.json
          PYBIN="$(python3 - <<'PY'
          import json
          x=json.load(open('ci_evidence/intd_python.json'))
          assert x['status']=='READY'
          assert x['mode']=='VERIFIED_CANONICAL_R104_VENV_REUSE'
          print(x['python']['venv'] + '/bin/python')
          PY
          )"
          echo "python=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Run INTD and upstream composable contract tests
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m pytest -q \
            tests/test_stage4_gatework_r11.py \
            tests/test_stage4_permission_boundary_r11.py \
            tests/test_stage4_legacy_retirement_r11.py \
            tests/test_stage4_execution_integration_r11.py

      - name: Frozen semantic authority guard
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" "$PY" -m cb16_local_opt.rearchitecture_authority_r11 static --repo-root .

      - name: Receipt shape check when present
        shell: bash
        env:
          PY: ${{ steps.py.outputs.python }}
        run: |
          set -euo pipefail
          RECEIPT=authority/rearchitecture_r11/stage4_integration_receipts/INTD_RECEIPT_V1.json
          if [[ ! -f "$RECEIPT" ]]; then
            echo "INTD implementation head: receipt intentionally absent"
            exit 0
          fi
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          p=Path("authority/rearchitecture_r11/stage4_integration_receipts/INTD_RECEIPT_V1.json")
          x=json.loads(p.read_text())
          assert x["schema"]=="CB16_R11_STAGE4_INTEGRATION_RECEIPT_V1"
          assert x["task_id"]=="INTD"
          assert x["status"]=="PASS"
          assert x["integration_seed_sha"]=="86a4ac8a9080cd8382600cb998059e9585495a11"
          assert x["branch"]=="ai/r11-stage4-int-d-permission-execution-r0"
          assert x["scientific_status"]=="DISTRIBUTIONAL_MARKET_INFORMATION_NOT_QUALIFIED__TRUE_WORSE_THAN_SHUFFLE"
          guards=x["semantic_guards"]
          assert guards=={
              "semantic_freeze_unchanged": True,
              "final_holdout_untouched": True,
              "fresh_market_data_downloaded": False,
              "historical_market_data_mutated": False,
              "new_scientific_verdict": False,
              "scientific_semantics_changed": False,
              "replay_reinterpreted_as_new_evidence": False,
              "sibling_integration_dependency_used": False,
              "pushed_to_seed_or_final_branch": False,
              "long_endurance_run": False,
          }
          print("INTD_RECEIPT_SHAPE_PASS")
          PY
