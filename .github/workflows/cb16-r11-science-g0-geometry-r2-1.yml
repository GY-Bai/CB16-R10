name: CB16 R11 Science G0 Teacher Geometry R2.1

on:
  push:
    branches:
      - ai/r11-science-g0-geometry-r2-1
    paths:
      - cb16_local_opt/science_teacher_geometry_r11.py
      - scripts/r11_science_g0_geometry_r2_1.py
      - scripts/r11_science_g0_geometry_r2_1_entrypoint.py
      - tests/test_science_teacher_geometry_r11.py
      - .github/workflows/cb16-r11-science-g0-geometry-r2-1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CB16_RAW_ROOT: /cb16/raw
  CB16_G0_ROOT: /cb16/g0
  CB16_R11_G0_ROOT: /cb16/g0
  CB16_R104_ROOT: /cb16/runtime/r104
  CB16_VERIFIED_VENV: /cb16/venv
  CB16_CI_WORKER_ROOT: /cb16/worker
  CB16_PROVISION_ENV: /cb16/worker/provision.env
  CB16_PACKAGE_ROOT: /cb16/package

jobs:
  shanxi-preflight:
    uses: ./.github/workflows/_cb16-shanxi-preflight.yml

  teacher-geometry-r2-1:
    name: Real historical Teacher geometry shadow adjudication
    needs: shanxi-preflight
    runs-on: [self-hosted, shanxi-docker-r11]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Docker execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/docker_preflight.py --json-out "$RUNNER_TEMP/cb16_r11_science_g0_r2_1_docker_preflight.json"

      - name: Verify R2-qualified seed and immutable authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9d04df9976321321028a4ebec548c2b5dbc01166 HEAD
          test "$(git rev-parse HEAD:authority/rearchitecture_r11/CB16_SEMANTIC_FREEZE_V1.json)" = "3c401a0a350984381912f7860181e3e96eb8d7cf"
          test -f /cb16/g0/authority/CB16_R11_G0_GENESIS_SOURCE_RECORD.json
          test -f /cb16/g0/authority/CB16_R11_G0_DERIVED_CACHE_LINEAGE.json
          test -f /cb16/g0/bootstrap/R11_G0_INITIAL_CHAMPION.pt
          test -d /cb16/g0/market_cache
          test -d /cb16/package

      - name: Resolve verified canonical Python
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cb16_r11_science_g0_r2_1_python.json"
          python3 ci/resolve_verified_r104_python.py --out "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['status'] == 'READY', p
          assert p['mode'] == 'VERIFIED_CANONICAL_R104_VENV_REUSE', p
          assert p['python']['network_install_attempted'] is False, p
          assert p['observed']['python_series'] == [3,10], p
          PY

      - name: Compile and run R2.1 geometry unit gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_science_g0_r2_1_python.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          "$PYTHON" -m py_compile \
            cb16_local_opt/science_teacher_geometry_r11.py \
            scripts/r11_science_g0_geometry_r2_1.py \
            scripts/r11_science_g0_geometry_r2_1_entrypoint.py \
            tests/test_science_teacher_geometry_r11.py
          "$PYTHON" -m pytest -q \
            tests/test_science_teacher_geometry_r11.py \
            tests/test_teacher_vectorized_r11.py \
            tests/test_teacher_runtime_r11.py

      - name: Execute real-history multi-account Teacher geometry R2.1
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=$(python3 - "$RUNNER_TEMP/cb16_r11_science_g0_r2_1_python.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['python']['venv'] + '/bin/python')
          PY
          )
          RUN_ROOT="$RUNNER_TEMP/cb16-r11-science-g0-geometry-r2-1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$RUN_ROOT"
          mkdir -p "$RUN_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$RUNNER_TEMP/cb16_r11_science_g0_r2_1_run_root.txt"
          "$PYTHON" scripts/r11_science_g0_geometry_r2_1_entrypoint.py \
            --g0-root "$CB16_G0_ROOT" \
            --package-root "$CB16_PACKAGE_ROOT" \
            --work-root "$RUN_ROOT" \
            --output "$RUN_ROOT/CB16_R11_SCIENCE_G0_TEACHER_GEOMETRY_R2_1_RESULT.json" \
            --device cuda \
            --symbol BTCUSDT \
            --train-groups 48 \
            --validation-groups 12 \
            --candidate-factor 2 \
            --sensory-batch-size 8 \
            --block-targets 8 \
            --replicas 32

      - name: Verify R2.1 adjudication gates
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT=$(cat "$RUNNER_TEMP/cb16_r11_science_g0_r2_1_run_root.txt")
          python3 - "$RUN_ROOT/CB16_R11_SCIENCE_G0_TEACHER_GEOMETRY_R2_1_RESULT.json" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1]))
          assert x['schema'] == 'CB16_R11_SCIENCE_G0_TEACHER_GEOMETRY_R2_1_RESULT_V1', x
          assert x['status'] == 'R11_TEACHER_GEOMETRY_SHADOW_ADJUDICATION_PASS_WITH_CURRENT_AUTHORITY_FINDING', x
          c=x['current_frozen_teacher']
          s=x['dependence_balanced_shadow']
          assert c['replica_train_delta']['content_hash_changed_targets'] + c['replica_validation_delta']['content_hash_changed_targets'] > 0, x
          assert s['exact_replica_invariant'] is True, x
          assert s['replica_train_delta']['content_hash_changed_targets'] == 0, x
          assert s['replica_validation_delta']['content_hash_changed_targets'] == 0, x
          a=x['adjudication']
          assert a['current_teacher_authority_changed'] is False, x
          assert a['shadow_teacher_promoted'] is False, x
          assert a['teacher_requalification_required_before_any_cutover'] is True, x
          assert a['student_distributional_head_change_authorized'] is False, x
          assert a['qr_dqn_conversion_authorized'] is False, x
          g=x['semantic_guards']
          assert g['teacher_semantics_changed'] is False, x
          assert g['scientific_verdict_created'] is False, x
          assert g['final_holdout_payload_opened'] is False, x
          assert g['fresh_market_data_downloaded'] is False, x
          print(json.dumps({
              'status': x['status'],
              'base_context_identity_counts': x['historical_scope']['base_context_identity_counts'],
              'current_replica_train_delta': c['replica_train_delta'],
              'current_replica_validation_delta': c['replica_validation_delta'],
              'shadow_replica_train_delta': s['replica_train_delta'],
              'shadow_replica_validation_delta': s['replica_validation_delta'],
              'baseline_semantic_delta_current_vs_shadow': x['baseline_semantic_delta_current_vs_shadow'],
              'teacher_authority_changed': False,
              'scientific_verdict_created': False,
              'final_holdout_payload_opened': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload compact R2.1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-r11-science-g0-geometry-r2-1-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cb16_r11_science_g0_r2_1_docker_preflight.json
            ${{ runner.temp }}/cb16_r11_science_g0_r2_1_python.json
            ${{ runner.temp }}/cb16-r11-science-g0-geometry-r2-1-${{ github.run_id }}-${{ github.run_attempt }}/CB16_R11_SCIENCE_G0_TEACHER_GEOMETRY_R2_1_RESULT.json
          if-no-files-found: warn
          retention-days: 30
